<script>
  var _pendenciasCache = null;
  var _pendenciasLoadedAt = null;
  var _pendenciasRefreshing = false;
  var _pendenciasRefreshWaiters = [];
  var _pendenciasRefreshQueued = false;
  var _pendenciasRefreshVisible = false;
  var PENDENCIAS_VISIBLE_LIMIT = 10;
  var PENDENCIAS_TTL_MS = 3 * 60 * 1000;
  window.STATE = window.STATE || {};
  var STATE = window.STATE;
  STATE.pendencias = STATE.pendencias || {};
  STATE.pendencias.expanded = STATE.pendencias.expanded || {};

  function pendenciasWarning(data) {
    var unavailable = data && data.unavailable;
    return unavailable ? Object.keys(unavailable).map(function(key) { return unavailable[key]; }).filter(Boolean).join(' ') : '';
  }

  function pendenciasLoadedAtTime() {
    if (_pendenciasLoadedAt instanceof Date) return _pendenciasLoadedAt.getTime();
    return Number(_pendenciasLoadedAt || STATE.pendencias.loadedAt || 0);
  }

  function setPendenciasLoadedAtState(value) {
    _pendenciasLoadedAt = value instanceof Date ? value : new Date(Number(value || Date.now()));
    STATE.pendencias.loadedAt = _pendenciasLoadedAt.getTime();
    return _pendenciasLoadedAt;
  }

  function pendenciasEstaoDesatualizadas() {
    if (pendenciasWarning(_pendenciasCache)) return true;
    var loadedAt = pendenciasLoadedAtTime();
    return !loadedAt || (Date.now() - loadedAt) > PENDENCIAS_TTL_MS;
  }

  function pendenciasEstaAtiva() {
    if (typeof getCurrentPage === 'function') return getCurrentPage() === 'pendencias';
    var page = document.getElementById('page-pendencias');
    return !!(page && page.classList.contains('active'));
  }

  function setupPendenciasAutoRefreshListeners() {
    if (STATE.pendencias.autoRefreshListenersStarted) return;
    STATE.pendencias.autoRefreshListenersStarted = true;
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden && pendenciasEstaAtiva()) pendenciasRevalidarEmBackground(false);
    });
    window.addEventListener('focus', function() {
      if (pendenciasEstaAtiva()) pendenciasRevalidarEmBackground(false);
    });
  }

  function pendenciasRevalidarEmBackground(force) {
    if (_pendenciasRefreshing) return;
    if (!force && !pendenciasEstaoDesatualizadas()) return;
    carregarPendencias(!!force, { silent: true });
  }

  function pendenciaAgendaAction(it) {
    return function() { abrirPendenciaAgenda(it && it.agendaId); };
  }

  function pendenciaAgendaRegistroAction(it) {
    return function() { abrirPendenciaAgendaRegistro(it && it.agendaId); };
  }

  function pendenciaAwbAction(it) {
    return function() { abrirPendenciaAwb(it && it.agendaId); };
  }

  function pendenciaEstoqueAction(it) {
    var q = (it && (it.idItem || it.descricao || it.projeto)) || '';
    return function() { abrirPendenciaEstoque(q); };
  }

  function abrirPendenciaTracking(ev, url) {
    if (ev && ev.stopPropagation) ev.stopPropagation();
    url = String(url || '').trim();
    if (url) window.open(url, '_blank', 'noopener');
  }

  function pendenciaUrgente24h(it) {
    var h = it && it.prazoHoras !== null && it.prazoHoras !== undefined ? Number(it.prazoHoras) : null;
    return h !== null && isFinite(h) && h <= 24;
  }

  function pendenciaPrazoLabel(it) {
    var h = it && it.prazoHoras !== null && it.prazoHoras !== undefined ? Number(it.prazoHoras) : null;
    if (h === null || !isFinite(h) || h > 24) return '';
    if (h < 0) return 'atrasada';
    if (h < 1) return 'agora';
    if (h < 2) return 'em 1h';
    return 'em ' + Math.round(h) + 'h';
  }

  function pendenciaCourierComTemperatura(it) {
    var courier = String((it && it.courier) || '').trim();
    var temperatura = String((it && it.temperatura) || '').trim();
    if (!temperatura || courier.indexOf(temperatura) >= 0) return courier;
    return [courier, temperatura].filter(Boolean).join(' / ');
  }

  function togglePendenciasCard(btn) {
    var card = btn && btn.closest ? btn.closest('.dash-pend-card') : null;
    if (!card) return;
    if (!card.classList.contains('expanded') && card._pendenciasMountRemaining) {
      card._pendenciasMountRemaining();
      card._pendenciasMountRemaining = null;
    }
    var expanded = card.classList.toggle('expanded');
    STATE.pendencias.expanded[card.getAttribute('data-pendencia-card')] = expanded;
    var label = btn.querySelector('.dash-pend-more-label');
    var icon = btn.querySelector('.material-symbols-outlined');
    var remaining = Number(btn.getAttribute('data-remaining') || 0);
    btn.setAttribute('aria-expanded', expanded ? 'true' : 'false');
    if (label) label.textContent = expanded ? 'Mostrar menos' : 'Mostrar mais (' + remaining + ')';
    if (icon) icon.textContent = expanded ? 'expand_less' : 'expand_more';
  }

  function renderDashboardPendencias(p, gridId) {
    p = p || {};
    var counts = p.counts || {};
    var grid = document.getElementById(gridId || 'pendenciasGrid');
    if (!grid) return;
    var cards = [
      {
        key: 'courierNaoAgendada',
        title: 'Courier não agendada',
        icon: 'local_shipping',
        tone: '#856404',
        bg: '#fff3cd',
        priority: true,
        action: pendenciaAgendaRegistroAction,
        items: p.courierNaoAgendada || [],
        render: function(it) {
          return {
            main: [it.data, it.hora, it.participante || it.projeto].filter(Boolean).join(' · '),
            meta: [it.slot, pendenciaCourierComTemperatura(it), it.projeto, it.visita].filter(Boolean).join(' · ')
          };
        }
      },
      {
        key: 'courierNaoConfirmada',
        title: 'Courier não confirmada',
        icon: 'mark_email_unread',
        tone: '#0059a8',
        bg: '#d8ebff',
        priority: true,
        action: pendenciaAgendaRegistroAction,
        items: p.courierNaoConfirmada || [],
        render: function(it) {
          return {
            main: [it.data, it.hora, it.participante || it.projeto].filter(Boolean).join(' · '),
            meta: [it.slot, pendenciaCourierComTemperatura(it), it.awb ? 'AWB ' + it.awb : '', it.projeto, it.lembreteStatus].filter(Boolean).join(' · ')
          };
        }
      },
      {
        key: 'awbEnviadaNaoEntregue',
        title: 'AWB enviada não entregue',
        icon: 'outbox',
        tone: '#0f766e',
        bg: '#d9f5ef',
        action: pendenciaAwbAction,
        items: p.awbEnviadaNaoEntregue || [],
        render: function(it) {
          return {
            main: [it.awb ? 'AWB ' + it.awb : 'AWB enviada', it.participante || it.projeto].filter(Boolean).join(' · '),
            meta: [it.slot, pendenciaCourierComTemperatura(it), it.data, it.hora, it.projeto].filter(Boolean).join(' · ')
          };
        }
      },
      {
        key: 'requisicaoExamesPendente',
        title: 'Requisição de exames pendente',
        icon: 'assignment_late',
        tone: '#b3261e',
        bg: '#fce8e6',
        priority: true,
        action: pendenciaAgendaAction,
        items: p.requisicaoExamesPendente || [],
        render: function(it) {
          return {
            main: [it.data, it.hora, it.participante || it.projeto].filter(Boolean).join(' · '),
            meta: [it.prestador, it.projeto, it.visita].filter(Boolean).join(' · ')
          };
        }
      },
      {
        key: 'posVisitaPoloTrialPendente',
        title: 'Polo Trial pendente',
        icon: 'fact_check',
        tone: '#9a4b16',
        bg: '#fff7e6',
        priority: true,
        action: pendenciaAgendaRegistroAction,
        items: p.posVisitaPoloTrialPendente || [],
        render: function(it) {
          return {
            main: [it.data, it.hora, it.participante || it.projeto].filter(Boolean).join(' · '),
            meta: ['Cadastrar no Polo Trial', it.projeto, it.visita, it.status].filter(Boolean).join(' · ')
          };
        }
      },
      {
        key: 'posVisitaEcrfPendente',
        title: 'eCRF pendente',
        icon: 'dynamic_form',
        tone: '#5b21b6',
        bg: '#f5f3ff',
        priority: true,
        action: pendenciaAgendaRegistroAction,
        items: p.posVisitaEcrfPendente || [],
        render: function(it) {
          return {
            main: [it.data, it.hora, it.participante || it.projeto].filter(Boolean).join(' · '),
            meta: ['Preencher eCRF', it.projeto, it.visita, it.status].filter(Boolean).join(' · ')
          };
        }
      },
      {
        key: 'kitsVencendo',
        title: 'Kits vencendo',
        icon: 'event_busy',
        tone: '#6a1b9a',
        bg: '#f3e8ff',
        action: pendenciaEstoqueAction,
        items: p.kitsVencendo || [],
        render: function(it) {
          var dias = Number(it.dias || 0);
          return {
            main: [it.descricao || it.idItem || 'Kit', it.validade ? 'vence ' + it.validade : ''].filter(Boolean).join(' · '),
            meta: [it.projeto, dias === 0 ? 'vence hoje' : 'vence em ' + dias + ' dia(s)', it.qtde !== '' && it.qtde !== undefined ? 'qtd ' + it.qtde : ''].filter(Boolean).join(' · ')
          };
        }
      },
      {
        key: 'transporteBackupNaoAgendado',
        title: 'Transporte de Amostras Backup não agendado',
        icon: 'inventory',
        tone: '#5b21b6',
        bg: '#f5f3ff',
        priority: true,
        action: pendenciaAgendaRegistroAction,
        items: p.transporteBackupNaoAgendado || [],
        render: function(it) {
          return {
            main: [it.data, it.hora, it.participante || it.projeto].filter(Boolean).join(' · '),
            meta: [pendenciaCourierComTemperatura(it), it.projeto, it.visita].filter(Boolean).join(' · ')
          };
        }
      },
      {
        key: 'documentacaoTransporteSemEnvio',
        title: 'Documentação de transporte sem envio',
        icon: 'drafts',
        tone: '#8a4b08',
        bg: '#fff4df',
        priority: true,
        action: pendenciaAgendaRegistroAction,
        items: p.documentacaoTransporteSemEnvio || [],
        render: function(it) {
          return {
            main: [it.data, it.hora, it.participante || it.projeto].filter(Boolean).join(' · '),
            meta: [it.slot, pendenciaCourierComTemperatura(it), it.awb ? 'AWB ' + it.awb : '', it.motivo, it.projeto].filter(Boolean).join(' · ')
          };
        }
      }
    ];
    var plans = cards.map(function(card) {
      var handlers = [];
      function bindAction(handler) {
        return ' data-pendencia-action="' + (handlers.push(handler) - 1) + '"';
      }
      var unavailable = p.unavailable && p.unavailable[card.key];
      var cardKey = (gridId || 'pendenciasGrid') + ':' + card.key;
      var expanded = !!STATE.pendencias.expanded[cardKey];
      var total = counts[card.key] || (card.items || []).length || 0;
      // Inclui contagem e indisponibilidade: itens iguais não garantem card igual.
      var signature = JSON.stringify([card.items, total, unavailable || '']);
      var previous = grid.querySelector ? grid.querySelector('[data-pendencia-card="' + cardKey + '"]') : null;
      if (previous && previous._pendenciasSignature === signature) return { previous: previous };
      var urgentTotal = card.priority ? (card.items || []).filter(pendenciaUrgente24h).length : 0;
      var cardItems = card.items || [];
      var remaining = Math.max(0, cardItems.length - PENDENCIAS_VISIBLE_LIMIT);
      function renderRows(items, offset) {
        return items.map(function(it, index) {
        var itemIndex = offset + index;
        var r = card.render(it);
        var action = typeof card.action === 'function' ? card.action(it) : card.action;
        var urgent = card.priority && pendenciaUrgente24h(it);
        var prazo = urgent ? pendenciaPrazoLabel(it) : '';
        var tracking = card.key === 'awbEnviadaNaoEntregue' && it.trackingUrl
          ? '<button type="button" class="dash-pend-track" title="Abrir rastreio" aria-label="Abrir rastreio"' + bindAction(function(event) { abrirPendenciaTracking(event, it.trackingUrl); }) + '><span class="material-symbols-outlined">travel_explore</span></button>'
          : '';
        var confirmDelivery = card.key === 'awbEnviadaNaoEntregue'
          ? '<button type="button" class="dash-pend-confirm" title="Confirmar entrega"' + bindAction(function(event) {
              confirmarEntregaPendencia(event, it.agendaId, it.slot, it.awb, it.participante, it.courier, it.temperatura, it.data, it.hora, it.projeto, it.visita);
            }) + '><span class="material-symbols-outlined">task_alt</span><span>Confirmar entrega</span></button>'
          : '';
        return '<div class="dash-pend-item' + (urgent ? ' urgent' : '') + (itemIndex >= PENDENCIAS_VISIBLE_LIMIT ? ' dash-pend-overflow' : '') + '">' +
          (urgent ? '<div class="dash-pend-alert"><span class="material-symbols-outlined">priority_high</span>' + esc(prazo || 'até 24h') + '</div>' : '') +
          '<div class="dash-pend-row"><button type="button" class="dash-pend-text dash-pend-open" title="' + esc((r.main || '') + ' ' + (r.meta || '')) + '"' + bindAction(action) + '>' +
            '<span class="dash-pend-main">' + esc(r.main || '-') + '</span>' +
            '<span class="dash-pend-meta">' + esc(r.meta || '-') + '</span>' +
          '</button>' + tracking + confirmDelivery + '</div>' +
        '</div>';
        }).join('');
      }
      var rows = unavailable ? '' : renderRows(expanded ? cardItems : cardItems.slice(0, PENDENCIAS_VISIBLE_LIMIT), 0);
      if (unavailable) rows = '<div class="dash-pend-empty"><span class="material-symbols-outlined">warning</span>' + esc(unavailable) + '</div>';
      else if (!rows) rows = '<div class="dash-pend-empty"><span class="material-symbols-outlined">check_circle</span>Sem pendências</div>';
      var expandButton = remaining && !unavailable ? '<button type="button" class="dash-pend-more" data-remaining="' + remaining + '" aria-expanded="' + (expanded ? 'true' : 'false') + '"' + bindAction(function(event, button) { togglePendenciasCard(button || event.currentTarget); }) + '>' +
        '<span class="dash-pend-more-label">' + (expanded ? 'Mostrar menos' : 'Mostrar mais (' + remaining + ')') + '</span>' +
        '<span class="material-symbols-outlined">' + (expanded ? 'expand_less' : 'expand_more') + '</span>' +
      '</button>' : '';
      var html = '<div data-pendencia-card="' + esc(cardKey) + '" class="dash-pend-card' + (card.priority ? ' priority' : '') + (expanded ? ' expanded' : '') + '" style="--tone:' + card.tone + ';--tone-bg:' + card.bg + '">' +
        '<div class="dash-pend-head">' +
          '<div class="dash-pend-icon"><span class="material-symbols-outlined">' + card.icon + '</span></div>' +
          '<div class="dash-pend-title">' + esc(card.title) + '</div>' +
          (urgentTotal ? '<div class="dash-pend-urgent-count">' + esc(urgentTotal) + ' urgentes</div>' : '') +
          '<div class="dash-pend-count">' + (unavailable ? '—' : esc(total)) + '</div>' +
        '</div>' +
        '<div class="dash-pend-list">' + rows + '</div>' + expandButton +
      '</div>';
      return { previous: previous, html: html, signature: signature, handlers: handlers,
        mountRemaining: remaining && !expanded && !unavailable ? function(element) {
          element.querySelector('.dash-pend-list').insertAdjacentHTML('beforeend', renderRows(cardItems.slice(PENDENCIAS_VISIBLE_LIMIT), PENDENCIAS_VISIBLE_LIMIT));
        } : null };
    });
    // Prepara todos os cards antes de alterar o DOM; falha de serialização/render
    // não deixa a tela aplicada pela metade. Cada card mantém seus próprios handlers.
    var prepared = plans.map(function(plan) {
      if (!plan.html) return plan.previous;
      var holder = document.createElement('div');
      holder.innerHTML = plan.html;
      var element = holder.firstElementChild;
      element._pendenciasSignature = plan.signature;
      element._pendenciasHandlers = plan.handlers;
      element._pendenciasMountRemaining = plan.mountRemaining ? function() { plan.mountRemaining(element); } : null;
      return element;
    });
    plans.forEach(function(plan, index) {
      var element = prepared[index];
      if (!plan.html) return;
      if (plan.previous) plan.previous.replaceWith(element);
      else grid.appendChild(element);
    });
    // Descarta placeholders de loading/erro, preservando os cards reaproveitados.
    Array.from(grid.children).forEach(function(element) {
      if (prepared.indexOf(element) === -1) element.remove();
    });
    if (!grid._pendenciasClickBound) {
      grid.addEventListener('click', function(event) {
        var button = event.target.closest ? event.target.closest('[data-pendencia-action]') : null;
        if (!button || !grid.contains(button)) return;
        var card = button.closest('[data-pendencia-card]');
        var handler = card && card._pendenciasHandlers && card._pendenciasHandlers[Number(button.getAttribute('data-pendencia-action'))];
        if (typeof handler === 'function') handler(event, button);
      });
      grid._pendenciasClickBound = true;
    }
  }

  function atualizarPendenciasTs(fromCache) {
    var ts = document.getElementById('pendenciasTs');
    if (!ts) return;
    if (!_pendenciasLoadedAt) {
      ts.textContent = '';
      return;
    }
    var prefix = fromCache ? 'Em memória: ' : 'Atualizado: ';
    ts.textContent = prefix + _pendenciasLoadedAt.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
  }

  function setPendenciasStatus(msg, type, partial) {
    STATE.pendencias.partialStatus = !!partial;
    var el = document.getElementById('pendenciasStatus');
    if (!el) return;
    var color = type === 'ok' ? '#137333' : (type === 'danger' ? '#e53935' : (type === 'warn' ? '#7a5c00' : '#5f6b7c'));
    el.innerHTML = msg ? '<span style="color:' + color + '">' + esc(msg) + '</span>' : '';
  }

  function setPendenciasButtonBusy(busy, label) {
    var btn = document.getElementById('btnPendenciasRefresh');
    if (!btn) return;
    if (typeof appSetButtonBusy === 'function') appSetButtonBusy(btn, busy);
    else btn.disabled = !!busy;
    var text = btn.querySelector('.btn-label');
    if (!text) return;
    if (!btn.dataset.defaultLabel) btn.dataset.defaultLabel = text.textContent;
    text.textContent = label || btn.dataset.defaultLabel;
  }

  function carregarPendencias(forcar, options) {
    options = options || {};
    setupPendenciasAutoRefreshListeners();
    var grid = document.getElementById('pendenciasGrid');
    var loadingHtml = '<div class="dash-pend-empty"><span class="material-symbols-outlined">hourglass_empty</span>Carregando pendências...</div>';
    if (!_pendenciasRefreshing && !forcar && _pendenciasCache && !pendenciasEstaoDesatualizadas()) {
      try {
        renderDashboardPendencias(_pendenciasCache, 'pendenciasGrid');
        atualizarPendenciasTs(true);
        setPendenciasStatus(pendenciasWarning(_pendenciasCache), 'warn');
      } catch (cacheRenderFailure) { forcar = true; }
      if (!forcar) {
        if (typeof options.onComplete === 'function') options.onComplete();
        return;
      }
    }
    if (typeof options.onComplete === 'function') _pendenciasRefreshWaiters.push(options.onComplete);
    if (_pendenciasCache) {
      try {
        // Mantém o DOM já exibido; recompõe a lista só quando o grid está vazio.
        if (grid && !grid.innerHTML.trim()) renderDashboardPendencias(_pendenciasCache, 'pendenciasGrid');
        atualizarPendenciasTs(true);
      } catch (cacheDisplayFailure) { /* A consulta abaixo recupera a apresentação. */ }
    }
    if (!options.silent) _pendenciasRefreshVisible = true;
    if (_pendenciasRefreshing) {
      // Uma mutacao exige uma consulta iniciada depois dela; a resposta atual pode estar obsoleta.
      if (forcar) _pendenciasRefreshQueued = true;
      if (grid && !_pendenciasCache && !grid.innerHTML.trim()) grid.innerHTML = loadingHtml;
      if (!options.silent) {
        setPendenciasStatus(['Atualizando...', pendenciasWarning(_pendenciasCache)].filter(Boolean).join(' '), '');
        setPendenciasButtonBusy(true, 'Atualizando...');
      }
      return;
    }
    _pendenciasRefreshing = true;
    if (grid && (!_pendenciasCache || !grid.innerHTML.trim())) {
      grid.innerHTML = loadingHtml;
    }
    if (!options.silent) {
      setPendenciasStatus(['Atualizando...', pendenciasWarning(_pendenciasCache)].filter(Boolean).join(' '), '');
      setPendenciasButtonBusy(true, 'Atualizando...');
    }
    var perf = typeof codexStartClientReadPerformance_ === 'function' ? codexStartClientReadPerformance_('getPendenciasOperacionais', forcar) : null;
    var finished = false;
    var watchdog = setTimeout(function() {
      failPendenciasRefresh({ message: 'Tempo limite ao carregar pendencias.' });
    }, 60000);
    function finishPendenciasRefresh(result) {
      if (watchdog) clearTimeout(watchdog);
      _pendenciasRefreshing = false;
      if (_pendenciasRefreshQueued) {
        _pendenciasRefreshQueued = false;
        carregarPendencias(true, { silent: !_pendenciasRefreshVisible });
        return;
      }
      try {
        if (_pendenciasRefreshVisible) setPendenciasButtonBusy(false);
        if (_pendenciasRefreshVisible || result && (result.partial || result.ok && STATE.pendencias.partialStatus)) setPendenciasStatus(result && result.message || '', result && result.type, result && result.partial);
      } catch (ignoreUi) { /* A fila deve terminar mesmo se o feedback falhar. */ }
      _pendenciasRefreshVisible = false;
      var waiters = _pendenciasRefreshWaiters.splice(0);
      waiters.forEach(function(fn) {
        try { fn(result); } catch (ignore) {}
      });
    }
    function failPendenciasRefresh(e, afterSuccess) {
      if (finished && !afterSuccess) return;
      finished = true;
      var msg = e && e.message || String(e || 'Erro inesperado ao carregar pendencias.');
      var manterCache = !!_pendenciasCache;
      var statusMsg = (manterCache ? 'Atencao: nao foi possivel atualizar agora; mantendo a ultima lista carregada. ' : 'Erro: nao foi possivel carregar pendencias. ') + msg;
      var statusType = manterCache ? 'warn' : 'danger';
      try {
        if (perf && !afterSuccess) { perf.rpc(false); perf.finish(false); }
        if (!_pendenciasRefreshQueued && grid && (afterSuccess || !options.silent || !_pendenciasCache)) {
          try {
            if (manterCache) renderDashboardPendencias(_pendenciasCache, 'pendenciasGrid');
            else grid.innerHTML = '<div class="dash-pend-empty"><span class="material-symbols-outlined">error</span>Erro ao carregar pendências: ' + esc(msg) + '</div>';
          } catch (renderFailure) {
            // Evita deixar dados parciais na tela; não depende do renderer nem de esc.
            grid.textContent = 'Não foi possível exibir as pendências. Atualize para tentar novamente.';
          }
        }
      } finally {
        finishPendenciasRefresh({ ok: false, message: statusMsg, type: statusType });
      }
    }
    google.script.run
      .withSuccessHandler(function(d) {
        if (finished) return;
        finished = true;
        if (_pendenciasRefreshQueued) {
          try { if (perf) { perf.rpc(true); perf.finish(false); } }
          finally { finishPendenciasRefresh(); }
          return;
        }
        var applied = false;
        var previousCache = _pendenciasCache;
        var previousLoadedAt = _pendenciasLoadedAt;
        var previousStateLoadedAt = STATE.pendencias.loadedAt;
        try {
          if (perf) perf.rpc(true);
          if (!d || d.erro || d.ok === false || !d.pendencias || typeof d.pendencias !== 'object' || Array.isArray(d.pendencias)) throw new Error(d && d.erro || 'Resposta inválida ao carregar pendências.');
          ['courierNaoAgendada', 'courierNaoConfirmada', 'awbEnviadaNaoEntregue', 'requisicaoExamesPendente', 'posVisitaPoloTrialPendente', 'posVisitaEcrfPendente', 'kitsVencendo', 'transporteBackupNaoAgendado', 'documentacaoTransporteSemEnvio'].forEach(function(key) {
            var items = d.pendencias[key];
            if (items !== undefined && (!Array.isArray(items) || items.some(function(item) { return !item || typeof item !== 'object' || Array.isArray(item); }))) throw new Error('Lista inválida ao carregar pendências.');
          });
          if (perf) perf.measure('render', function() { renderDashboardPendencias(d.pendencias, 'pendenciasGrid'); });
          else renderDashboardPendencias(d.pendencias, 'pendenciasGrid');
          _pendenciasCache = d.pendencias;
          setPendenciasLoadedAtState(new Date());
          atualizarPendenciasTs(false);
          var warning = pendenciasWarning(_pendenciasCache);
          finishPendenciasRefresh({ ok: true, partial: !!warning, message: warning, type: warning ? 'warn' : '' });
          applied = true;
        } catch (e) {
          _pendenciasCache = previousCache;
          _pendenciasLoadedAt = previousLoadedAt;
          STATE.pendencias.loadedAt = previousStateLoadedAt;
          failPendenciasRefresh(e, true);
        } finally {
          if (perf) { try { perf.finish(applied); } catch (ignorePerf) {} }
        }
      })
      .withFailureHandler(function(e) {
        failPendenciasRefresh(e);
      })
      .getPendenciasOperacionais(perf ? perf.request : {});
  }

  function abrirPendenciaAgenda(agendaId) {
    if (!agendaId) {
      irPara('requisicao');
      return;
    }
    function abrirRequisicaoComEvento_(dados) {
      if (!dados) {
        snackErro('Agendamento da pendência não encontrado.');
        return;
      }
      irPara('requisicao');
      setTimeout(function() {
        if (typeof aplicarAgendaNaRequisicao === 'function') {
          aplicarAgendaNaRequisicao(dados, 0);
        } else {
          snackErro('A tela de requisição ainda não está pronta.');
        }
      }, 80);
    }
    var local = typeof agendaFindEventoLocal_ === 'function' ? agendaFindEventoLocal_(agendaId) : null;
    if (local) {
      abrirRequisicaoComEvento_(local);
      return;
    }
    if (typeof agendaFetchEventoPorId_ === 'function') {
      agendaFetchEventoPorId_(agendaId, 0, abrirRequisicaoComEvento_, function(e) {
        snackErro(appErrorMessage(e));
      });
      return;
    }
    snackErro('Não foi possível carregar o agendamento da pendência.');
  }

  function abrirPendenciaAgendaRegistro(agendaId) {
    agendaId = String(agendaId || '').trim();
    if (!agendaId) {
      snackErro('Agendamento da pendência não encontrado.');
      return;
    }
    var abrirRegistro = typeof window !== 'undefined' && typeof window.abrirAgendaRegistroPorId === 'function'
      ? window.abrirAgendaRegistroPorId
      : (typeof abrirAgendaRegistroPorId === 'function' ? abrirAgendaRegistroPorId : null);
    if (abrirRegistro) {
      abrirRegistro(agendaId);
      return;
    }
    snackErro('A tela de edição da Agenda ainda não está pronta.');
  }

  function abrirPendenciaAwb(agendaId) {
    abrirPendenciaAgendaRegistro(agendaId);
  }

  var _pendenciaEntregaPendente = null;

  function confirmarEntregaPendencia(ev, agendaId, slot, awb, participante, courier, temperatura, data, hora, projeto, visita) {
    if (ev && ev.stopPropagation) ev.stopPropagation();
    agendaId = String(agendaId || '').trim();
    slot = String(slot || '').trim();
    awb = String(awb || '').trim();
    if (!agendaId || !slot) {
      snackErro('Não foi possível identificar o transporte da pendência.');
      return;
    }
    _pendenciaEntregaPendente = {
      agendaId: agendaId,
      slot: slot,
      awb: awb,
      participante: String(participante || '').trim(),
      courier: String(courier || '').trim(),
      temperatura: String(temperatura || '').trim(),
      data: String(data || '').trim(),
      hora: String(hora || '').trim(),
      projeto: String(projeto || '').trim(),
      visita: String(visita || '').trim()
    };
    var p = _pendenciaEntregaPendente;
    var values = {
      participante: p.participante || 'Não informado',
      transporte: p.slot || 'Não informado',
      courier: pendenciaCourierComTemperatura(p) || 'Não informado',
      awb: p.awb ? 'AWB ' + p.awb : 'Não informada',
      dataHora: [p.data, p.hora].filter(Boolean).join(' · ') || 'Não informado',
      projeto: p.projeto || 'Não informado',
      visita: p.visita || 'Não informada'
    };
    Object.keys(values).forEach(function(key) {
      var el = document.getElementById('pendenciaEntrega' + key.charAt(0).toUpperCase() + key.slice(1));
      if (el) el.textContent = values[key];
    });
    var confirmBtn = document.getElementById('btnConfirmarEntregaPendencia');
    if (confirmBtn) {
      confirmBtn.disabled = false;
      confirmBtn.innerHTML = '<span class="material-symbols-outlined">task_alt</span>Confirmar entrega';
      confirmBtn.onclick = executarConfirmarEntregaPendencia_;
    }
    abrirOverlay('modalConfirmarEntregaPendencia');
  }

  function fecharConfirmacaoEntregaPendencia() {
    _pendenciaEntregaPendente = null;
    fecharOverlay('modalConfirmarEntregaPendencia');
  }

  function executarConfirmarEntregaPendencia_() {
    var p = _pendenciaEntregaPendente;
    if (!p) return;
    var btn = document.getElementById('btnConfirmarEntregaPendencia');
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-outlined">hourglass_empty</span>Confirmando…';
    }
    appServerRun({
      method: 'confirmarEntregaTransportePendencia',
      args: [p.agendaId, p.slot, p.awb],
      onSuccess: function(res) {
        var atual = _pendenciaEntregaPendente === p;
        if (res && (res.erro || res.conflito)) {
          if (atual) fecharConfirmacaoEntregaPendencia();
          snackErro(res.erro || 'A pendência mudou. Atualize a lista antes de confirmar.');
          carregarPendencias(true);
          return;
        }
        if (_pendenciasCache && Array.isArray(_pendenciasCache.awbEnviadaNaoEntregue)) {
          _pendenciasCache.awbEnviadaNaoEntregue = _pendenciasCache.awbEnviadaNaoEntregue.filter(function(item) {
            return !(String(item.agendaId || '') === p.agendaId && String(item.slot || '') === p.slot);
          });
          if (_pendenciasCache.counts) _pendenciasCache.counts.awbEnviadaNaoEntregue = _pendenciasCache.awbEnviadaNaoEntregue.length;
          try { renderDashboardPendencias(_pendenciasCache, 'pendenciasGrid'); }
          catch (renderError) { /* A consulta forçada abaixo recupera a tela. */ }
        }
        if (atual) fecharConfirmacaoEntregaPendencia();
        setPendenciasStatus('Entrega confirmada para ' + [p.slot, p.awb ? 'AWB ' + p.awb : 'AWB'].filter(Boolean).join(' · ') + '.', 'ok');
        snack('Entrega confirmada no Agendamento.');
        carregarPendencias(true, { silent: true });
      },
      onFailure: function(e) {
        if (_pendenciaEntregaPendente === p && btn) {
          btn.disabled = false;
          btn.innerHTML = '<span class="material-symbols-outlined">task_alt</span>Confirmar entrega';
        }
        snackErro(appErrorMessage(e));
      }
    });
  }

  function abrirPendenciaEstoque(q) {
    abrirModuloEstoque('visualizacao', q || '');
  }
</script>
