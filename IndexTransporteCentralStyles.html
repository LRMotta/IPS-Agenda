  <style>
    /* Transporte (piloto): prefixo .tc-. Usa os tokens e componentes do app (IndexStyles.html):
       --primary, --text, --text-muted, --text-faint, --r-sm/md/lg, borda #e8edf8, .section-label, .chip-*,
       .btn-new, .icon-btn, .field-label e .f-input. Tamanho base 13px, como o restante do app. */
    .tc-wrap { width: 100%; font-size: 13px; color: var(--text); }
    .tc-dim { color: var(--text-faint); }

    /* Topo e abas (mesmo desenho das abas do Estoque piloto, um pouco maiores) */
    /* Só o botão de atualizar: fica no canto da linha das abas, sem ocupar uma linha própria. */
    .tc-wrap { position: relative; }
    .tc-head { position: absolute; top: 2px; right: 0; display: flex; align-items: center; gap: 12px; z-index: 1; }
    .tc-tabs { padding-right: 44px; }
    .tc-tabs { display: flex; gap: 4px; border-bottom: 1px solid #e0e6f0; margin-bottom: 20px; overflow-x: auto; }
    .tc-tabs[hidden] { display: none; }
    .tc-tab { border: 0; background: none; padding: 10px 14px; font: 600 12.5px 'Roboto', sans-serif; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
    .tc-tab:hover { color: var(--primary); }
    .tc-tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 700; }
    .tc-tab:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
    .tc-panel[hidden] { display: none; }

    /* Seções: cabeçalho no padrão .section-label do app, com contagem e explicação abaixo */
    .tc-secao { margin-bottom: 26px; }
    .tc-secao-cab { margin-bottom: 10px; }
    .tc-secao-tit.section-label { margin: 0 0 4px; }
    .tc-secao-tit .tc-count { margin-left: 2px; padding: 1px 7px; font-size: 10.5px; font-weight: 700; letter-spacing: 0; }
    .tc-secao-dica { margin: 0; font-size: 12.5px; color: var(--text-muted); line-height: 1.45; }

    /* Tabela-cartão: o mesmo desenho do .table-card / .data-table do app */
    .tc-tabela { background: var(--surface); border: 1px solid #e8edf8; border-radius: var(--r-md); overflow: hidden; }
    .tc-thead { display: grid; gap: 14px; padding: 9px 16px; background: #f6f8ff; border-bottom: 1px solid #e8edf8; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .9px; color: var(--text-faint); }
    .tc-acomp { display: grid; gap: 14px; align-items: center; padding: 12px 16px; border-bottom: 1px solid #f0f4f8; color: var(--text); transition: background .1s; }
    .tc-acomp:last-child { border-bottom: 0; }
    .tc-acomp:hover { background: #f6f9ff; }
    .tc-acomp.urgent { background: #fff7f6; box-shadow: inset 3px 0 0 #b3261e; }
    .tc-grade-acao { grid-template-columns: 132px minmax(160px, 1fr) minmax(280px, 2.2fr) 180px; }
    .tc-grade-sem-acao { grid-template-columns: 132px minmax(160px, 1fr) minmax(280px, 3fr); }
    .tc-grade-fila { grid-template-columns: 132px minmax(160px, 1fr) minmax(280px, 2.6fr) 150px; }

    /* Data do envio em destaque */
    .tc-acomp-data { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
    .tc-data-bloco { display: flex; align-items: center; gap: 9px; }
    .tc-data-dia { font-size: 26px; font-weight: 700; line-height: 1; color: var(--primary); min-width: 32px; text-align: center; }
    .tc-data-resto { display: flex; flex-direction: column; font-size: 11px; color: var(--text); text-transform: uppercase; letter-spacing: .4px; font-weight: 700; }
    .tc-data-hora { color: var(--text-muted); font-weight: 500; text-transform: none; letter-spacing: 0; font-size: 12px; }
    .tc-data-texto { flex-direction: column; align-items: flex-start; gap: 2px; font-size: 12.5px; color: var(--text-muted); }
    .tc-data-texto strong { color: var(--text); }

    /* Quem: participante e estudo · visita */
    .tc-trans-quem { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
    .tc-trans-quem strong { font-size: 13.5px; font-weight: 600; }
    .tc-trans-quem span { color: var(--text-muted); font-size: 12px; }

    /* Transportes da visita: uma faixa por transporte */
    .tc-acomp-transp { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; min-width: 0; }
    .tc-acomp-transp li { display: flex; align-items: center; gap: 4px 10px; padding: 6px 10px; background: #f7f9fd; border: 1px solid #eef2f8; border-radius: var(--r-sm); }
    .tc-acomp-transp li > * { flex: 0 0 auto; }
    .tc-acomp-transp li > .tc-acomp-detalhe { flex: 1 1 auto; min-width: 0; }
    .tc-slot.chip { padding: 2px 8px; font-size: 11px; font-weight: 700; }
    /* Rótulo informativo (não clicável): cinza, para não parecer link. */
    .tc-situacao { font-size: 12px; font-weight: 600; color: var(--text-muted); }
    .tc-acomp-courier { font-weight: 600; }
    .tc-acomp-detalhe { color: var(--text-muted); font-size: 12px; overflow-wrap: anywhere; }
    .tc-acomp-acao-transp { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
    .tc-trans-acoes { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }

    /* Chips (componente .chip do app) com ícone */
    .tc-chip { gap: 4px; font-weight: 600; }
    .tc-chip .material-symbols-outlined { font-size: 14px; }
    .tc-badges { display: flex; flex-wrap: wrap; gap: 6px; }

    /* Botões: primário é o .btn-new do app; os demais seguem o contorno do .icon-btn */
    .tc-acao { min-height: 32px; padding: 0 12px; border-radius: var(--r-sm); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font: 600 12.5px 'Roboto', sans-serif; white-space: nowrap; border: 1.5px solid #e0e6f0; background: var(--surface); color: var(--primary); }
    .tc-acao .material-symbols-outlined { font-size: 17px; }
    .tc-acao:hover { background: var(--primary-light); border-color: #c5d5fb; }
    .tc-acao.verde { border-color: #b7e3c4; background: #e6f4ea; color: #137333; }
    .tc-acao.verde:hover { background: #d4eddb; border-color: #8fd0a2; }
    .tc-acao.primario { border-color: var(--primary); background: var(--primary); color: #fff; }
    .tc-acao.primario:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
    .tc-acao:focus-visible, .tc-link:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .tc-acao[disabled] { opacity: .6; cursor: not-allowed; }
    .tc-rastreio.icon-btn { flex: 0 0 auto; }
    .tc-rastreio .material-symbols-outlined { font-size: 17px; }
    /* Link de ação: o .btn-txt do app (sem sublinhado, realce ao passar o mouse) */
    .tc-link { border: 0; background: transparent; padding: 6px 10px; margin: -6px -4px; border-radius: 16px; color: var(--primary); font: 500 13px 'Roboto', sans-serif; cursor: pointer; }
    .tc-link:hover { background: var(--primary-light); }
    .tc-link[disabled] { color: var(--text-faint); cursor: not-allowed; background: transparent; }

    /* Vazio e rodapé */
    .tc-empty { padding: 28px 16px; text-align: center; color: var(--text-muted); font-size: 13px; background: var(--surface); border: 1px dashed #d6e0ef; border-radius: var(--r-md); }
    .tc-empty .material-symbols-outlined { display: block; margin: 0 auto 6px; font-size: 30px; color: #137333; }
    .tc-footer { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 4px; padding: 10px 14px; border: 1px solid #d6e2fb; border-radius: var(--r-sm); background: #f5f8ff; color: var(--text-muted); font-size: 12.5px; }
    .tc-footer > .material-symbols-outlined { font-size: 17px; color: var(--primary); }
    .tc-footer .tc-link { margin: -6px 0; }

    /* Para fazer: próxima tarefa */
    .tc-next { background: var(--surface); border: 1px solid #e8edf8; border-radius: var(--r-md); padding: 18px 20px; margin-bottom: 26px; box-shadow: 0 2px 10px rgba(15,23,42,.04); }
    .tc-next.urgent { box-shadow: inset 3px 0 0 #b3261e, 0 2px 10px rgba(15,23,42,.04); }
    .tc-next-top { display: flex; align-items: flex-start; gap: 18px; }
    .tc-next-top > .tc-data-bloco { padding: 4px 16px 4px 0; border-right: 1px solid #eef2f8; }
    .tc-next-top .tc-data-dia { font-size: 32px; }
    .tc-next-texto { display: grid; gap: 6px; min-width: 0; }
    .tc-title { margin: 0; font-size: 19px; font-weight: 700; color: var(--text); line-height: 1.25; }
    .tc-meta { margin: 0; font-size: 13px; color: var(--text-muted); }
    .tc-meta strong { color: var(--text); font-weight: 600; }
    .tc-next .tc-transports { margin-top: 14px; }
    .tc-actions { margin-top: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .tc-fila-tarefa { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; min-width: 0; }
    .tc-fila-transp { display: flex; flex-wrap: wrap; gap: 6px; }
    /* Atalho para começar só um transporte: pílula discreta, no contorno dos botões secundários. */
    .tc-acao.tc-pilula { min-height: 26px; padding: 0 9px; font-size: 12px; font-weight: 500; color: var(--text); }
    .tc-acao.tc-pilula .material-symbols-outlined { font-size: 15px; color: var(--primary); }
    .tc-item-title { font-size: 13.5px; font-weight: 600; color: var(--text); }
    .tc-item-meta { font-size: 12px; color: var(--text-muted); }

    /* Em breve: semanas em acordeão */
    .tc-acordeao { display: grid; gap: 10px; }
    .tc-semana h3 { margin: 0; }
    .tc-semana-cab { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 1px solid #e8edf8; background: var(--surface); border-radius: var(--r-md); padding: 10px 14px; font: 600 13px 'Roboto', sans-serif; color: var(--text); cursor: pointer; text-align: left; }
    .tc-semana-cab:hover { background: #f6f9ff; }
    .tc-semana-cab[aria-expanded="true"] { border-color: var(--primary-border); background: var(--primary-light); color: var(--primary-dark); }
    .tc-semana-cab:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .tc-semana-tit { display: inline-flex; align-items: center; gap: 6px; }
    .tc-semana-tit .material-symbols-outlined { font-size: 19px; }
    .tc-semana-resumo { font-size: 12px; font-weight: 500; color: var(--text-muted); white-space: nowrap; }
    .tc-breve { margin-top: 8px; }
    .tc-breve[hidden] { display: none; }
    .tc-vira { display: inline-flex; align-items: center; gap: 8px; justify-self: end; padding: 6px 10px; border-radius: var(--r-sm); background: #f5f8ff; border: 1px solid #d6e2fb; color: var(--text-muted); font-size: 11.5px; line-height: 1.25; }
    .tc-vira .material-symbols-outlined { font-size: 18px; color: var(--primary); }
    .tc-vira > span:last-child { display: flex; flex-direction: column; }
    .tc-vira strong { font-size: 13px; color: var(--text); }

    /* Passo a passo do envio */
    .tc-wizard[hidden] { display: none; }
    .tc-wiz-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
    .tc-wiz-progress { font-size: 12px; font-weight: 700; color: var(--primary); padding: 5px 10px; border-radius: var(--r-sm); background: var(--primary-light); }
    .tc-wiz-grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 18px; align-items: start; }
    .tc-wiz-main { display: grid; gap: 14px; min-width: 0; }
    .tc-wiz-side, .tc-bloco { background: var(--surface); border: 1px solid #e8edf8; border-radius: var(--r-md); padding: 16px 18px; }
    /* Títulos dos blocos em caixa normal: alguns são mensagens ("Não foi possível gerar") e devem ser lidos como frase. */
    .tc-wiz-side h3, .tc-bloco h3 { margin: 0 0 10px; font-size: 14px; font-weight: 700; color: var(--text); }
    .tc-bloco p { margin: 0 0 8px; font-size: 13px; line-height: 1.5; color: var(--text); }
    .tc-bloco-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .tc-bloco-cab h3 { margin-bottom: 10px; }
    .tc-dl { margin: 0; display: grid; gap: 6px; }
    .tc-row { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px; font-size: 13px; }
    .tc-row dt { color: var(--text-muted); font-size: 12px; }
    .tc-row dd { margin: 0; color: var(--text); font-weight: 500; overflow-wrap: anywhere; }
    .tc-materiais { margin: 0 0 8px; padding-left: 18px; font-size: 13px; color: var(--text); display: grid; gap: 4px; }
    .tc-aviso { display: block; background: #fff8ec; border: 1px solid #f5d38a; border-radius: var(--r-sm); padding: 9px 11px; color: #7a4f00; font-size: 12.5px; }
    .tc-dica { color: #137333; }
    .tc-campos { display: grid; gap: 12px; }
    .tc-lista-passos { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 13px; color: var(--text); }
    .tc-mat-linha { display: grid; grid-template-columns: minmax(120px, 1fr) minmax(110px, 1fr) minmax(90px, 1fr) auto; gap: 10px; align-items: end; margin-bottom: 10px; }
    .tc-anvisa-frame { width: 100%; height: 620px; border: 1px solid #e8edf8; border-radius: var(--r-sm); background: #fff; }

    /* Telas menores */
    @media (max-width: 1100px) {
      .tc-thead { display: none; }
      .tc-grade-acao, .tc-grade-sem-acao, .tc-grade-fila { grid-template-columns: 132px minmax(0, 1fr); }
      .tc-acomp .tc-acomp-transp, .tc-acomp .tc-trans-acoes, .tc-acomp .tc-vira, .tc-acomp .tc-fila-tarefa, .tc-acomp .tc-fila-chips { grid-column: 1 / -1; }
      .tc-acomp .tc-trans-acoes, .tc-fila-chips .tc-badges { justify-content: flex-start; }
      .tc-acomp .tc-vira { justify-self: start; }
    }
    @media (max-width: 760px) {
      .tc-acomp-transp li { flex-wrap: wrap; }
      .tc-acomp-transp li > .tc-acomp-detalhe { flex-basis: 100%; }
      .tc-mat-linha { grid-template-columns: 1fr 1fr; }
      .tc-wiz-grid { grid-template-columns: minmax(0, 1fr); }
      .tc-wiz-side { order: -1; }
    }
    @media (max-width: 600px) {
      .tc-grade-acao, .tc-grade-sem-acao, .tc-grade-fila { grid-template-columns: minmax(0, 1fr); }
      .tc-acomp-acao-transp { margin-left: 0; }
      .tc-title { font-size: 17px; }
      .tc-next { padding: 16px; }
      .tc-next-top { flex-direction: column; gap: 10px; }
      .tc-next-top > .tc-data-bloco { border-right: 0; padding: 0; }
    }
  </style>
