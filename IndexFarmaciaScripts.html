<script>
var FARMACIA_STOCK = { epoch:0, readId:0, studyId:'', restricted:false, restrictedAllowed:false, data:null, saving:false, productToken:'', initialToken:'', locationToken:'', statusToken:'', probeToken:'' };
var FARMACIA_CATALOG = { data:null, readId:0, loading:false };

function farmaciaIsCatalogView() {
  return FARMACIA_VIEW === 'equipment' || FARMACIA_VIEW === 'probes';
}

function farmaciaCurrentData() {
  return farmaciaIsCatalogView() ? (FARMACIA_CATALOG.loading ? null : FARMACIA_CATALOG.data || FARMACIA_STOCK.data) : FARMACIA_STOCK.data;
}

function carregarFarmaciaCatalogo(force) {
  if (FARMACIA_STOCK.saving || !farmaciaIsCatalogView()) return;
  if (typeof CURRENT_ACCESS !== 'undefined' && !CURRENT_ACCESS.ok) {
    document.getElementById('farmaciaStockStatus').textContent = 'Validando acesso…';
    document.getElementById('farmaciaPrimaryAction').disabled = true;
    return;
  }
  if (!force && farmaciaCurrentData()) {
    renderFarmaciaEstoque(farmaciaCurrentData());
    return;
  }
  if (FARMACIA_CATALOG.loading && !force) return;
  var readId = ++FARMACIA_CATALOG.readId, epoch = FARMACIA_STOCK.epoch;
  FARMACIA_CATALOG.loading = true;
  FARMACIA_CATALOG.data = null;
  document.getElementById('farmaciaLocationsResults').innerHTML = farmaciaCatalogTable('equipment', '', true);
  document.getElementById('farmaciaProbesResults').innerHTML = farmaciaCatalogTable('probes', '', true);
  document.getElementById('farmaciaStockStatus').textContent = '';
  ['farmaciaLocationFields','farmaciaProbeFields'].forEach(function(id) { document.getElementById(id).disabled = true; });
  document.getElementById('farmaciaPrimaryAction').disabled = true;
  function current() {
    return readId === FARMACIA_CATALOG.readId && epoch === FARMACIA_STOCK.epoch && getCurrentPage() === 'farmacia';
  }
  google.script.run.withSuccessHandler(function(result) {
    if (!current()) return;
    FARMACIA_CATALOG.loading = false;
    FARMACIA_CATALOG.data = result;
    if (FARMACIA_STOCK.data) Object.assign(FARMACIA_STOCK.data, result);
    renderFarmaciaEstoque(farmaciaCurrentData());
    farmaciaRestoreFocus();
  }).withFailureHandler(function(error) {
    if (!current()) return;
    FARMACIA_CATALOG.loading = false;
    if (farmaciaIsCatalogView()) {
      ['farmaciaLocationsResults','farmaciaProbesResults'].forEach(function(id) { document.getElementById(id).textContent = ''; });
      document.getElementById('farmaciaStockStatus').textContent = appErrorMessage(error);
      farmaciaUpdateSummary();
      document.getElementById('farmaciaPrimaryAction').disabled = true;
    }
  }).getFarmaciaCatalogo();
}

function farmaciaEstoqueReset() {
  if (typeof farmaciaLifecycleReset === 'function') farmaciaLifecycleReset();
  FARMACIA_CATALOG.readId++;
  FARMACIA_CATALOG.data = null;
  FARMACIA_CATALOG.loading = false;
  farmaciaCloseDialogs();
  FARMACIA_STOCK.epoch++;
  FARMACIA_STOCK.readId++;
  FARMACIA_STOCK.studyId = '';
  FARMACIA_STOCK.data = null;
  FARMACIA_STOCK.saving = false;
  FARMACIA_STOCK.restoreFocus = null;
  FARMACIA_STOCK.productToken = FARMACIA_STOCK.initialToken = '';
  FARMACIA_STOCK.receiptToken = FARMACIA_STOCK.movementToken = '';
  FARMACIA_STOCK.positionId = '';
  FARMACIA_STOCK.positionSnapshot = null;
  document.getElementById('farmaciaReceiptForm').reset();
  document.getElementById('farmaciaPositionDetail').textContent = '';
  FARMACIA_STOCK.locationToken = FARMACIA_STOCK.statusToken = '';
  FARMACIA_STOCK.probeToken = '';
  FARMACIA_STOCK.calibrationToken = '';
  document.getElementById('farmaciaProbeForm').reset();
  document.getElementById('farmaciaLocationsResults').textContent = '';
  document.getElementById('farmaciaLocationForm').reset();
  document.getElementById('farmaciaInitialStorageStatus').textContent = '';
  document.getElementById('farmaciaStockPanel').hidden = true;
  ['farmaciaProductsResults','farmaciaInventoryResults','farmaciaLocationsResults','farmaciaProbesResults'].forEach(function(id) { document.getElementById(id).textContent = ''; });
  document.getElementById('farmaciaStockStatus').textContent = '';
  document.getElementById('farmaciaProductForm').reset();
  farmaciaProductControlChanged();
  farmaciaProductCategoryChanged();
  document.getElementById('farmaciaInitialForm').reset();
  document.getElementById('farmaciaInitialProduct').innerHTML = '<option value="">Selecione o produto</option>';
  ['farmaciaProductFields','farmaciaInitialFields','farmaciaLocationFields','farmaciaProbeFields'].forEach(function(id) { document.getElementById(id).disabled = true; });
  document.getElementById('farmaciaUnitDetail').textContent = '';
  document.getElementById('farmaciaProbeDetail').textContent = '';
  document.getElementById('farmaciaSearch').value = '';
  document.getElementById('farmaciaNoSelection').hidden = false;
  farmaciaSetView();
}

function farmaciaStockCurrent(epoch, studyId, restricted) {
  return epoch === FARMACIA_STOCK.epoch && studyId === FARMACIA_STOCK.studyId && restricted === FARMACIA_STOCK.restricted &&
    getCurrentPage() === 'farmacia' && document.getElementById('farmaciaStudy').value === studyId;
}

function carregarFarmaciaEstoque(studyId, restrictedAllowed, restricted) {
  if (FARMACIA_STOCK.studyId !== studyId || FARMACIA_STOCK.restricted !== restricted) farmaciaEstoqueReset();
  FARMACIA_STOCK.studyId = studyId;
  FARMACIA_STOCK.restricted = restricted;
  FARMACIA_STOCK.restrictedAllowed = restrictedAllowed;
  var epoch = FARMACIA_STOCK.epoch, readId = ++FARMACIA_STOCK.readId;
  var productsOnly = FARMACIA_VIEW === 'products';
  FARMACIA_STOCK.data = null;
  document.getElementById('farmaciaStockPanel').hidden = false;
  document.getElementById('farmaciaNoSelection').hidden = true;
  farmaciaUpdateSummary();
  document.getElementById('farmaciaRestrictedLabel').hidden = !restrictedAllowed;
  document.getElementById('farmaciaStockRestricted').checked = restricted;
  ['farmaciaProductsResults','farmaciaInventoryResults','farmaciaLocationsResults','farmaciaProbesResults'].forEach(function(id) { document.getElementById(id).textContent = ''; });
  document.getElementById('farmaciaLocationsResults').textContent = '';
  document.getElementById('farmaciaStockStatus').textContent = productsOnly ? 'Carregando produtos…' : 'Carregando estoque…';
  var request = google.script.run.withSuccessHandler(function(result) {
    if (productsOnly !== (FARMACIA_VIEW === 'products') || !farmaciaStockCurrent(epoch, studyId, restricted) || readId !== FARMACIA_STOCK.readId) return;
    FARMACIA_STOCK.data = result;
    if (productsOnly) {
      FARMACIA_STOCK.restrictedAllowed = result.restrictedAllowed === true;
      document.getElementById('farmaciaRestrictedLabel').hidden = !FARMACIA_STOCK.restrictedAllowed;
    }
    renderFarmaciaEstoque(farmaciaCurrentData());
    farmaciaRestoreFocus();
  }).withFailureHandler(function(error) {
    if (productsOnly !== (FARMACIA_VIEW === 'products') || !farmaciaStockCurrent(epoch, studyId, restricted) || readId !== FARMACIA_STOCK.readId) return;
    farmaciaUpdateSummary();
    document.getElementById('farmaciaStockStatus').textContent = appErrorMessage(error);
    if (FARMACIA_STOCK.restoreFocus) {
      FARMACIA_STOCK.restoreFocus = null;
      document.querySelector('[aria-label="Atualizar estoque"]').focus();
    }
  });
  if (productsOnly) request.getFarmaciaProdutos(studyId, restricted);
  else request.getFarmaciaEstoque(studyId, restricted);
}

function farmaciaStockRefresh(confirmed) {
  if (!confirmed && typeof farmaciaCycleRefreshGuard === 'function' && !farmaciaCycleRefreshGuard()) return;
  if (farmaciaIsCatalogView()) { carregarFarmaciaCatalogo(true); return; }
  if (FARMACIA_STOCK.studyId && !FARMACIA_STOCK.saving) carregarFarmaciaEstoque(FARMACIA_STOCK.studyId, FARMACIA_STOCK.restrictedAllowed, FARMACIA_STOCK.restricted);
  else if (!FARMACIA_STOCK.saving && document.getElementById('farmaciaStudy').value) selecionarFarmaciaStudy();
}

function farmaciaStockChangeClass(confirmed) {
  if (!confirmed && typeof farmaciaCycleScopeGuard === 'function' && !farmaciaCycleScopeGuard('class')) return;
  if (FARMACIA_STOCK.studyId) carregarFarmaciaEstoque(FARMACIA_STOCK.studyId, FARMACIA_STOCK.restrictedAllowed, document.getElementById('farmaciaStockRestricted').checked);
}

function farmaciaStockNumber(value) {
  return Number(value).toLocaleString('pt-BR', { maximumFractionDigits:3 });
}

function farmaciaStockDate(value, includeTime) {
  return includeTime ? new Date(value).toLocaleString('pt-BR', { timeZone:'America/Sao_Paulo' }) : String(value).split('-').reverse().join('/');
}

function renderFarmaciaEstoque(data) {
  if (!data) { farmaciaSetView(); return; }
  var products = data.products || [], units = (data.storageUnits || []).filter(function(unit) { return !unit.deleted; });
  document.getElementById('farmaciaStockStatus').textContent = '';
  document.getElementById('farmaciaNoSelection').hidden = true;
  var canManage = data.configured && data.farmaciaAccess === 'manage';
  document.getElementById('farmaciaProductFields').disabled = !canManage || FARMACIA_STOCK.saving;
  document.getElementById('farmaciaInitialFields').disabled = !canManage || !products.length || !data.locationsConfigured || !units.length || FARMACIA_STOCK.saving;
  document.getElementById('farmaciaLocationFields').disabled = !data.locationsCanManage || !data.locationsConfigured || FARMACIA_STOCK.saving;
  document.getElementById('farmaciaProbeFields').disabled = !data.locationsCanManage || !data.locationsConfigured || !units.length || FARMACIA_STOCK.saving;
  var select = document.getElementById('farmaciaInitialProduct'), selected = select.value;
  select.innerHTML = '<option value="">Selecione o produto</option>' + products.map(function(product) {
    return '<option value="' + esc(product.id) + '">' + esc(farmaciaProductLabel(product) + ' · ' + product.unit) + '</option>';
  }).join('');
  if (products.some(function(product) { return product.id === selected; })) select.value = selected;
  if (!document.getElementById('farmaciaInitialCountedOn').value) document.getElementById('farmaciaInitialCountedOn').value = new Intl.DateTimeFormat('en-CA', {timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  farmaciaRenderTables(data);
  farmaciaRenderReceiptOptions(data);
  farmaciaInitialProductChanged();
  farmaciaSetView();
}

function farmaciaRangeLabel(value) {
  return value && value.min !== null && value.min !== undefined ? value.min + ' a ' + value.max + ' °C' : 'Faixa não definida';
}

function farmaciaConservationHtml(storage) {
  return storage ? esc(farmaciaRangeLabel(storage)) + (storage.instructions ? '<br>' + esc(storage.instructions) : '') : 'Conservação não cadastrada.';
}



function farmaciaProbeHtml(unit, probe, canManage) {
  var calibration = probe.calibration || {status:'pending',calibratedOn:'',validUntil:'',certificate:'',note:''};
  var html = '<div class="form-section"><div class="section-label">' + esc(probe.code) + ' · ' + esc(unit.code) + '</div><dl class="farmacia-detail-grid">' +
    '<div><dt>Número de série</dt><dd>' + esc(probe.serial) + '</dd></div><div><dt>Fabricante / Modelo</dt><dd>' + esc(probe.model) + '</dd></div><div><dt>Calibração</dt><dd>' + farmaciaCalibrationBadge(probe.calibrationStatus) + '</dd></div><div><dt>Calibrada em</dt><dd>' + esc(calibration.calibratedOn ? farmaciaStockDate(calibration.calibratedOn) : 'Não informada') + '</dd></div><div><dt>Válida até</dt><dd>' + esc(calibration.validUntil ? farmaciaStockDate(calibration.validUntil) : 'Não informada') + '</dd></div><div class="full"><dt>Certificado</dt><dd>' + esc(calibration.certificate || 'Não informado') + '</dd></div><div class="full"><dt>Observação</dt><dd>' + esc(calibration.note || 'Não informada') + '</dd></div></dl></div>';
  html += '<div class="form-section participant-participations-section"><div class="section-label">Calibrações anteriores</div><div class="participant-participations-list">' + ((probe.calibrationHistory || []).map(function(entry) {
    var c = entry.calibration;
    return '<div class="participant-participation-row"><div><div class="participant-participation-title">' + esc(c.certificate || 'Sem certificado informado') + '</div><div class="participant-participation-meta">' + esc(c.calibratedOn ? farmaciaStockDate(c.calibratedOn) : 'Data não informada') + ' · Validade: ' + esc(c.validUntil ? farmaciaStockDate(c.validUntil) : 'Não informada') + '</div><div class="participant-participation-meta">' + esc(entry.author) + ' · ' + esc(farmaciaStockDate(entry.registeredAt,true)) + '</div><div>' + esc(c.note || '') + '</div></div><div>' + farmaciaCalibrationBadge(c.status,true) + '</div></div>';
  }).join('') || '<p class="participant-participation-meta">Nenhuma calibração anterior.</p>') + '</div></div>';
  if (canManage) html += '<form data-farmacia-probe="' + esc(probe.id) + '" data-farmacia-unit="' + esc(unit.id) + '" onsubmit="return salvarCalibracaoSondaFarmaciaApp(event,this)"><div class="form-section"><div class="section-label">Atualizar calibração</div><fieldset class="form-grid farmacia-location-status-fields">' +
    '<div class="field full"><label class="field-label" for="farmaciaCalibrationStatus">Situação</label><select class="f-input" id="farmaciaCalibrationStatus" name="calibrationStatus">' + ['pending','current','out_of_service'].map(function(status) { return '<option value="' + status + '"' + (status === calibration.status ? ' selected' : '') + '>' + ({pending:'Pendente / não informada',current:'Calibrada — conforme certificado',out_of_service:'Fora de uso'})[status] + '</option>'; }).join('') + '</select></div>' +
    '<div class="field"><label class="field-label" for="farmaciaCalibrationDate">Data da calibração</label><input class="f-input" id="farmaciaCalibrationDate" name="calibratedOn" type="date" value="' + esc(calibration.calibratedOn) + '"></div>' +
    '<div class="field"><label class="field-label" for="farmaciaCalibrationDue">Válida até (conforme documento)</label><input class="f-input" id="farmaciaCalibrationDue" name="validUntil" type="date" value="' + esc(calibration.validUntil) + '"></div>' +
    '<div class="field full"><label class="field-label" for="farmaciaCalibrationCertificate">Referência do certificado</label><input class="f-input" id="farmaciaCalibrationCertificate" name="certificate" maxlength="250" value="' + esc(calibration.certificate) + '"></div>' +
    '<div class="field full"><label class="field-label" for="farmaciaCalibrationNote">Observação</label><textarea class="f-input" id="farmaciaCalibrationNote" name="note" maxlength="500">' + esc(calibration.note) + '</textarea></div></fieldset></div><div class="farmacia-dialog-actions"><button class="btn-save" type="submit">Atualizar calibração</button></div></form>';
  return html;
}

function farmaciaInitialUnitChanged() {
  var unit = ((FARMACIA_STOCK.data || {}).storageUnits || []).find(function(item) { return item.id === document.getElementById('farmaciaInitialUnit').value; });
  var select = document.getElementById('farmaciaInitialLocation'), selected = select.value;
  select.innerHTML = '<option value="">Selecione a posição</option>' + (unit ? unit.positions : []).map(function(position) { return '<option value="' + esc(position) + '">' + esc(position) + '</option>'; }).join('');
  if (unit && unit.positions.indexOf(selected) !== -1) select.value = selected;
  farmaciaInitialStorageCheck();
}

function farmaciaInitialStorageCheck() {
  var data = FARMACIA_STOCK.data || {};
  var unit = (data.storageUnits || []).find(function(item) { return item.id === document.getElementById('farmaciaInitialUnit').value; });
  var product = (data.products || []).find(function(item) { return item.id === document.getElementById('farmaciaInitialProduct').value; });
  var storage = product && product.storage, message = 'Selecione produto, equipamento e posição. Condições adicionais exigem conferência.';
  if (unit && product) {
    if (unit.status !== 'active') message = 'Equipamento em manutenção ou indisponível. Revisar armazenamento.';
    else if (!storage || storage.min === null || unit.min === null) message = 'Faixa de temperatura não definida. Conferir condições de conservação.';
    else if (unit.min < storage.min || unit.max > storage.max) message = 'Faixa do equipamento incompatível com a faixa do produto. Revisar armazenamento.';
    else message = 'Faixas cadastradas compatíveis. Não comprova temperatura medida nem outras condições.';
  }
  document.getElementById('farmaciaInitialStorageStatus').textContent = message;
}

function farmaciaProductControlChanged() {
  var kit = document.getElementById('farmaciaProductControl').value === 'kit';
  document.getElementById('farmaciaProductUnit').disabled = kit;
  if (kit) document.getElementById('farmaciaProductUnit').value = 'kit';
}

function farmaciaProductCategoryChanged(form) {
  var currentForm = form || document.getElementById('farmaciaProductForm');
  if (!currentForm || !currentForm.elements) return;
  var categoryField = currentForm.elements.category;
  if (!categoryField) return;
  var category = categoryField.value;
  currentForm.querySelectorAll('[data-farmacia-medication-field]').forEach(function(field) {
    field.hidden = category !== 'medicine';
    if (category !== 'medicine') {
      var input = field.querySelector('input, select');
      if (input) input.value = '';
    }
  });
}

function farmaciaInitialProductChanged() {
  var product = ((FARMACIA_STOCK.data || {}).products || []).find(function(item) { return item.id === document.getElementById('farmaciaInitialProduct').value; });
  var kit = !!product && product.control === 'kit';
  document.getElementById('farmaciaKitField').hidden = !kit;
  document.getElementById('farmaciaInitialKit').required = kit;
  document.getElementById('farmaciaInitialPhysical').readOnly = kit;
  document.getElementById('farmaciaInitialPhysical').step = product && ['mL', 'g'].indexOf(product.unit) !== -1 ? '0.001' : '1';
  document.getElementById('farmaciaInitialPhysical').min = document.getElementById('farmaciaInitialPhysical').step;
  document.getElementById('farmaciaInitialBlocked').step = document.getElementById('farmaciaInitialPhysical').step;
  if (kit) document.getElementById('farmaciaInitialPhysical').value = '1';
  else document.getElementById('farmaciaInitialKit').value = '';
  document.getElementById('farmaciaInitialLifecycleStatus').hidden = !product || product.supplySource !== 'sponsor';
  farmaciaInitialStorageCheck();
}

function farmaciaOperationId() {
  return window.crypto && window.crypto.randomUUID ? window.crypto.randomUUID() : 'farm-' + Date.now() + '-' + Math.random().toString(36).slice(2);
}

function farmaciaStockSave(type, data) {
  var catalogAction = type === 'location' || type === 'status' || type === 'probe' || type === 'calibration';
  var currentData = farmaciaCurrentData();
  if (FARMACIA_STOCK.saving || !currentData || (catalogAction ? !currentData.locationsConfigured || !currentData.locationsCanManage : !currentData.configured || currentData.farmaciaAccess !== 'manage')) return;
  var epoch = FARMACIA_STOCK.epoch, studyId = FARMACIA_STOCK.studyId, restricted = FARMACIA_STOCK.restricted;
  function isCurrentSave() {
    return catalogAction ? epoch === FARMACIA_STOCK.epoch && getCurrentPage() === 'farmacia' : farmaciaStockCurrent(epoch, studyId, restricted);
  }
  var tokenKey = type + 'Token';
  if (!FARMACIA_STOCK[tokenKey]) FARMACIA_STOCK[tokenKey] = farmaciaOperationId();
  FARMACIA_STOCK.saving = true;
  document.getElementById('farmaciaProductFields').disabled = document.getElementById('farmaciaInitialFields').disabled = true;
  document.getElementById('farmaciaLocationFields').disabled = true;
  document.getElementById('farmaciaProbeFields').disabled = true;
  document.getElementById('farmaciaReceiptFields').disabled = true;
  document.querySelectorAll('.farmacia-movement-fields').forEach(function(fields) { fields.disabled = true; });
  document.querySelectorAll('.farmacia-location-status-fields').forEach(function(fields) { fields.disabled = true; });
  document.getElementById('farmaciaStockStatus').textContent = 'Salvando…';
  var modal = document.getElementById(farmaciaDialogId(type));
  modal.dataset.extraSaving = '1';
  appSetStatus(modal.querySelector('.farmacia-dialog-status'), 'Salvando…', '#5f6b7c');
  farmaciaUpdateSummary();
  var runner = google.script.run.withSuccessHandler(function(result) {
    if (!isCurrentSave()) return;
    FARMACIA_STOCK.saving = false;
    FARMACIA_STOCK[tokenKey] = '';
    FARMACIA_STOCK.restoreFocus = {view:FARMACIA_VIEW,type:type,unitId:data.unitId,probeId:data.probeId,positionId:data.positionId};
    modal.dataset.extraSaving = '0';
    if (typeof appClearUnsavedChanges === 'function') appClearUnsavedChanges(modal.id);
    fecharOverlay(modal.id);
    if (type !== 'status' && type !== 'calibration' && type !== 'movement') document.getElementById(type === 'product' ? 'farmaciaProductForm' : type === 'location' ? 'farmaciaLocationForm' : type === 'probe' ? 'farmaciaProbeForm' : type === 'receipt' ? 'farmaciaReceiptForm' : 'farmaciaInitialForm').reset();
    farmaciaProductControlChanged();
    farmaciaProductCategoryChanged();
    if (catalogAction && result && result.catalog && Array.isArray(result.catalog.storageUnits)) {
      // The authorized snapshot was built under the write lock; pending reads must not replace it.
      FARMACIA_CATALOG.readId++;
      FARMACIA_STOCK.readId++;
      FARMACIA_CATALOG.loading = false;
      FARMACIA_CATALOG.data = result.catalog;
      if (FARMACIA_STOCK.data) Object.assign(FARMACIA_STOCK.data, result.catalog);
      if (farmaciaIsCatalogView()) {
        renderFarmaciaEstoque(farmaciaCurrentData());
        farmaciaRestoreFocus();
      } else farmaciaStockRefresh();
    } else farmaciaStockRefresh();
  }).withFailureHandler(function(error) {
    if (!isCurrentSave()) return;
    FARMACIA_STOCK.saving = false;
    modal.dataset.extraSaving = '0';
    appSetStatus(modal.querySelector('.farmacia-dialog-status'), appErrorMessage(error) + ' Os dados foram preservados para conferência ou nova tentativa.', '#b3261e');
    var current = farmaciaCurrentData();
    document.getElementById('farmaciaProductFields').disabled = !current.configured || current.farmaciaAccess !== 'manage';
    document.getElementById('farmaciaInitialFields').disabled = !current.configured || current.farmaciaAccess !== 'manage' || !current.locationsConfigured || !(current.storageUnits || []).some(function(unit) { return !unit.deleted; }) || !(current.products || []).length;
    document.getElementById('farmaciaLocationFields').disabled = !current.locationsConfigured || !current.locationsCanManage;
    document.getElementById('farmaciaProbeFields').disabled = !current.locationsConfigured || !current.locationsCanManage || !(current.storageUnits || []).some(function(unit) { return !unit.deleted; });
    document.querySelectorAll('.farmacia-location-status-fields').forEach(function(fields) { fields.disabled = !current.locationsCanManage; });
    farmaciaRenderReceiptOptions(current);
    document.querySelectorAll('.farmacia-movement-fields').forEach(function(fields) { fields.disabled = current.farmaciaAccess !== 'manage'; });
    farmaciaUpdateSummary();
    document.getElementById('farmaciaStockStatus').textContent = appErrorMessage(error) + ' O formulário e o identificador da operação foram preservados para conferência ou nova tentativa.';
  });
  var payload = { studyId:studyId, restricted:restricted, requestId:FARMACIA_STOCK[tokenKey], data:data };
  if (catalogAction) payload = { requestId:FARMACIA_STOCK[tokenKey], data:data };
  if (type === 'product') runner.cadastrarProdutoFarmacia(payload);
  else if (type === 'location') runner.cadastrarLocalFarmacia(payload);
  else if (type === 'status') runner.atualizarSituacaoLocalFarmacia(payload);
  else if (type === 'probe') runner.cadastrarSondaFarmacia(payload);
  else if (type === 'calibration') runner.atualizarCalibracaoSondaFarmacia(payload);
  else if (type === 'receipt') runner.registrarRecebimentoFarmacia(payload);
  else if (type === 'movement') runner.registrarMovimentacaoFarmacia(payload);
  else runner.registrarInventarioInicialFarmacia(payload);
}

function salvarProdutoFarmaciaApp(event) {
  event.preventDefault();
  farmaciaStockSave('product', { category:document.getElementById('farmaciaProductCategory').value, name:document.getElementById('farmaciaProductName').value, presentation:document.getElementById('farmaciaProductPresentation').value,
    barcode:document.getElementById('farmaciaProductBarcode').value, dosageForm:document.getElementById('farmaciaProductDosageForm').value,
    strength:document.getElementById('farmaciaProductStrength').value, route:document.getElementById('farmaciaProductRoute').value,
    unit:document.getElementById('farmaciaProductUnit').value, control:document.getElementById('farmaciaProductControl').value, supplySource:document.getElementById('farmaciaProductSupply').value,
    storage:{ min:farmaciaInputTemperature('farmaciaProductMin'), max:farmaciaInputTemperature('farmaciaProductMax'), instructions:document.getElementById('farmaciaProductInstructions').value } });
  return false;
}

function salvarInventarioFarmaciaApp(event) {
  event.preventDefault();
  farmaciaStockSave('initial', { productId:document.getElementById('farmaciaInitialProduct').value,
    lot:document.getElementById('farmaciaInitialLot').value, expiry:document.getElementById('farmaciaInitialExpiry').value,
    location:'Catálogo', locationRef:{unitId:document.getElementById('farmaciaInitialUnit').value,position:document.getElementById('farmaciaInitialLocation').value}, kit:document.getElementById('farmaciaInitialKit').value,
    physical:document.getElementById('farmaciaInitialPhysical').valueAsNumber, blocked:document.getElementById('farmaciaInitialBlocked').valueAsNumber,
    countedOn:document.getElementById('farmaciaInitialCountedOn').value, note:document.getElementById('farmaciaInitialNote').value,
    confirmed:document.getElementById('farmaciaInitialConfirmed').checked });
  return false;
}

function farmaciaSupplyLabel(product) {
  return product.supplySource === 'sponsor' ? 'Patrocinador' : product.supplySource === 'site' ? 'Próprio do IPS' : 'Origem não informada (registro anterior)';
}

function farmaciaRenderReceiptOptions(data) {
  var select = document.getElementById('farmaciaReceiptProduct'), selected = select.value;
  var products = (data.products || []).filter(function(product) { return product.supplySource === 'sponsor'; });
  select.innerHTML = '<option value="">Selecione o produto</option>' + products.map(function(product) {
    return '<option value="' + esc(product.id) + '">' + esc(farmaciaProductLabel(product)) + '</option>';
  }).join('');
  if (products.some(function(product) { return product.id === selected; })) select.value = selected;
  farmaciaUnitOptions('farmaciaReceiptUnit');
  farmaciaReceiptUnitChanged();
  farmaciaReceiptProductChanged();
  document.getElementById('farmaciaReceiptFields').disabled = FARMACIA_STOCK.saving || !data.configured || data.farmaciaAccess !== 'manage' || !products.length || !(data.storageUnits || []).some(function(unit) { return !unit.deleted; });
}

function farmaciaUnitOptions(id) {
  var select = document.getElementById(id), selected = select.value;
  select.innerHTML = '<option value="">Selecione o equipamento</option>' + ((FARMACIA_STOCK.data || {}).storageUnits || []).filter(function(unit) { return !unit.deleted; }).map(function(unit) {
    return '<option value="' + esc(unit.id) + '">' + esc(unit.code + (unit.status !== 'active' ? ' · Revisar situação' : '')) + '</option>';
  }).join('');
  select.value = selected;
}

function farmaciaPositionOptions(unitId, locationId) {
  var select = document.getElementById(locationId), selected = select.value;
  var unit = ((FARMACIA_STOCK.data || {}).storageUnits || []).find(function(item) { return item.id === document.getElementById(unitId).value; });
  select.innerHTML = '<option value="">Selecione a posição</option>' + (unit ? unit.positions : []).map(function(position) {
    return '<option value="' + esc(position) + '">' + esc(position) + '</option>';
  }).join('');
  if (unit && unit.positions.indexOf(selected) !== -1) select.value = selected;
}

function farmaciaReceiptUnitChanged() {
  farmaciaPositionOptions('farmaciaReceiptUnit', 'farmaciaReceiptLocation');
}

function farmaciaReceiptProductChanged() {
  var product = ((FARMACIA_STOCK.data || {}).products || []).find(function(item) { return item.id === document.getElementById('farmaciaReceiptProduct').value; });
  var kit = !!product && product.control === 'kit', input = document.getElementById('farmaciaReceiptPhysical');
  document.getElementById('farmaciaReceiptKitField').hidden = !kit;
  document.getElementById('farmaciaReceiptKit').required = kit;
  input.readOnly = kit;
  input.step = product && ['mL', 'g'].indexOf(product.unit) !== -1 ? '0.001' : '1';
  input.min = input.step;
  if (kit) input.value = '1';
  else document.getElementById('farmaciaReceiptKit').value = '';
}

function farmaciaOpenReceipt() {
  var button = document.getElementById('farmaciaReceiptAction');
  if (button.hidden || button.disabled) return;
  var form = document.getElementById('farmaciaReceiptForm');
  form.reset();
  FARMACIA_STOCK.receiptToken = '';
  farmaciaRenderReceiptOptions(FARMACIA_STOCK.data);
  document.getElementById('farmaciaReceiptReceivedOn').value = new Intl.DateTimeFormat('en-CA', {timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  document.querySelector('#farmaciaModal-receipt .farmacia-dialog-status').textContent = '';
  if (typeof appClearUnsavedChanges === 'function') appClearUnsavedChanges('farmaciaModal-receipt');
  abrirOverlay('farmaciaModal-receipt');
}

function salvarRecebimentoFarmaciaApp(event) {
  event.preventDefault();
  farmaciaStockSave('receipt', {productId:document.getElementById('farmaciaReceiptProduct').value,
    lot:document.getElementById('farmaciaReceiptLot').value, expiry:document.getElementById('farmaciaReceiptExpiry').value,
    location:'Catálogo', locationRef:{unitId:document.getElementById('farmaciaReceiptUnit').value,position:document.getElementById('farmaciaReceiptLocation').value},
    kit:document.getElementById('farmaciaReceiptKit').value, physical:document.getElementById('farmaciaReceiptPhysical').valueAsNumber,
    receivedOn:document.getElementById('farmaciaReceiptReceivedOn').value, document:document.getElementById('farmaciaReceiptDocument').value, note:document.getElementById('farmaciaReceiptNote').value});
  return false;
}

function farmaciaOpenPosition(id) {
  var data = FARMACIA_STOCK.data;
  var position = data && (data.positions || []).find(function(item) { return item.id === id; });
  if (!position || FARMACIA_STOCK.saving) return;
  var product = (data.products || []).find(function(item) { return item.id === position.productId; });
  if (!product) return;
  FARMACIA_STOCK.positionId = id;
  FARMACIA_STOCK.positionSnapshot = Object.assign({}, position);
  FARMACIA_STOCK.movementToken = '';
  var labels = {INITIAL:'Saldo inicial',RECEIPT:'Recebimento',block:'Bloqueio',release:'Liberação',transfer:'Transferência',dispense:'Dispensação',return:'Retorno do participante',transport_departure:'Saída para transporte',transport_arrival:'Chegada do transporte',destination:'Destinação final'};
  var history = (data.movements || []).filter(function(record) { return record.id === id || record.data.positionId === id; });
  var rows = history.map(function(record) {
    var event = record.data;
    var quantity = event.quantity === undefined ? event.physical : event.quantity;
    if (event.action === 'transport_arrival') {
      var departure = (data.movements || []).find(function(item) { return item.id === event.departureId; });
      quantity = departure ? departure.data.quantity : undefined;
    }
    return '<tr><td>' + esc(labels[event.action] || labels[record.type] || record.type) + '<small>' + esc(event.reason || event.note || '') + '</small></td><td>' + (quantity === undefined ? '—' : farmaciaStockNumber(quantity) + ' ' + esc(product.unit)) + '<small>' + esc(event.location || '') + '</small></td><td>' + esc(event.document || 'Não informada') + '</td><td>' + esc(farmaciaStockDate(record.registeredAt, true)) + '<small>' + esc(record.author) + '</small></td></tr>';
  }).join('');
  if (!history.length) rows = '<tr><td>Saldo inicial</td><td>' + farmaciaStockNumber(position.physical) + ' ' + esc(product.unit) + '</td><td>Registro anterior</td><td>' + esc(position.author) + '<small>' + esc(farmaciaStockDate(position.registeredAt, true)) + '</small></td></tr>';
  var html = '<div class="form-section"><div class="section-label">' + esc(farmaciaProductLabel(product)) + ' · Lote ' + esc(position.lot) + (position.kit ? ' · Kit ' + esc(position.kit) : '') + '</div><dl class="farmacia-detail-grid"><div class="full"><dt>Localização atual</dt><dd>' + esc(position.location) + '</dd></div><div><dt>Disponível</dt><dd>' + farmaciaStockNumber(position.available) + ' ' + esc(product.unit) + '</dd></div><div><dt>Aguardando avaliação / Bloqueado</dt><dd>' + farmaciaStockNumber(position.pending || 0) + ' / ' + farmaciaStockNumber(position.blocked) + ' ' + esc(product.unit) + '</dd></div></dl></div>';
  html += farmaciaTable(['Evento / Motivo','Quantidade / Localização','Referência documental','Data / Responsável'], rows, 'Histórico do lote');
  if (position.inTransit) html += '<p class="farmacia-cycle-help">Conclua o transporte em andamento antes de movimentar esta entrada.</p>';
  if (product.supplySource === 'sponsor' && data.farmaciaAccess === 'manage' && !position.inTransit) html += '<form id="farmaciaMovementForm" onsubmit="return salvarMovimentacaoFarmaciaApp(event)"><div class="form-section"><div class="section-label">Registrar movimentação</div><fieldset class="form-grid farmacia-movement-fields">' +
    '<div class="field"><label class="field-label" for="farmaciaMovementAction">Ação</label><select class="f-input" id="farmaciaMovementAction" onchange="farmaciaMovementChanged()">' + (position.returned ? '' : '<option value="block">Bloquear</option>') + (position.expired || position.returned ? '' : '<option value="release">Liberar conforme documento</option>') + '<option value="transfer">Transferir localização (saldo integral)</option></select></div>' +
    '<div class="field" id="farmaciaMovementFromField"><label class="field-label" for="farmaciaMovementFrom">Retirar da situação</label><select class="f-input" id="farmaciaMovementFrom" onchange="farmaciaMovementQuantityChanged()"></select></div>' +
    '<div class="field"><label class="field-label" for="farmaciaMovementQuantity">Quantidade (' + esc(product.unit) + ')</label><input class="f-input" id="farmaciaMovementQuantity" type="number" min="' + (['mL','g'].indexOf(product.unit) !== -1 ? '0.001' : '1') + '" step="' + (['mL','g'].indexOf(product.unit) !== -1 ? '0.001' : '1') + '" required></div>' +
    '<div class="field" id="farmaciaMovementUnitField" hidden><label class="field-label" for="farmaciaMovementUnit">Equipamento de destino</label><select class="f-input" id="farmaciaMovementUnit" onchange="farmaciaMovementUnitChanged()"></select></div>' +
    '<div class="field" id="farmaciaMovementLocationField" hidden><label class="field-label" for="farmaciaMovementLocation">Posição de destino</label><select class="f-input" id="farmaciaMovementLocation"></select></div>' +
    '<div class="field full"><label class="field-label" for="farmaciaMovementReason">Motivo</label><input class="f-input" id="farmaciaMovementReason" maxlength="500" required></div>' +
    '<div class="field full"><label class="field-label" for="farmaciaMovementDocument">Referência documental (versão/data)</label><input class="f-input" id="farmaciaMovementDocument" maxlength="200" required></div></fieldset></div><div class="farmacia-dialog-actions"><button type="submit" class="btn-save">Registrar movimentação</button></div></form>';
  document.getElementById('farmaciaPositionDetail').innerHTML = html;
  if (document.getElementById('farmaciaMovementForm')) {
    farmaciaUnitOptions('farmaciaMovementUnit');
    farmaciaMovementUnitChanged();
    farmaciaMovementChanged();
  }
  document.querySelector('#farmaciaModal-positionDetail .farmacia-dialog-status').textContent = '';
  if (typeof appClearUnsavedChanges === 'function') appClearUnsavedChanges('farmaciaModal-positionDetail');
  abrirOverlay('farmaciaModal-positionDetail');
}

function farmaciaMovementUnitChanged() {
  farmaciaPositionOptions('farmaciaMovementUnit', 'farmaciaMovementLocation');
}

function farmaciaMovementChanged() {
  var action = document.getElementById('farmaciaMovementAction').value, transfer = action === 'transfer';
  var from = document.getElementById('farmaciaMovementFrom');
  from.innerHTML = (action === 'release' ? ['pending','blocked'] : ['available','pending']).map(function(key) {
    return '<option value="' + key + '">' + ({pending:'Aguardando avaliação',blocked:'Bloqueado',available:'Disponível'})[key] + '</option>';
  }).join('');
  document.getElementById('farmaciaMovementFromField').hidden = transfer;
  ['Unit','Location'].forEach(function(key) {
    document.getElementById('farmaciaMovement' + key + 'Field').hidden = !transfer;
    document.getElementById('farmaciaMovement' + key).required = transfer;
  });
  farmaciaMovementQuantityChanged();
}

function farmaciaMovementQuantityChanged() {
  var position = FARMACIA_STOCK.positionSnapshot;
  if (!position) return;
  var transfer = document.getElementById('farmaciaMovementAction').value === 'transfer';
  var input = document.getElementById('farmaciaMovementQuantity');
  input.readOnly = transfer;
  input.max = String(transfer ? position.physical : position[document.getElementById('farmaciaMovementFrom').value] || 0);
  input.value = transfer ? String(position.physical) : '';
}

function salvarMovimentacaoFarmaciaApp(event) {
  event.preventDefault();
  var position = FARMACIA_STOCK.positionSnapshot;
  if (!position) return false;
  var action = document.getElementById('farmaciaMovementAction').value;
  var data = {positionId:position.id,revision:position.revision,action:action,
    quantity:document.getElementById('farmaciaMovementQuantity').valueAsNumber,
    from:action === 'transfer' ? '' : document.getElementById('farmaciaMovementFrom').value,
    reason:document.getElementById('farmaciaMovementReason').value,document:document.getElementById('farmaciaMovementDocument').value};
  if (action === 'transfer') {
    data.location = 'Catálogo';
    data.locationRef = {unitId:document.getElementById('farmaciaMovementUnit').value,position:document.getElementById('farmaciaMovementLocation').value};
  }
  farmaciaStockSave('movement', data);
  return false;
}

function farmaciaInputTemperature(id) {
  var input = document.getElementById(id);
  return input.value === '' ? null : input.valueAsNumber;
}

function salvarLocalFarmaciaApp(event) {
  event.preventDefault();
  var positions = farmaciaPositionsData(document.getElementById('farmaciaLocationForm'));
  if (!positions) return false;
  farmaciaStockSave('location', {code:document.getElementById('farmaciaLocationCode').value, type:document.getElementById('farmaciaLocationType').value,
    model:document.getElementById('farmaciaLocationModel').value, room:document.getElementById('farmaciaLocationRoom').value,
    min:farmaciaInputTemperature('farmaciaLocationMin'), max:farmaciaInputTemperature('farmaciaLocationMax'),
    sensor:'', status:document.getElementById('farmaciaLocationStatus').value,
    positions:positions.positions, layout:positions.layout });
  return false;
}

function salvarSituacaoLocalFarmaciaApp(event, form) {
  event.preventDefault();
  var unit = ((farmaciaCurrentData() || {}).storageUnits || []).find(function(item) { return item.id === form.getAttribute('data-farmacia-unit'); });
  if (unit) farmaciaStockSave('status', {unitId:unit.id,revision:unit.revision,status:form.elements.status.value,reason:form.elements.reason.value});
  return false;
}

function salvarSondaFarmaciaApp(event) {
  event.preventDefault();
  farmaciaStockSave('probe', {unitId:document.getElementById('farmaciaProbeUnit').value,code:document.getElementById('farmaciaProbeCode').value,
    serial:document.getElementById('farmaciaProbeSerial').value,model:document.getElementById('farmaciaProbeModel').value,
    calibration:{status:document.getElementById('farmaciaProbeCalibrationStatus').value,calibratedOn:document.getElementById('farmaciaProbeCalibratedOn').value,
      validUntil:document.getElementById('farmaciaProbeValidUntil').value,certificate:document.getElementById('farmaciaProbeCertificate').value,note:document.getElementById('farmaciaProbeCalibrationNote').value}});
  return false;
}

function salvarCalibracaoSondaFarmaciaApp(event, form) {
  event.preventDefault();
  var unit = ((farmaciaCurrentData() || {}).storageUnits || []).find(function(item) { return item.id === form.getAttribute('data-farmacia-unit'); });
  var probe = unit && (unit.probes || []).find(function(item) { return item.id === form.getAttribute('data-farmacia-probe'); });
  if (probe) farmaciaStockSave('calibration', {unitId:unit.id,probeId:probe.id,revision:probe.revision,calibration:{status:form.elements.calibrationStatus.value,
    calibratedOn:form.elements.calibratedOn.value,validUntil:form.elements.validUntil.value,certificate:form.elements.certificate.value,note:form.elements.note.value}});
  return false;
}
</script>
