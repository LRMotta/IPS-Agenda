<script>
var FARMACIA_STOCK = { epoch:0, readId:0, studyId:'', restricted:false, restrictedAllowed:false, data:null, saving:false, productToken:'', initialToken:'', locationToken:'', statusToken:'', probeToken:'' };

function farmaciaEstoqueReset() {
  FARMACIA_STOCK.epoch++;
  FARMACIA_STOCK.readId++;
  FARMACIA_STOCK.studyId = '';
  FARMACIA_STOCK.data = null;
  FARMACIA_STOCK.saving = false;
  FARMACIA_STOCK.productToken = FARMACIA_STOCK.initialToken = '';
  FARMACIA_STOCK.locationToken = FARMACIA_STOCK.statusToken = '';
  FARMACIA_STOCK.probeToken = '';
  FARMACIA_STOCK.calibrationToken = '';
  document.getElementById('farmaciaProbeSetup').hidden = true;
  document.getElementById('farmaciaProbeForm').reset();
  document.getElementById('farmaciaLocationsResults').textContent = '';
  document.getElementById('farmaciaLocationSetup').hidden = true;
  document.getElementById('farmaciaLocationForm').reset();
  document.getElementById('farmaciaInitialStorageStatus').textContent = '';
  document.getElementById('farmaciaStockPanel').hidden = true;
  document.getElementById('farmaciaStockResults').textContent = '';
  document.getElementById('farmaciaStockStatus').textContent = '';
  document.getElementById('farmaciaProductForm').reset();
  farmaciaProductControlChanged();
  document.getElementById('farmaciaInitialForm').reset();
  document.getElementById('farmaciaStockForms').hidden = true;
}

function farmaciaStockCurrent(epoch, studyId, restricted) {
  return epoch === FARMACIA_STOCK.epoch && studyId === FARMACIA_STOCK.studyId && restricted === FARMACIA_STOCK.restricted &&
    getCurrentPage() === 'farmacia' && document.getElementById('farmaciaStudy').value === studyId;
}

function carregarFarmaciaEstoque(studyId, restrictedAllowed, restricted) {
  if (FARMACIA_STOCK.studyId !== studyId || FARMACIA_STOCK.restricted !== restricted) farmaciaEstoqueReset();
  FARMACIA_STOCK.studyId = studyId;
  FARMACIA_STOCK.restricted = restricted;
  FARMACIA_STOCK.restrictedAllowed = restrictedAllowed;
  var epoch = FARMACIA_STOCK.epoch, readId = ++FARMACIA_STOCK.readId;
  FARMACIA_STOCK.data = null;
  document.getElementById('farmaciaStockPanel').hidden = false;
  document.getElementById('farmaciaRestrictedLabel').hidden = !restrictedAllowed;
  document.getElementById('farmaciaStockRestricted').checked = restricted;
  document.getElementById('farmaciaStockResults').textContent = '';
  document.getElementById('farmaciaLocationsResults').textContent = '';
  document.getElementById('farmaciaLocationSetup').hidden = true;
  document.getElementById('farmaciaProbeSetup').hidden = true;
  document.getElementById('farmaciaStockForms').hidden = true;
  document.getElementById('farmaciaStockStatus').textContent = 'Carregando estoque…';
  google.script.run.withSuccessHandler(function(result) {
    if (!farmaciaStockCurrent(epoch, studyId, restricted) || readId !== FARMACIA_STOCK.readId) return;
    FARMACIA_STOCK.data = result;
    renderFarmaciaEstoque(result);
  }).withFailureHandler(function(error) {
    if (!farmaciaStockCurrent(epoch, studyId, restricted) || readId !== FARMACIA_STOCK.readId) return;
    document.getElementById('farmaciaStockStatus').textContent = appErrorMessage(error);
  }).getFarmaciaEstoque(studyId, restricted);
}

function farmaciaStockRefresh() {
  if (FARMACIA_STOCK.studyId && !FARMACIA_STOCK.saving) carregarFarmaciaEstoque(FARMACIA_STOCK.studyId, FARMACIA_STOCK.restrictedAllowed, FARMACIA_STOCK.restricted);
}

function farmaciaStockChangeClass() {
  if (FARMACIA_STOCK.studyId) carregarFarmaciaEstoque(FARMACIA_STOCK.studyId, FARMACIA_STOCK.restrictedAllowed, document.getElementById('farmaciaStockRestricted').checked);
}

function farmaciaStockNumber(value) {
  return Number(value).toLocaleString('pt-BR', { maximumFractionDigits:3 });
}

function farmaciaStockDate(value, includeTime) {
  return includeTime ? new Date(value).toLocaleString('pt-BR', { timeZone:'America/Sao_Paulo' }) : String(value).split('-').reverse().join('/');
}

function renderFarmaciaEstoque(data) {
  var products = data.products || [], positions = data.positions || [];
  document.getElementById('farmaciaStockStatus').textContent = data.configured
    ? products.length + ' produto(s) · ' + positions.length + ' posição(ões) inventariada(s). Quantidades exibidas por unidade de controle.'
    : (FARMACIA_STOCK.studyId === '@IPS_COMMON' ? 'O armazenamento do estoque comum' : 'O armazenamento deste estudo e classe') + ' ainda precisa ser configurado pelo administrador. Nenhum dado foi importado.';
  var productRows = products.map(function(product) {
    return '<tr><td>' + esc(product.name) + '</td><td>' + esc(product.presentation) + '</td><td>' + esc(product.unit) + '</td><td>' + (product.control === 'kit' ? 'Kit individualizado' : 'Por quantidade') + '</td><td>' + farmaciaConservationHtml(product.storage) + '</td></tr>';
  }).join('');
  var positionRows = positions.map(function(position) {
    var product = products.find(function(item) { return item.id === position.productId; }) || {};
    return '<tr><td>' + esc(product.name) + '<br><small>' + esc(product.presentation) + '</small></td>' +
      '<td>' + esc(position.lot) + (position.kit ? '<br>Kit ' + esc(position.kit) : '') + '</td><td>' + esc(farmaciaStockDate(position.expiry)) +
      '<br>' + esc(position.location) + (position.expired ? '<br><strong>Vencido</strong>' : '') + '<br><small>' + esc((position.storageCheck || {}).message || 'Conservação pendente de conferência.') + '</small></td>' +
      '<td>' + farmaciaStockNumber(position.physical) + ' ' + esc(product.unit) + '</td>' +
      '<td>' + farmaciaStockNumber(position.available) + ' ' + esc(product.unit) + '</td>' +
      '<td>' + farmaciaStockNumber(position.blocked) + ' ' + esc(product.unit) + '</td>' +
      '<td>' + esc(farmaciaStockDate(position.countedOn)) + '<br>' + esc(position.author) + '<br><small>Registro: ' + esc(farmaciaStockDate(position.registeredAt, true)) + '</small></td></tr>';
  }).join('');
  document.getElementById('farmaciaStockResults').innerHTML =
    '<div class="farmacia-stock-card"><h3>Produtos</h3><div class="farmacia-stock-scroll" role="region" aria-label="Produtos da Farmácia" tabindex="0"><table class="data-table"><thead><tr><th>Produto</th><th>Apresentação</th><th>Unidade</th><th>Controle</th><th>Conservação / Referência</th></tr></thead><tbody>' +
    (productRows || '<tr><td colspan="5">Nenhum produto cadastrado.</td></tr>') + '</tbody></table></div></div>' +
    '<div class="farmacia-stock-card"><h3>Inventário inicial</h3><div class="farmacia-stock-scroll" role="region" aria-label="Inventário inicial da Farmácia" tabindex="0"><table class="data-table"><thead><tr><th>Produto</th><th>Lote / Kit</th><th>Validade / Local</th><th>Físico</th><th>Disponível</th><th>Bloqueado</th><th>Conferência / Autoria</th></tr></thead><tbody>' +
    (positionRows || '<tr><td colspan="7">Nenhuma posição inventariada.</td></tr>') + '</tbody></table></div></div>';
  var canManage = data.configured && data.farmaciaAccess === 'manage';
  document.getElementById('farmaciaStockForms').hidden = !canManage;
  document.getElementById('farmaciaProductFields').disabled = !canManage || FARMACIA_STOCK.saving;
  document.getElementById('farmaciaInitialFields').disabled = !canManage || !products.length || !data.locationsConfigured || !(data.storageUnits || []).length || FARMACIA_STOCK.saving;
  renderFarmaciaLocations(data);
  var productSelect = document.getElementById('farmaciaInitialProduct'), selected = productSelect.value;
  productSelect.innerHTML = '<option value="">Selecione o produto</option>' + products.map(function(product) {
    return '<option value="' + esc(product.id) + '">' + esc(product.name + ' · ' + product.presentation + ' · ' + product.unit) + '</option>';
  }).join('');
  if (products.some(function(product) { return product.id === selected; })) productSelect.value = selected;
  if (!document.getElementById('farmaciaInitialCountedOn').value) {
    document.getElementById('farmaciaInitialCountedOn').value = new Intl.DateTimeFormat('en-CA', { timeZone:'America/Sao_Paulo', year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date());
  }
  farmaciaInitialProductChanged();
}

function farmaciaRangeLabel(value) {
  return value && value.min !== null && value.min !== undefined ? value.min + ' a ' + value.max + ' °C' : 'Faixa não definida';
}

function farmaciaConservationHtml(storage) {
  return storage ? esc(farmaciaRangeLabel(storage)) + '<br>' + esc(storage.instructions) + '<br><small>' + esc(storage.source + ' · ' + storage.version) + '</small>' : 'Conservação não cadastrada (registro anterior).';
}

function renderFarmaciaLocations(data) {
  var units = data.storageUnits || [], canManage = data.locationsCanManage === true && data.locationsConfigured;
  var labels = { active:'Ativo', maintenance:'Em manutenção', unavailable:'Indisponível' };
  document.getElementById('farmaciaLocationSetup').hidden = !canManage;
  document.getElementById('farmaciaLocationFields').disabled = !canManage || FARMACIA_STOCK.saving;
  document.getElementById('farmaciaProbeSetup').hidden = !canManage || !units.length;
  document.getElementById('farmaciaProbeFields').disabled = !canManage || !units.length || FARMACIA_STOCK.saving;
  document.getElementById('farmaciaLocationsResults').innerHTML = '<div class="farmacia-stock-card"><h3>Equipamentos e posições</h3><p class="profile-helper">Catálogo físico compartilhado, sem ocupação de outros estudos. Comparar faixas não comprova temperatura medida nem altera os saldos.</p>' +
    (!data.locationsConfigured ? '<p>Catálogo de locais ainda não configurado pelo administrador. Novos inventários precisam de equipamento e posição cadastrados.</p>' : !units.length ? '<p>Nenhum equipamento cadastrado.</p>' :
      units.map(function(unit) {
        var id = esc(unit.id);
        return '<details class="farmacia-stock-card"><summary>' + esc(unit.code) + ' · ' + esc(labels[unit.status] || unit.status) + '</summary><p>' +
          esc(unit.model) + ' · ' + esc(unit.room) + '<br>' + esc(farmaciaRangeLabel(unit)) + '<br>' + esc(unit.source + ' · ' + unit.version) +
          (unit.sensor ? '<br>Identificador anterior de sensor: ' + esc(unit.sensor) : '') + '<br>Posições: ' + esc(unit.positions.join('; ')) + '</p>' +
          '<p><strong>Sondas: ' + (unit.probes || []).length + ' cadastrada(s)</strong></p>' +
          ((unit.probes || []).map(function(probe) { return farmaciaProbeHtml(unit, probe, canManage); }).join('') || '<p>Nenhuma sonda individual cadastrada.</p>') +
          (canManage ? '<form data-farmacia-unit="' + id + '" onsubmit="return salvarSituacaoLocalFarmaciaApp(event,this)"><fieldset class="farmacia-location-status-fields"' + (FARMACIA_STOCK.saving ? ' disabled' : '') + '><label class="field-label" for="status-' + id + '">Nova situação</label><select class="f-input" name="status" id="status-' + id + '">' + Object.keys(labels).map(function(status) { return '<option value="' + status + '"' + (status === unit.status ? ' selected' : '') + '>' + labels[status] + '</option>'; }).join('') + '</select><label class="field-label" for="reason-' + id + '">Motivo</label><input class="f-input" name="reason" id="reason-' + id + '" maxlength="250" required><button class="btn-new" type="submit">Atualizar situação</button></fieldset></form>' : '') + '</details>';
      }).join('')) + '</div>';
  var select = document.getElementById('farmaciaInitialUnit'), selected = select.value;
  select.innerHTML = '<option value="">Selecione o equipamento</option>' + units.map(function(unit) { return '<option value="' + esc(unit.id) + '">' + esc(unit.code + ' · ' + labels[unit.status]) + '</option>'; }).join('');
  if (units.some(function(unit) { return unit.id === selected; })) select.value = selected;
  var probeSelect = document.getElementById('farmaciaProbeUnit'), probeSelected = probeSelect.value;
  probeSelect.innerHTML = select.innerHTML;
  if (units.some(function(unit) { return unit.id === probeSelected; })) probeSelect.value = probeSelected;
  farmaciaInitialUnitChanged();
}

function farmaciaProbeHtml(unit, probe, canManage) {
  var calibration = probe.calibration || {status:'pending',calibratedOn:'',validUntil:'',certificate:'',note:''};
  var labels = {current:'Em dia',pending:'Pendente / não informada',expired:'Vencida',out_of_service:'Fora de uso'};
  var prefix = 'calibration-' + probe.id;
  var html = '<details class="farmacia-stock-card"><summary>Sonda ' + esc(probe.code) + ' · Calibração: ' + esc(labels[probe.calibrationStatus || 'pending']) + '</summary><p>Série: ' + esc(probe.serial) + '<br>Modelo: ' + esc(probe.model) + '<br>Ponto: ' + esc(probe.point || 'Não informado') + '<br>Calibrada em: ' + esc(calibration.calibratedOn ? farmaciaStockDate(calibration.calibratedOn) : 'Não informado') + '<br>Válida até: ' + esc(calibration.validUntil ? farmaciaStockDate(calibration.validUntil) : 'Não informado') + '<br>Certificado: ' + esc(calibration.certificate || 'Não informado') + '<br>' + esc(calibration.note || '') + '</p>';
  if (canManage) html += '<form data-farmacia-probe="' + esc(probe.id) + '" data-farmacia-unit="' + esc(unit.id) + '" onsubmit="return salvarCalibracaoSondaFarmaciaApp(event,this)"><fieldset class="farmacia-location-status-fields"' + (FARMACIA_STOCK.saving ? ' disabled' : '') + '>' +
    '<label class="field-label" for="' + esc(prefix) + '-status">Nova situação da calibração</label><select class="f-input" id="' + esc(prefix) + '-status" name="calibrationStatus">' + ['pending','current','out_of_service'].map(function(status) { return '<option value="' + status + '"' + (status === calibration.status ? ' selected' : '') + '>' + (status === 'current' ? 'Calibrada — conforme certificado' : labels[status]) + '</option>'; }).join('') + '</select>' +
    '<label class="field-label" for="' + esc(prefix) + '-date">Data da calibração</label><input class="f-input" id="' + esc(prefix) + '-date" name="calibratedOn" type="date" value="' + esc(calibration.calibratedOn) + '">' +
    '<label class="field-label" for="' + esc(prefix) + '-due">Válida até (conforme documento)</label><input class="f-input" id="' + esc(prefix) + '-due" name="validUntil" type="date" value="' + esc(calibration.validUntil) + '">' +
    '<label class="field-label" for="' + esc(prefix) + '-certificate">Referência do certificado</label><input class="f-input" id="' + esc(prefix) + '-certificate" name="certificate" maxlength="250" value="' + esc(calibration.certificate) + '">' +
    '<label class="field-label" for="' + esc(prefix) + '-note">Observação</label><textarea class="f-input" id="' + esc(prefix) + '-note" name="note" maxlength="500">' + esc(calibration.note) + '</textarea><button class="btn-new" type="submit">Atualizar calibração</button></fieldset></form>';
  return html + '</details>';
}

function farmaciaInitialUnitChanged() {
  var unit = ((FARMACIA_STOCK.data || {}).storageUnits || []).find(function(item) { return item.id === document.getElementById('farmaciaInitialUnit').value; });
  var select = document.getElementById('farmaciaInitialLocation'), selected = select.value;
  select.innerHTML = '<option value="">Selecione a posição</option>' + (unit ? unit.positions : []).map(function(position) { return '<option value="' + esc(position) + '">' + esc(position) + '</option>'; }).join('');
  if (unit && unit.positions.indexOf(selected) !== -1) select.value = selected;
  farmaciaInitialStorageCheck();
}

function farmaciaInitialStorageCheck() {
  var data = FARMACIA_STOCK.data || {};
  var unit = (data.storageUnits || []).find(function(item) { return item.id === document.getElementById('farmaciaInitialUnit').value; });
  var product = (data.products || []).find(function(item) { return item.id === document.getElementById('farmaciaInitialProduct').value; });
  var storage = product && product.storage, message = 'Selecione produto, equipamento e posição. Condições adicionais exigem conferência.';
  if (unit && product) {
    if (unit.status !== 'active') message = 'Equipamento em manutenção ou indisponível. Revisar armazenamento.';
    else if (!storage || storage.min === null || unit.min === null) message = 'Faixa documental pendente. Conferir condições de conservação.';
    else if (unit.min < storage.min || unit.max > storage.max) message = 'Faixa do equipamento incompatível com a faixa do produto. Revisar armazenamento.';
    else message = 'Faixas cadastradas compatíveis. Não comprova temperatura medida nem outras condições.';
  }
  document.getElementById('farmaciaInitialStorageStatus').textContent = message;
}

function farmaciaProductControlChanged() {
  var kit = document.getElementById('farmaciaProductControl').value === 'kit';
  document.getElementById('farmaciaProductUnit').disabled = kit;
  if (kit) document.getElementById('farmaciaProductUnit').value = 'kit';
}

function farmaciaInitialProductChanged() {
  var product = ((FARMACIA_STOCK.data || {}).products || []).find(function(item) { return item.id === document.getElementById('farmaciaInitialProduct').value; });
  var kit = !!product && product.control === 'kit';
  document.getElementById('farmaciaKitField').hidden = !kit;
  document.getElementById('farmaciaInitialKit').required = kit;
  document.getElementById('farmaciaInitialPhysical').readOnly = kit;
  document.getElementById('farmaciaInitialPhysical').step = product && ['mL', 'g'].indexOf(product.unit) !== -1 ? '0.001' : '1';
  document.getElementById('farmaciaInitialBlocked').step = document.getElementById('farmaciaInitialPhysical').step;
  if (kit) document.getElementById('farmaciaInitialPhysical').value = '1';
  else document.getElementById('farmaciaInitialKit').value = '';
  farmaciaInitialStorageCheck();
}

function farmaciaOperationId() {
  return window.crypto && window.crypto.randomUUID ? window.crypto.randomUUID() : 'farm-' + Date.now() + '-' + Math.random().toString(36).slice(2);
}

function farmaciaStockSave(type, data) {
  var catalogAction = type === 'location' || type === 'status' || type === 'probe' || type === 'calibration';
  if (FARMACIA_STOCK.saving || !FARMACIA_STOCK.data || (catalogAction ? !FARMACIA_STOCK.data.locationsConfigured || !FARMACIA_STOCK.data.locationsCanManage : !FARMACIA_STOCK.data.configured || FARMACIA_STOCK.data.farmaciaAccess !== 'manage')) return;
  var epoch = FARMACIA_STOCK.epoch, studyId = FARMACIA_STOCK.studyId, restricted = FARMACIA_STOCK.restricted;
  var tokenKey = type + 'Token';
  if (!FARMACIA_STOCK[tokenKey]) FARMACIA_STOCK[tokenKey] = farmaciaOperationId();
  FARMACIA_STOCK.saving = true;
  document.getElementById('farmaciaProductFields').disabled = document.getElementById('farmaciaInitialFields').disabled = true;
  document.getElementById('farmaciaLocationFields').disabled = true;
  document.getElementById('farmaciaProbeFields').disabled = true;
  document.querySelectorAll('.farmacia-location-status-fields').forEach(function(fields) { fields.disabled = true; });
  document.getElementById('farmaciaStockStatus').textContent = 'Salvando…';
  var runner = google.script.run.withSuccessHandler(function() {
    if (!farmaciaStockCurrent(epoch, studyId, restricted)) return;
    FARMACIA_STOCK.saving = false;
    FARMACIA_STOCK[tokenKey] = '';
    if (type !== 'status' && type !== 'calibration') document.getElementById(type === 'product' ? 'farmaciaProductForm' : type === 'location' ? 'farmaciaLocationForm' : type === 'probe' ? 'farmaciaProbeForm' : 'farmaciaInitialForm').reset();
    farmaciaProductControlChanged();
    farmaciaStockRefresh();
  }).withFailureHandler(function(error) {
    if (!farmaciaStockCurrent(epoch, studyId, restricted)) return;
    FARMACIA_STOCK.saving = false;
    var current = FARMACIA_STOCK.data;
    document.getElementById('farmaciaProductFields').disabled = !current.configured || current.farmaciaAccess !== 'manage';
    document.getElementById('farmaciaInitialFields').disabled = !current.configured || current.farmaciaAccess !== 'manage' || !current.locationsConfigured || !(current.storageUnits || []).length || !(current.products || []).length;
    document.getElementById('farmaciaLocationFields').disabled = !current.locationsConfigured || !current.locationsCanManage;
    document.getElementById('farmaciaProbeFields').disabled = !current.locationsConfigured || !current.locationsCanManage || !(current.storageUnits || []).length;
    document.querySelectorAll('.farmacia-location-status-fields').forEach(function(fields) { fields.disabled = !current.locationsCanManage; });
    document.getElementById('farmaciaStockStatus').textContent = appErrorMessage(error) + ' O formulário e o identificador da operação foram preservados para conferência ou nova tentativa.';
  });
  var payload = { studyId:studyId, restricted:restricted, requestId:FARMACIA_STOCK[tokenKey], data:data };
  if (type === 'product') runner.cadastrarProdutoFarmacia(payload);
  else if (type === 'location') runner.cadastrarLocalFarmacia(payload);
  else if (type === 'status') runner.atualizarSituacaoLocalFarmacia(payload);
  else if (type === 'probe') runner.cadastrarSondaFarmacia(payload);
  else if (type === 'calibration') runner.atualizarCalibracaoSondaFarmacia(payload);
  else runner.registrarInventarioInicialFarmacia(payload);
}

function salvarProdutoFarmaciaApp(event) {
  event.preventDefault();
  farmaciaStockSave('product', { name:document.getElementById('farmaciaProductName').value, presentation:document.getElementById('farmaciaProductPresentation').value,
    unit:document.getElementById('farmaciaProductUnit').value, control:document.getElementById('farmaciaProductControl').value,
    storage:{ min:farmaciaInputTemperature('farmaciaProductMin'), max:farmaciaInputTemperature('farmaciaProductMax'), instructions:document.getElementById('farmaciaProductInstructions').value,
      source:document.getElementById('farmaciaProductSource').value, version:document.getElementById('farmaciaProductVersion').value } });
  return false;
}

function salvarInventarioFarmaciaApp(event) {
  event.preventDefault();
  farmaciaStockSave('initial', { productId:document.getElementById('farmaciaInitialProduct').value,
    lot:document.getElementById('farmaciaInitialLot').value, expiry:document.getElementById('farmaciaInitialExpiry').value,
    location:'Catálogo', locationRef:{unitId:document.getElementById('farmaciaInitialUnit').value,position:document.getElementById('farmaciaInitialLocation').value}, kit:document.getElementById('farmaciaInitialKit').value,
    physical:document.getElementById('farmaciaInitialPhysical').valueAsNumber, blocked:document.getElementById('farmaciaInitialBlocked').valueAsNumber,
    countedOn:document.getElementById('farmaciaInitialCountedOn').value, note:document.getElementById('farmaciaInitialNote').value,
    confirmed:document.getElementById('farmaciaInitialConfirmed').checked });
  return false;
}

function farmaciaInputTemperature(id) {
  var input = document.getElementById(id);
  return input.value === '' ? null : input.valueAsNumber;
}

function salvarLocalFarmaciaApp(event) {
  event.preventDefault();
  farmaciaStockSave('location', {code:document.getElementById('farmaciaLocationCode').value, type:document.getElementById('farmaciaLocationType').value,
    model:document.getElementById('farmaciaLocationModel').value, room:document.getElementById('farmaciaLocationRoom').value,
    min:farmaciaInputTemperature('farmaciaLocationMin'), max:farmaciaInputTemperature('farmaciaLocationMax'),
    source:document.getElementById('farmaciaLocationSource').value, version:document.getElementById('farmaciaLocationVersion').value,
    sensor:'', status:document.getElementById('farmaciaLocationStatus').value,
    positions:document.getElementById('farmaciaLocationPositions').value.split(/\r?\n/).map(function(value) { return value.trim(); }).filter(Boolean) });
  return false;
}

function salvarSituacaoLocalFarmaciaApp(event, form) {
  event.preventDefault();
  var unit = ((FARMACIA_STOCK.data || {}).storageUnits || []).find(function(item) { return item.id === form.getAttribute('data-farmacia-unit'); });
  if (unit) farmaciaStockSave('status', {unitId:unit.id,revision:unit.revision,status:form.elements.status.value,reason:form.elements.reason.value});
  return false;
}

function salvarSondaFarmaciaApp(event) {
  event.preventDefault();
  farmaciaStockSave('probe', {unitId:document.getElementById('farmaciaProbeUnit').value,code:document.getElementById('farmaciaProbeCode').value,
    serial:document.getElementById('farmaciaProbeSerial').value,model:document.getElementById('farmaciaProbeModel').value,point:document.getElementById('farmaciaProbePoint').value,
    calibration:{status:document.getElementById('farmaciaProbeCalibrationStatus').value,calibratedOn:document.getElementById('farmaciaProbeCalibratedOn').value,
      validUntil:document.getElementById('farmaciaProbeValidUntil').value,certificate:document.getElementById('farmaciaProbeCertificate').value,note:document.getElementById('farmaciaProbeCalibrationNote').value}});
  return false;
}

function salvarCalibracaoSondaFarmaciaApp(event, form) {
  event.preventDefault();
  var unit = ((FARMACIA_STOCK.data || {}).storageUnits || []).find(function(item) { return item.id === form.getAttribute('data-farmacia-unit'); });
  var probe = unit && (unit.probes || []).find(function(item) { return item.id === form.getAttribute('data-farmacia-probe'); });
  if (probe) farmaciaStockSave('calibration', {unitId:unit.id,probeId:probe.id,revision:probe.revision,calibration:{status:form.elements.calibrationStatus.value,
    calibratedOn:form.elements.calibratedOn.value,validUntil:form.elements.validUntil.value,certificate:form.elements.certificate.value,note:form.elements.note.value}});
  return false;
}
</script>
