<script>
function farmaciaRecordActions(kind, record, data) {
  var manage = data.farmaciaAccess === 'manage';
  var label = kind === 'product' ? (farmaciaProductCharacteristics(record) ? farmaciaProductLabel(record) : record.name) : 'lote ' + record.lot;
  return '<div class="action-btns">' + ['view', 'edit', 'delete'].filter(function(action) { return action === 'view' || manage; }).map(function(action) {
    var accessibleLabel = kind === 'position' && action === 'view' ? 'Ver histórico do lote ' + record.lot : ({view:'Visualizar ',edit:'Editar ',delete:'Excluir '})[action] + label;
    return '<button type="button" class="icon-btn' + (action === 'delete' ? ' del' : '') + '" data-kind="' + kind + '" data-record-id="' + esc(record.id) + '"' + (kind === 'position' && action === 'view' ? ' data-position-id="' + esc(record.id) + '"' : '') + ' data-action="' + action + '" onclick="farmaciaOpenRecordAction(this.dataset.kind,this.dataset.recordId,this.dataset.action)" aria-label="' + esc(accessibleLabel) + '" title="' + ({view:'Visualizar',edit:'Editar',delete:'Excluir'})[action] + '"><span class="material-symbols-outlined" aria-hidden="true">' + ({view:'visibility',edit:'edit',delete:'delete'})[action] + '</span></button>';
  }).join('') + '</div>';
}

function farmaciaOpenRecordAction(kind, id, action) {
  var data = FARMACIA_STOCK.data;
  if (!data || FARMACIA_STOCK.saving) return;
  var record = (kind === 'product' ? data.products : data.positions).find(function(item) { return item.id === id; });
  if (!record || (action !== 'view' && data.farmaciaAccess !== 'manage')) return;
  if (kind === 'position' && action === 'view') { farmaciaOpenPosition(id); return; }
  var modal = document.getElementById('farmaciaModal-recordAction');
  if (!modal) {
    modal = document.createElement('div'); modal.id = 'farmaciaModal-recordAction'; modal.className = 'modal-overlay farmacia-dialog';
    modal.setAttribute('data-extra-dialog', ''); modal.setAttribute('data-accessible-dialog', '');

    document.body.appendChild(modal);
  }
  modal.farmaciaSnapshot = { kind:kind, record:JSON.parse(JSON.stringify(record)), action:action, epoch:FARMACIA_STOCK.epoch,
    studyId:FARMACIA_STOCK.studyId, restricted:FARMACIA_STOCK.restricted, requestId:farmaciaOperationId() };
  var deleting = action === 'delete', viewing = action === 'view';
  var title = ({view:'Visualizar',edit:'Editar',delete:'Excluir'})[action] + (kind === 'product' ? ' produto' : ' inventário inicial');
  var fields = '';
  function input(name, label, value, type, max, optional) {
    return '<div class="field' + (name === 'name' || name === 'presentation' ? ' full' : '') + '"><label class="field-label" for="farmaciaAction-' + name + '">' + label + '</label><input class="f-input" id="farmaciaAction-' + name + '" name="' + name + '" type="' + (type || 'text') + '" value="' + esc(value || '') + '" maxlength="' + (max || 160) + '"' + (optional ? '' : ' required') + '></div>';
  }
  if (viewing && kind === 'product') {
    var detailFields = [['name','Produto',record.name],['category','Tipo de produto',farmaciaProductCategoryLabel(record.category)],
      ['barcode','Código de barras do produto',record.barcode],
      ['dosageForm','Forma farmacêutica',record.dosageForm],['strength','Dosagem / concentração',record.strength],
      ['route','Via de administração',record.route],['presentation','Apresentação / embalagem',record.presentation]];
    fields = '<dl class="farmacia-detail-grid full">' + detailFields.filter(function(field) {
      return record.category !== 'material' || ['dosageForm','strength','route'].indexOf(field[0]) === -1;
    }).map(function(field) {
      return '<div><dt>' + field[1] + '</dt><dd>' + esc(field[2] || 'Não informado') + '</dd></div>';
    }).join('') + '<div><dt>Unidade / Controle</dt><dd>' + esc(record.unit) + ' · ' + esc(record.control === 'kit' ? 'Kit individualizado' : 'Por quantidade') + '</dd></div><div><dt>Conservação</dt><dd>' + farmaciaConservationHtml(record.storage) + '</dd></div></dl>';
  } else if (viewing) fields = '<dl class="farmacia-detail-grid full"><div><dt>Lote</dt><dd>' + esc(record.lot || 'Não informado') + '</dd></div><div><dt>Validade</dt><dd>' + esc(record.expiry || 'Não informada') + '</dd></div></dl>';
  else if (!deleting && kind === 'product') {
    var categoryField = '<div class="field"><label class="field-label" for="farmaciaAction-category">Tipo de produto</label><select class="f-input f-select" id="farmaciaAction-category" name="category" required onchange="farmaciaProductCategoryChanged(this.form)">' + farmaciaProductCategoryOptionsHtml(record.category) + '</select></div>';
    var barcodeField = '<div class="field full"><label class="field-label" for="farmaciaAction-barcode">Código de barras do produto (opcional)</label><input class="f-input" id="farmaciaAction-barcode" name="barcode" type="text" value="' + esc(record.barcode || '') + '" maxlength="80" inputmode="numeric" autocomplete="off" spellcheck="false" onkeydown="if(event.key===\'Enter\')event.preventDefault()"><div class="field-help">Código geral da embalagem; não use o número de um kit individualizado.</div></div>';
    var dosageFormField = '<div class="field" data-farmacia-medication-field><label class="field-label" for="farmaciaAction-dosageForm">Forma farmacêutica (opcional)</label><select class="f-input f-select" id="farmaciaAction-dosageForm" name="dosageForm">' + farmaciaProductDosageFormOptionsHtml(record.dosageForm) + '</select></div>';
    var strengthField = '<div class="field" data-farmacia-medication-field><label class="field-label" for="farmaciaAction-strength">Dosagem / concentração (opcional)</label><input class="f-input" id="farmaciaAction-strength" name="strength" value="' + esc(record.strength || '') + '" maxlength="120"></div>';
    var routeField = '<div class="field" data-farmacia-medication-field><label class="field-label" for="farmaciaAction-route">Via de administração (opcional)</label><input class="f-input" id="farmaciaAction-route" name="route" value="' + esc(record.route || '') + '" maxlength="80"></div>';
    fields = categoryField + input('name','Nome ou descrição do produto',record.name) + barcodeField + dosageFormField + strengthField + routeField + input('presentation','Apresentação / embalagem',record.presentation) + '<p class="profile-helper full">Informe o que identifica o produto e a embalagem controlada no estoque.</p>';
  } else if (!deleting) fields = input('lot', 'Lote', record.lot, 'text', 100) + input('expiry', 'Validade', record.expiry, 'date') + '<div class="field full"><label class="field-label" for="farmaciaAction-note">Observação</label><textarea class="f-input" id="farmaciaAction-note" name="note" maxlength="500">' + esc(record.note || '') + '</textarea></div>';
  if (!viewing) fields += '<div class="field full"><label class="field-label" for="farmaciaAction-reason">Motivo da ' + (deleting ? 'exclusão' : 'correção') + '</label><textarea class="f-input" id="farmaciaAction-reason" name="reason" maxlength="500" required></textarea></div>';
  if (deleting) fields += '<label class="field full"><input type="checkbox" name="confirmed" required> Confirmo a exclusão deste cadastro incorreto. O histórico será preservado.</label>';
  var copy = deleting ? 'Produtos com histórico, recebimentos e inventários com movimentações não podem ser excluídos.' : kind === 'position' ? 'A correção preserva quantidades, produto, kit e localização. Recebimentos e inventários com movimentações devem usar os fluxos de movimentação.' : '';
  modal.innerHTML = '<div class="modal-box farmacia-modal-box" role="dialog" aria-modal="true" aria-labelledby="farmaciaRecordActionTitle" tabindex="-1"><div class="modal-header"><div class="modal-header-icon"><span class="material-symbols-outlined" aria-hidden="true">' + (kind === 'product' ? 'medication' : 'inventory_2') + '</span></div><div><div class="modal-header-title" id="farmaciaRecordActionTitle">' + title + '</div>' + (kind === 'product' ? '<div class="modal-header-sub">' + esc(farmaciaCurrentStudyLabel()) + '</div>' : '') + '</div><button type="button" class="modal-close" onclick="fecharOverlay(\'farmaciaModal-recordAction\')" aria-label="Fechar"><span class="material-symbols-outlined">close</span></button></div><div class="modal-body"><form onsubmit="return farmaciaSaveRecordAction(event,this)"><div class="form-section"><div class="section-label">' + (viewing ? 'Dados do produto' : deleting ? 'Confirmação' : kind === 'product' ? 'Identificação e apresentação' : 'Correção do inventário') + '</div>' + (copy ? '<p>' + copy + '</p>' : '') + '<fieldset class="form-grid">' + fields + '</fieldset></div><p class="farmacia-dialog-status" role="status"></p><div class="farmacia-dialog-actions"><button type="button" class="btn-txt" onclick="fecharOverlay(\'farmaciaModal-recordAction\')">' + (viewing ? 'Fechar' : 'Cancelar') + '</button>' + (viewing ? '' : '<button type="submit" class="btn-save">' + (deleting ? 'Excluir' : 'Salvar correção') + '</button>') + '</div></form></div></div>';
  if (!viewing && !deleting && kind === 'product') farmaciaProductCategoryChanged(modal.querySelector('form'));
  if (typeof appSyncAccessibleDialogs === 'function') appSyncAccessibleDialogs();
  abrirOverlay(modal.id);
}

function farmaciaSaveRecordAction(event, form) {
  event.preventDefault();
  var modal = document.getElementById('farmaciaModal-recordAction'), snapshot = modal.farmaciaSnapshot;
  if (!snapshot || FARMACIA_STOCK.saving || !farmaciaStockCurrent(snapshot.epoch, snapshot.studyId, snapshot.restricted)) return false;
  var deleting = snapshot.action === 'delete', product = snapshot.kind === 'product';
  if (deleting && !form.elements.confirmed.checked) return false;
  var data = {entityId:snapshot.record.id,revision:snapshot.record.revision || snapshot.record.id,reason:form.elements.reason.value};
  if (!deleting) data.data = product ? Object.assign({}, snapshot.record, {category:form.elements.category.value,name:form.elements.name.value,presentation:form.elements.presentation.value}) : {lot:form.elements.lot.value,expiry:form.elements.expiry.value,note:form.elements.note.value};
  if (!deleting && product) ['barcode','dosageForm','strength','route'].forEach(function(key) { data.data[key] = form.elements[key].value; });
  var payload = {studyId:snapshot.studyId,restricted:snapshot.restricted,requestId:snapshot.requestId,
    type:(product ? 'PRODUCT_' : 'INITIAL_') + (deleting ? 'DELETE' : 'EDIT'),data:data};
  function current() { return farmaciaStockCurrent(snapshot.epoch, snapshot.studyId, snapshot.restricted) && modal.farmaciaSnapshot === snapshot; }
  FARMACIA_STOCK.saving = true; modal.dataset.extraSaving = '1'; form.querySelector('fieldset').disabled = true; form.querySelector('[type="submit"]').disabled = true;
  modal.querySelector('.farmacia-dialog-status').textContent = 'Salvando…';
  google.script.run.withSuccessHandler(function() {
    if (!current()) return;
    FARMACIA_STOCK.saving = false; modal.dataset.extraSaving = '0';
    if (typeof appClearUnsavedChanges === 'function') appClearUnsavedChanges(modal.id);
    fecharOverlay(modal.id); farmaciaStockRefresh();
  }).withFailureHandler(function(error) {
    if (!current()) return;
    FARMACIA_STOCK.saving = false; modal.dataset.extraSaving = '0'; form.querySelector('fieldset').disabled = false; form.querySelector('[type="submit"]').disabled = false;
    modal.querySelector('.farmacia-dialog-status').textContent = appErrorMessage(error) + ' Os dados foram preservados.';
  }).alterarRegistroFarmacia(payload);
  return false;
}
</script>
