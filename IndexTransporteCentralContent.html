    <div class="page" id="page-transporte-central">
      <div class="tc-wrap">
        <div class="tc-head">
          <p class="tc-lead">Uma tarefa por vez, na ordem em que o sistema decide.</p>
          <button class="icon-btn" type="button" id="tcRefresh" onclick="transpCentralCarregar(true)" aria-label="Atualizar tarefas" title="Atualizar tarefas"><span class="material-symbols-outlined" aria-hidden="true">refresh</span></button>
        </div>
        <div class="tc-tabs" id="tcTabs" role="tablist" aria-label="Seções do Transporte">
          <button type="button" class="tc-tab active" role="tab" id="tcTabFazer" data-tc-tab="fazer" aria-selected="true" aria-controls="tcPanelFazer" onclick="transpCentralAba('fazer')">Para fazer</button>
          <button type="button" class="tc-tab" role="tab" id="tcTabAcompanhar" data-tc-tab="acompanhar" aria-selected="false" aria-controls="tcPanelAcompanhar" tabindex="-1" onclick="transpCentralAba('acompanhar')">Acompanhar</button>
          <button type="button" class="tc-tab" role="tab" id="tcTabAdiante" data-tc-tab="adiante" aria-selected="false" aria-controls="tcPanelAdiante" tabindex="-1" onclick="transpCentralAba('adiante')">Mais adiante</button>
          <button type="button" class="tc-tab" role="tab" id="tcTabBackups" data-tc-tab="backups" aria-selected="false" aria-controls="tcPanelBackups" tabindex="-1" onclick="transpCentralAba('backups')">Backups não agendados</button>
        </div>
        <p id="tcStatus" class="sr-only" role="status" aria-live="polite"></p>
        <div id="tcWizard" class="tc-wizard" hidden aria-live="polite"></div>
        <section class="tc-panel" id="tcPanelFazer" role="tabpanel" aria-labelledby="tcTabFazer">
          <div id="tcFazer" aria-busy="true"><div class="tc-empty">Carregando tarefas…</div></div>
        </section>
        <section class="tc-panel" id="tcPanelAcompanhar" role="tabpanel" aria-labelledby="tcTabAcompanhar" hidden>
          <div id="tcAcompanhar"><div class="tc-empty">Carregando…</div></div>
        </section>
        <section class="tc-panel" id="tcPanelAdiante" role="tabpanel" aria-labelledby="tcTabAdiante" hidden>
          <div id="tcAdiante"><div class="tc-empty">Carregando…</div></div>
        </section>
        <section class="tc-panel" id="tcPanelBackups" role="tabpanel" aria-labelledby="tcTabBackups" hidden>
          <div id="tcBackups"><div class="tc-empty">Carregando…</div></div>
        </section>
      </div>
    </div>
