<script>
  // Transporte (tela nova): prefixo transpCentral*, sem globais genéricos.
  var TRANSP_CENTRAL_REQUEST_ID = 0;
  var TRANSP_CENTRAL_STATE = { dados: null, aba: 'fazer', semanaAberta: '' };

  function transpCentralAba(aba) {
    TRANSP_CENTRAL_STATE.aba = aba;
    document.querySelectorAll('.tc-tab').forEach(function(button) {
      var ativa = button.getAttribute('data-tc-tab') === aba;
      button.classList.toggle('active', ativa);
      button.setAttribute('aria-selected', ativa ? 'true' : 'false');
      button.tabIndex = ativa ? 0 : -1;
    });
    ['fazer', 'acompanhar', 'transito', 'adiante', 'backups'].forEach(function(nome) {
      var painel = document.getElementById('tcPanel' + nome.charAt(0).toUpperCase() + nome.slice(1));
      if (painel) painel.hidden = nome !== aba;
    });
  }

  function transpCentralTextoMeta(tarefa) {
    var data = [tarefa.data, tarefa.hora].filter(Boolean).join(' ');
    return [tarefa.participante, tarefa.visita, tarefa.projeto, data].filter(Boolean).join(' · ');
  }

  var TC_SITUACAO = { preparar: 'Preparar', pinex_pedir: 'Pedir a coleta', pinex_numeros: 'Informar os números', enviar_doc: 'Enviar pedido de coleta' };

  // Um transporte em linha: tipo (chip), courier e temperatura em destaque, destino e AWB discretos.
  // O tipo (Transporte I, Backup…) só aparece aqui; nunca no título da tarefa.
  function transpCentralHtmlTransporteLinha(t, acoes, detalheExtra) {
    return '<li><span class="chip chip-gray tc-slot">' + esc(t.slotRotulo || '') + '</span>' +
      (t.situacao && TC_SITUACAO[t.situacao] ? '<span class="tc-situacao">' + esc(TC_SITUACAO[t.situacao]) + '</span>' : '') +
      '<span class="tc-acomp-courier">' + esc([t.courier, t.temperatura].filter(Boolean).join(' · ')) + '</span>' +
      '<span class="tc-acomp-detalhe">' + esc([t.destino, t.awb ? 'AWB ' + t.awb : '', detalheExtra || ''].filter(Boolean).join(' · ')) + '</span>' +
      (acoes ? '<span class="tc-acomp-acao-transp">' + acoes + '</span>' : '') + '</li>';
  }

  function transpCentralEtiquetas(tarefa) {
    var etiquetas = [];
    if (tarefa.prazoLabel) etiquetas.push('<span class="chip chip-red tc-chip"><span class="material-symbols-outlined" aria-hidden="true">schedule</span>' + esc(tarefa.prazoLabel) + '</span>');
    if (tarefa.parouNoPasso) etiquetas.push('<span class="chip chip-orange tc-chip"><span class="material-symbols-outlined" aria-hidden="true">bookmark</span>Parou no passo ' + esc(tarefa.parouNoPasso) + '</span>');
    if (tarefa.comPessoa) etiquetas.push('<span class="chip chip-purple tc-chip"><span class="material-symbols-outlined" aria-hidden="true">person</span>Com ' + esc(tarefa.comPessoa) + ' agora</span>');
    return etiquetas.length ? '<div class="tc-badges">' + etiquetas.join('') + '</div>' : '';
  }

  // Cabeçalho de seção no padrão do app (section-label: rótulo em caixa alta com linha), contagem e explicação.
  function transpCentralHtmlCabecalho(titulo, icone, total, dica) {
    return '<div class="tc-secao-cab"><h3 class="section-label tc-secao-tit"><span class="material-symbols-outlined" aria-hidden="true">' + icone + '</span>' +
      esc(titulo) + (total !== undefined && total !== null ? '<span class="chip chip-blue tc-count">' + esc(total) + '</span>' : '') + '</h3>' +
      (dica ? '<p class="tc-secao-dica">' + dica + '</p>' : '') + '</div>';
  }

  // Cabeçalho de colunas da tabela, como o .data-table do app. colunas: rótulos na ordem da grade.
  function transpCentralHtmlThead(classe, colunas) {
    return '<div class="tc-thead ' + classe + '" aria-hidden="true">' + colunas.map(function(c) { return '<span>' + esc(c) + '</span>'; }).join('') + '</div>';
  }

  function transpCentralHtmlFazer(dados) {
    var tarefas = dados.tarefas || [];
    var adiante = dados.maisAdiante || { transportes: 0 };
    var rodape = adiante.transportes
      ? '<p class="tc-footer"><span class="material-symbols-outlined" aria-hidden="true">event_upcoming</span>' + esc(adiante.transportes) +
        (adiante.transportes === 1 ? ' transporte vira tarefa em breve. ' : ' transportes viram tarefa em breve. ') +
        '<button type="button" class="tc-link" data-tc-ir="adiante">Ver Em breve</button></p>'
      : '';
    if (!tarefas.length) {
      return '<div class="tc-empty"><span class="material-symbols-outlined" aria-hidden="true">check_circle</span>Tudo feito por agora.</div>' + rodape;
    }
    var proxima = tarefas[0];
    var html = transpCentralHtmlCabecalho('Próxima tarefa', 'play_circle', null, '') +
      '<article class="tc-next' + (proxima.prazoLabel ? ' urgent' : '') + '" data-tc-agenda="' + esc(proxima.agendaId) + '">' +
      '<div class="tc-next-top">' + transpCentralHtmlDataDestaque(proxima.dataOrdem, proxima.data, proxima.hora) +
      '<div class="tc-next-texto"><h2 class="tc-title">' + esc(proxima.titulo) + '</h2>' +
      '<p class="tc-meta"><strong>' + esc(proxima.participante) + '</strong>' + esc([proxima.projeto, proxima.visita].filter(Boolean).map(function(p) { return ' · ' + p; }).join('')) + '</p>' +
      transpCentralEtiquetas(proxima) + '</div></div>' +
      '<ul class="tc-acomp-transp tc-transports">' + (proxima.transportes || []).map(function(t) { return transpCentralHtmlTransporteLinha(t); }).join('') + '</ul>' +
      '<div class="tc-actions"><button type="button" class="btn-new" data-tc-comecar="' + esc(proxima.agendaId) + '"><span class="material-symbols-outlined" aria-hidden="true">play_arrow</span>Começar</button>' +
      '<button type="button" class="tc-link" data-tc-abrir="' + esc(proxima.agendaId) + '">Abrir na Agenda</button></div>' +
      '</article>';
    if (tarefas.length > 1) {
      var seguintes = tarefas.slice(1);
      html += '<section class="tc-secao">' + transpCentralHtmlCabecalho('Depois desta, nesta ordem', 'format_list_numbered', seguintes.length,
        'O sistema mostra uma tarefa por vez. Estas vêm em seguida.') +
        '<div class="tc-tabela tc-list" role="list">' + transpCentralHtmlThead('tc-grade-fila', ['Envio', 'Participante', 'Tarefa', 'Situação']) +
        seguintes.map(function(t) {
          var urgente = !!t.prazoLabel;
          return '<div class="tc-acomp tc-grade-fila tc-item' + (urgente ? ' urgent' : '') + '" role="listitem">' +
            '<span class="tc-acomp-data">' + transpCentralHtmlDataDestaque(t.dataOrdem, t.data, t.hora) + '</span>' +
            '<span class="tc-trans-quem"><strong>' + esc(t.participante) + '</strong><span>' + esc([t.projeto, t.visita].filter(Boolean).join(' · ')) + '</span></span>' +
            '<span class="tc-fila-tarefa"><strong class="tc-item-title">' + esc(t.titulo) + '</strong><span class="tc-item-meta">' +
            esc((t.transportes || []).map(function(x) { return [x.slotRotulo, [x.courier, x.temperatura].filter(Boolean).join(' · ')].filter(Boolean).join(': '); }).join(' + ')) + '</span></span>' +
            '<span class="tc-fila-chips">' + transpCentralEtiquetas(t) + '</span></div>';
        }).join('') + '</div></section>';
    }
    return html + rodape;
  }

  function transpCentralMetaItem(it) {
    var data = [it.data, it.hora].filter(Boolean).join(' ');
    return [it.participante, it.visita, it.projeto, data].filter(Boolean).join(' · ');
  }

  function transpCentralLinhaTransporte(it) {
    return [it.slotRotulo, [it.courier, it.temperatura].filter(Boolean).join(' / '), it.destino, it.awb ? 'AWB ' + it.awb : ''].filter(Boolean).join(' · ');
  }

  // Acompanhar: uma linha por visita (os transportes da mesma visita ficam juntos), no mesmo padrão de tabela
  // de "Em trânsito". Os dados só vão para data-* dos botões; nada vem do usuário sem esc().
  function transpCentralAgruparVisitas(itens) {
    var grupos = [];
    var porId = {};
    (itens || []).forEach(function(it) {
      var id = String(it.agendaId || '');
      if (!porId[id]) {
        porId[id] = { agendaId: id, data: it.data, hora: it.hora, dataOrdem: it.dataOrdem, viraTarefaEm: it.viraTarefaEm, participante: it.participante, projeto: it.projeto, visita: it.visita, prazoLabel: '', itens: [] };
        grupos.push(porId[id]);
      }
      if (it.prazoLabel && !porId[id].prazoLabel) porId[id].prazoLabel = it.prazoLabel;
      porId[id].itens.push(it);
    });
    return grupos;
  }

  // acao(it): HTML das ações de um transporte (ou '' quando a ação é da visita inteira).
  function transpCentralHtmlTransportesVisita(grupo, acao) {
    return '<ul class="tc-acomp-transp">' + grupo.itens.map(function(it) {
      return transpCentralHtmlTransporteLinha(it, acao ? acao(it) : '', it.extraDetalhe);
    }).join('') + '</ul>';
  }

  // Linha de uma visita: data em destaque (e prazo), participante, transportes e, se houver, a ação da visita.
  function transpCentralHtmlLinhaVisita(grupo, acaoTransporte, acaoVisita, final) {
    return '<div class="tc-acomp ' + (acaoVisita || final ? 'tc-grade-acao' : 'tc-grade-sem-acao') + (grupo.prazoLabel ? ' urgent' : '') + '" role="listitem" data-tc-id="' + esc(grupo.agendaId) + '">' +
      '<span class="tc-acomp-data">' + transpCentralHtmlDataDestaque(grupo.dataOrdem, grupo.data, grupo.hora) +
      (grupo.prazoLabel ? '<span class="chip chip-red tc-chip"><span class="material-symbols-outlined" aria-hidden="true">schedule</span>' + esc(grupo.prazoLabel) + '</span>' : '') + '</span>' +
      '<span class="tc-trans-quem"><strong>' + esc(grupo.participante) + '</strong><span>' + esc([grupo.projeto, grupo.visita].filter(Boolean).join(' · ')) + '</span></span>' +
      transpCentralHtmlTransportesVisita(grupo, acaoTransporte) +
      (acaoVisita ? '<span class="tc-trans-acoes">' + acaoVisita(grupo) + '</span>' : (final ? final(grupo) : '')) + '</div>';
  }

  // Seção de lista no padrão do módulo: cabeçalho do app, cabeçalho de colunas e uma linha por visita.
  // opcoes: { titulo, icone, itens, dica, acaoTransporte, acaoVisita, final, colunaFinal, vazio }.
  function transpCentralHtmlSecaoAcompanhar(opcoes) {
    var grupos = transpCentralAgruparVisitas(opcoes.itens);
    var visitas = grupos.length === 1 ? '1 visita' : grupos.length + ' visitas';
    var transportes = opcoes.itens.length === 1 ? '1 transporte' : opcoes.itens.length + ' transportes';
    var comAcao = !!(opcoes.acaoVisita || opcoes.final);
    var colunas = ['Envio', 'Participante', 'Transportes'].concat(comAcao ? [opcoes.colunaFinal || ''] : []);
    return '<section class="tc-secao tc-secao-acomp" aria-label="' + esc(opcoes.titulo) + '">' +
      transpCentralHtmlCabecalho(opcoes.titulo, opcoes.icone, opcoes.itens.length, esc(opcoes.dica) + ' <span class="tc-dim">' + esc(transportes + ' em ' + visitas) + '.</span>') +
      '<div class="tc-tabela" role="list">' + transpCentralHtmlThead(comAcao ? 'tc-grade-acao' : 'tc-grade-sem-acao', colunas) +
      grupos.map(function(g) { return transpCentralHtmlLinhaVisita(g, opcoes.acaoTransporte, opcoes.acaoVisita, opcoes.final); }).join('') + '</div></section>';
  }

  function transpCentralBotao(classe, icone, texto, atributos, rotulo) {
    return '<button type="button" class="tc-acao ' + classe + '" ' + atributos + (rotulo ? ' aria-label="' + esc(rotulo) + '"' : '') + '>' +
      '<span class="material-symbols-outlined" aria-hidden="true">' + icone + '</span>' + esc(texto) + '</button>';
  }

  // GRU e extrato pendentes: o botão só aparece para quem está na lista de peticionamento; confirma em dois cliques.
  function transpCentralHtmlPeticionamento(itens, pode) {
    if (!itens.length) return '';
    return transpCentralHtmlSecaoAcompanhar({
      titulo: 'Aguardando peticionamento (GRU e extrato)', icone: 'gavel', itens: itens,
      dica: pode ? 'Salve a GRU e o extrato na pasta do envio, no servidor, e marque aqui.' : 'Quem peticiona salva a GRU e o extrato na pasta do envio e marca no app.',
      acaoTransporte: function(it) {
        return pode ? transpCentralBotao('verde', 'task_alt', 'GRU e extrato prontos', 'data-tc-gru="' + esc(it.agendaId) + '|' + esc(it.slot) + '"', 'GRU e extrato prontos: ' + it.participante + ', ' + it.slotRotulo)
          : '<span class="tc-dim">Aguardando quem peticiona</span>';
      }
    });
  }

  function transpCentralMarcarGru(alvo) {
    // Primeiro clique arma a confirmação; o segundo executa.
    if (!alvo.hasAttribute('data-tc-armado')) {
      alvo.setAttribute('data-tc-armado', '1');
      alvo.textContent = 'Confirmar: GRU e extrato prontos?';
      return;
    }
    var partes = alvo.getAttribute('data-tc-gru').split('|');
    alvo.disabled = true;
    google.script.run
      .withSuccessHandler(function() {
        snack('Marcado. A tarefa de anexar e enviar voltou para quem prepara.');
        if (getCurrentPage() === 'transporte-central') transpCentralCarregar(true);
      })
      .withFailureHandler(function(erro) { alvo.disabled = false; alvo.removeAttribute('data-tc-armado'); alvo.textContent = 'GRU e extrato prontos'; snackErro(erro); })
      .marcarGruExtratoProntosTransporte(partes[0], partes[1]);
  }

  function transpCentralHtmlAcompanhar(dados) {
    var a = dados.acompanhar || {};
    var peticionamento = a.peticionamento || [];
    var confirmacao = a.confirmacao || [];
    var pinex = a.pinex || [];
    if (!peticionamento.length && !confirmacao.length && !pinex.length) {
      return '<div class="tc-empty"><span class="material-symbols-outlined" aria-hidden="true">check_circle</span>Nada aguardando courier, PINEX ou peticionamento.</div>';
    }
    return transpCentralHtmlPeticionamento(peticionamento, !!dados.podePeticionar) +
      (confirmacao.length ? transpCentralHtmlSecaoAcompanhar({
        titulo: 'Aguardando confirmação da courier', icone: 'mark_email_unread', itens: confirmacao,
        dica: 'A coleta foi pedida e o app aguarda o e-mail de confirmação. Não há nada a fazer, salvo se a data chegar sem resposta.',
        acaoVisita: function(g) {
          return transpCentralBotao('neutro', 'event', 'Abrir na Agenda', 'data-tc-abrir="' + esc(g.agendaId) + '"', 'Abrir na Agenda: ' + g.participante);
        }
      }) : '') +
      (pinex.length ? transpCentralHtmlSecaoAcompanhar({
        titulo: 'Aguardando resposta da PINEX', icone: 'forward_to_inbox', itens: pinex,
        dica: 'O formulário de agendamento foi enviado. Quando a PINEX responder, cole a linha com os números.',
        // A PINEX responde por e-mail com os números no título; colar a linha continua o mesmo transporte.
        acaoTransporte: function(it) {
          return transpCentralBotao('primario', 'pin', 'Informar os números', 'data-tc-comecar="' + esc(it.agendaId) + '" data-tc-slot="' + esc(it.slot) + '"', 'Informar os números da PINEX: ' + it.participante);
        }
      }) : '');
  }

  function transpCentralDiasEnvio(dias) {
    if (dias === null || dias === undefined || !isFinite(Number(dias))) return '';
    dias = Number(dias);
    return dias <= 0 ? 'Enviada hoje' : (dias === 1 ? 'Enviada há 1 dia' : 'Enviada há ' + dias + ' dias');
  }

  // Em trânsito: uma linha por transporte, com a lupa de rastreio (só com AWB rastreável) e "Confirmar entrega"
  // lado a lado, como no cartão "AWB enviada não entregue" das Pendências.
  function transpCentralHtmlTransito(dados) {
    var itens = ((dados.acompanhar || {}).transito) || [];
    if (!itens.length) return '<div class="tc-empty"><span class="material-symbols-outlined" aria-hidden="true">check_circle</span>Nenhum transporte em trânsito.</div>';
    return transpCentralHtmlSecaoAcompanhar({
      titulo: 'Em trânsito', icone: 'local_shipping', itens: itens.map(function(it) {
        // A data é a do envio já feito: sem prazo nem "Atrasada" (mesmo se o servidor ainda mandar o rótulo).
        return Object.assign({}, it, { extraDetalhe: transpCentralDiasEnvio(it.diasDesdeEnvio), prazoLabel: '' });
      }),
      dica: 'Enviados e ainda não entregues. Confirme a entrega quando o rastreio mostrar que chegou.',
      acaoTransporte: function(it) {
        var rastreio = it.trackingUrl
          ? '<button type="button" class="icon-btn tc-rastreio" data-tc-rastreio="' + esc(it.trackingUrl) + '" title="Abrir rastreio" aria-label="Abrir rastreio de ' + esc(it.participante) + '"><span class="material-symbols-outlined" aria-hidden="true">travel_explore</span></button>'
          : '';
        return rastreio + transpCentralBotao('verde tc-entrega', 'task_alt', 'Confirmar entrega', 'data-tc-entrega="' + esc(it.agendaId) + '|' + esc(it.slotRotulo) + '"', 'Confirmar entrega de ' + it.participante);
      }
    });
  }

  var TC_DIAS_SEMANA = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  var TC_MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];

  // Bloco de data em destaque: dia grande, mês e dia da semana. Sem data numérica, mostra o texto da Agenda.
  function transpCentralHtmlDataDestaque(dataOrdem, texto, hora) {
    var d = typeof dataOrdem === 'number' && isFinite(dataOrdem) ? new Date(dataOrdem) : null;
    if (!d || isNaN(d.getTime())) {
      return '<span class="tc-data-bloco tc-data-texto"><strong>' + esc(texto || '') + '</strong>' + (hora ? '<span>' + esc(hora) + '</span>' : '') + '</span>';
    }
    return '<span class="tc-data-bloco" aria-label="' + esc(texto || '') + (hora ? ' ' + esc(hora) : '') + '">' +
      '<span class="tc-data-dia" aria-hidden="true">' + ('0' + d.getDate()).slice(-2) + '</span>' +
      '<span class="tc-data-resto" aria-hidden="true"><span>' + TC_MESES[d.getMonth()] + ' · ' + TC_DIAS_SEMANA[d.getDay()] + '</span>' +
      (hora ? '<span class="tc-data-hora">' + esc(hora) + '</span>' : '') + '</span></span>';
  }

  // Em breve: semanas em acordeão (uma aberta por vez, a primeira ao carregar), uma linha por visita com a data
  // do envio em destaque e quando vira tarefa à direita. Só consulta.
  function transpCentralHtmlAdiante(dados) {
    var semanas = (dados.maisAdiante && dados.maisAdiante.semanas) || [];
    if (!semanas.length) return '<div class="tc-empty"><span class="material-symbols-outlined" aria-hidden="true">check_circle</span>Nenhum transporte em breve.</div>';
    var aberta = TRANSP_CENTRAL_STATE.semanaAberta;
    if (!semanas.some(function(s) { return s.chave === aberta; })) aberta = semanas[0].chave;
    TRANSP_CENTRAL_STATE.semanaAberta = aberta;
    var cabecalho = transpCentralHtmlCabecalho('Em breve', 'event_upcoming', (dados.maisAdiante && dados.maisAdiante.transportes) || 0,
      'Transportes que viram tarefa ' + esc(dados.janelaDiasUteis || 7) + ' dias úteis antes do envio. Não precisa fazer nada por eles agora.');
    var vira = function(g) {
      return '<span class="tc-vira"><span class="material-symbols-outlined" aria-hidden="true">event_upcoming</span><span>Vira tarefa em<strong>' + esc(g.viraTarefaEm || '') + '</strong></span></span>';
    };
    return cabecalho + '<div class="tc-acordeao">' + semanas.map(function(s, n) {
      var aberto = s.chave === aberta;
      var grupos = transpCentralAgruparVisitas(s.itens);
      var resumo = (s.itens.length === 1 ? '1 transporte' : s.itens.length + ' transportes') + ' · ' + (grupos.length === 1 ? '1 visita' : grupos.length + ' visitas');
      return '<section class="tc-semana"><h3><button type="button" class="tc-semana-cab" id="tcSemanaBtn' + n + '" aria-expanded="' + (aberto ? 'true' : 'false') + '" aria-controls="tcSemana' + n + '" data-tc-semana="' + esc(s.chave) + '">' +
        '<span class="tc-semana-tit"><span class="material-symbols-outlined" aria-hidden="true">' + (aberto ? 'expand_more' : 'chevron_right') + '</span>' + esc(s.rotulo) + '</span>' +
        '<span class="tc-semana-resumo">' + esc(resumo) + '</span></button></h3>' +
        '<div class="tc-tabela tc-breve" id="tcSemana' + n + '" role="region" aria-labelledby="tcSemanaBtn' + n + '"' + (aberto ? '' : ' hidden') + '>' +
        transpCentralHtmlThead('tc-grade-acao', ['Envio', 'Participante', 'Transportes', 'Vira tarefa']) +
        grupos.map(function(g) { return transpCentralHtmlLinhaVisita(g, null, null, vira).replace('class="tc-acomp ', 'class="tc-acomp tc-breve-linha '); }).join('') + '</div></section>';
    }).join('') + '</div>';
  }

  function transpCentralHtmlBackups(dados) {
    var itens = dados.backups || [];
    if (!itens.length) return '<div class="tc-empty"><span class="material-symbols-outlined" aria-hidden="true">check_circle</span>Nenhum Backup sem agendamento.</div>';
    // Mesmo padrão de Acompanhar: data da visita de origem em destaque, Backup e Backup II da mesma visita juntos.
    return transpCentralHtmlSecaoAcompanhar({
      titulo: 'Backups aguardando agendamento', icone: 'inventory_2', itens: itens,
      dica: 'Abra o agendamento para criar um novo Envio de Amostras ou usar um agendamento futuro. Depois disso, o backup sai desta lista.',
      acaoVisita: function(g) {
        return transpCentralBotao('neutro', 'event', 'Abrir agendamento', 'data-tc-abrir="' + esc(g.agendaId) + '"', 'Abrir agendamento: ' + g.participante);
      }
    });
  }

  function transpCentralContagem(aba, total) {
    var botao = document.querySelector('.tc-tab[data-tc-tab="' + aba + '"]');
    if (!botao) return;
    var rotulo = { acompanhar: 'Acompanhar', transito: 'Em trânsito', adiante: 'Em breve', backups: 'Backups não agendados' }[aba];
    botao.textContent = rotulo + (total ? ' (' + total + ')' : '');
  }

  function transpCentralRender(dados) {
    dados = dados || {};
    var alvo = document.getElementById('tcFazer');
    if (!alvo) return;
    alvo.innerHTML = transpCentralHtmlFazer(dados);
    alvo.setAttribute('aria-busy', 'false');
    var secoes = { tcAcompanhar: transpCentralHtmlAcompanhar, tcTransito: transpCentralHtmlTransito, tcAdiante: transpCentralHtmlAdiante, tcBackups: transpCentralHtmlBackups };
    Object.keys(secoes).forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.innerHTML = secoes[id](dados);
    });
    var a = dados.acompanhar || {};
    transpCentralContagem('acompanhar', (a.peticionamento || []).length + (a.confirmacao || []).length + (a.pinex || []).length);
    transpCentralContagem('transito', (a.transito || []).length);
    transpCentralContagem('adiante', (dados.maisAdiante && dados.maisAdiante.transportes) || 0);
    transpCentralContagem('backups', (dados.backups || []).length);
  }

  // Depois de confirmar uma entrega pelo modal das Pendências, relê a lista.
  function transpCentralAposEntrega() {
    if (getCurrentPage() === 'transporte-central') transpCentralCarregar(true);
  }

  function transpCentralCarregar(forcar) {
    var alvo = document.getElementById('tcFazer');
    var status = document.getElementById('tcStatus');
    if (!alvo || !CURRENT_ACCESS.ok) return;
    if (!CodexAccessRules.isModuleVisible(CURRENT_ACCESS, 'transporte-central')) return;
    var requestId = ++TRANSP_CENTRAL_REQUEST_ID;
    var email = CURRENT_ACCESS.email;
    if (!TRANSP_CENTRAL_STATE.dados || forcar) alvo.setAttribute('aria-busy', 'true');
    if (status) status.textContent = 'Carregando tarefas…';
    // Resposta fora de ordem, outra conta ou outra tela não sobrescrevem o que está na tela.
    function atual() {
      return requestId === TRANSP_CENTRAL_REQUEST_ID && email === CURRENT_ACCESS.email && getCurrentPage() === 'transporte-central';
    }
    google.script.run
      .withSuccessHandler(function(resposta) {
        if (!atual()) return;
        if (!resposta || resposta.ok !== true || !Array.isArray(resposta.tarefas)) {
          alvo.setAttribute('aria-busy', 'false');
          alvo.innerHTML = '<div class="tc-empty">Não foi possível ler as tarefas. Atualize para tentar novamente.</div>';
          return;
        }
        TRANSP_CENTRAL_STATE.dados = resposta;
        transpCentralRender(resposta);
        if (status) status.textContent = resposta.tarefas.length + ' tarefa(s) para fazer.';
      })
      .withFailureHandler(function(erro) {
        if (!atual()) return;
        alvo.setAttribute('aria-busy', 'false');
        // Mantém a lista anterior, se houver, e avisa que está desatualizada.
        if (!TRANSP_CENTRAL_STATE.dados) alvo.innerHTML = '<div class="tc-empty">' + esc(appErrorMessage(erro)) + '</div>';
        snackErro(erro);
      })
      .getTransporteTarefas({});
  }

  function carregarTransporteCentral() {
    // Voltando da Agenda ("Corrigir") com um envio aberto: relê os dados corrigidos, preservando o que a pessoa preencheu.
    if (typeof TC_ENVIO !== 'undefined' && TC_ENVIO.aberto && TC_ENVIO.agendaId && TC_ENVIO.passo !== 'fim' && !TC_ENVIO.gerando) {
      transpCentralAbrirEnvio(TC_ENVIO.agendaId, TC_ENVIO.slot);
      return;
    }
    transpCentralAba(TRANSP_CENTRAL_STATE.aba);
    transpCentralCarregar(false);
  }

  document.addEventListener('click', function(event) {
    var alvo = event.target && event.target.closest ? event.target.closest('#page-transporte-central [data-tc-abrir], #page-transporte-central [data-tc-ir], #page-transporte-central [data-tc-comecar], #page-transporte-central [data-tc-semana], #page-transporte-central [data-tc-rastreio], #page-transporte-central [data-tc-entrega], #page-transporte-central [data-tc-gru]') : null;
    if (!alvo) return;
    if (alvo.hasAttribute('data-tc-gru')) { transpCentralMarcarGru(alvo); return; }
    if (alvo.hasAttribute('data-tc-semana')) {
      TRANSP_CENTRAL_STATE.semanaAberta = alvo.getAttribute('data-tc-semana');
      var el = document.getElementById('tcAdiante');
      if (el && TRANSP_CENTRAL_STATE.dados) el.innerHTML = transpCentralHtmlAdiante(TRANSP_CENTRAL_STATE.dados);
      return;
    }
    if (alvo.hasAttribute('data-tc-rastreio')) { abrirPendenciaTracking(event, alvo.getAttribute('data-tc-rastreio')); return; }
    if (alvo.hasAttribute('data-tc-entrega')) {
      var partes = alvo.getAttribute('data-tc-entrega').split('|');
      var item = (((TRANSP_CENTRAL_STATE.dados || {}).acompanhar || {}).transito || []).filter(function(t) { return t.agendaId === partes[0] && t.slotRotulo === partes[1]; })[0];
      if (!item) { snackErro('Transporte não encontrado.'); return; }
      confirmarEntregaPendencia(event, item.agendaId, item.slotRotulo, item.awb, item.participante, item.courier, item.temperatura, item.data, item.hora, item.projeto, item.visita);
      return;
    }
    if (alvo.hasAttribute('data-tc-comecar')) { transpCentralComecar(alvo.getAttribute('data-tc-comecar'), alvo.getAttribute('data-tc-slot') || ''); return; }
    if (alvo.hasAttribute('data-tc-ir')) { transpCentralAba(alvo.getAttribute('data-tc-ir')); return; }
    abrirPendenciaAgendaRegistro(alvo.getAttribute('data-tc-abrir'));
  });
</script>
