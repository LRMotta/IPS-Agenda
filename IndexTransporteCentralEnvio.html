<script>
  // Transporte (tela nova): passo a passo de um envio. Prefixo transpCentral*, sem globais genéricos.
  var TC_ENVIO = { aberto: false, agendaId: '', slot: '', dados: null, passo: '', seq: 0, token: '', gerando: false, resultado: null, awbUltima: null, pinex: null, salvando: false, matEdit: null, ajuste: null, anvisa: null, aguardaPeticionamento: false };
  var TC_MATERIAIS_TIPOS = ['Sangue', 'Soro', 'Urina', 'Plasma', 'Tecido', 'Saliva', 'Fezes', 'Vacina'];
  var TC_OCASA_AWB_URL = 'https://pobdigital.ocasa.com/mylifescience?adr=O4vrY2ctp5sQxN5ltV0mRDy%2BhN74hwW%2Byc9Zb86RS5TAkbB07Bl3nuQ1p0diufmyRcBqCA9TzUwvuIZ%2BiQ7X5yYl48m%2FfVzTdyqvZ5mU6ld%2FCD9s99t43dlN%2Bo59mYnUKSylrPlmYJQfgcT52%2BT2VkkaoJVFpJ3hLyZW%2F9pA5wrEk%2BDTDH0tnt5nRa3%2BXGSo';
  var TC_PASSOS_ROTULO ={ conferir: 'Conferir', awb: 'AWB', pinex_numeros: 'Números da PINEX', gerar: 'Gerar', anvisa: 'Formulário ANVISA', enviar: 'Enviar' };

  function transpCentralTokenNovo() {
    var bytes = new Uint8Array(16);
    (window.crypto || window.msCrypto).getRandomValues(bytes);
    return Array.prototype.map.call(bytes, function(b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  }

  // O token de geração mora no registro do envio, no servidor: outro navegador ou computador retoma a mesma
  // geração sem duplicar PDF ou rascunho. O token da tela só serve à primeira tentativa de um envio.

  function transpCentralEnvioAtual(seq) {
    return TC_ENVIO.aberto && TC_ENVIO.seq === seq && getCurrentPage() === 'transporte-central';
  }

  // O preparo expira no servidor em 15 minutos sem sinal. Enquanto a pessoa mexe na tela, um sinal a cada 4 minutos
  // o mantém; sem atividade por 10 minutos os sinais param, para uma aba esquecida não prender o transporte.
  var TC_PREPARO_SINAL_MS = 4 * 60 * 1000;
  var TC_PREPARO_ATIVIDADE_MS = 10 * 60 * 1000;
  var TC_PREPARO_ATIVIDADE = 0;

  function transpCentralPreparoAtividade() { TC_PREPARO_ATIVIDADE = Date.now(); }

  // forcar: retoma o preparo logo depois de o servidor avisar que ele expirou.
  function transpCentralRenovarPreparo(forcar) {
    if (!TC_ENVIO.aberto || !TC_ENVIO.dados || TC_ENVIO.passo === 'fim' || getCurrentPage() !== 'transporte-central') return;
    if (!forcar && Date.now() - TC_PREPARO_ATIVIDADE > TC_PREPARO_ATIVIDADE_MS) return;
    var seq = TC_ENVIO.seq;
    google.script.run
      .withSuccessHandler(function(resposta) {
        if (!transpCentralEnvioAtual(seq) || !resposta || resposta.ok !== false) return;
        // Outra pessoa assumiu enquanto a tela ficou parada: fecha sem gravar por cima.
        snack(resposta.mensagem || 'Este transporte está sendo preparado por outra pessoa.');
        TC_ENVIO.aberto = false;
        appClearUnsavedChanges('tcWizard');
        transpCentralMostrarWizard(false);
        transpCentralCarregar(true);
      })
      .withFailureHandler(function() { /* o próximo sinal tenta de novo */ })
      .renovarPreparoTransporteEnvio(TC_ENVIO.agendaId, TC_ENVIO.slot);
  }

  document.addEventListener('pointerdown', transpCentralPreparoAtividade, true);
  document.addEventListener('keydown', transpCentralPreparoAtividade, true);
  setInterval(function() { transpCentralRenovarPreparo(false); }, TC_PREPARO_SINAL_MS);

  function transpCentralMostrarWizard(mostrar) {
    var wizard = document.getElementById('tcWizard');
    var abas = document.getElementById('tcTabs');
    var paineis = document.querySelectorAll('#page-transporte-central .tc-panel');
    if (wizard) wizard.hidden = !mostrar;
    if (abas) abas.hidden = !!mostrar;
    // "Atualizar tarefas" é da lista: no passo a passo ficava por cima do indicador "Passo N de M".
    var atualizar = document.getElementById('tcRefresh');
    if (atualizar) atualizar.hidden = !!mostrar;
    Array.prototype.forEach.call(paineis, function(p) { p.hidden = !!mostrar || p.id !== 'tcPanel' + TRANSP_CENTRAL_STATE.aba.charAt(0).toUpperCase() + TRANSP_CENTRAL_STATE.aba.slice(1); });
  }

  // Transportes concluídos nesta tela, por visita: a lista de tarefas só é relida ao voltar para ela, então sem
  // este registro uma visita com 3 transportes voltaria ao I depois do II.
  var TC_FEITOS = {};

  function transpCentralMarcarFeito(agendaId, slot) {
    if (agendaId && slot) TC_FEITOS[agendaId + '|' + slot] = true;
  }

  // Próximo transporte da visita que ainda falta: primeiro os que vêm depois do atual, na ordem; depois os anteriores.
  function transpCentralProximoTransporte(tarefa, slotAtual) {
    var lista = (tarefa && tarefa.transportes) || [];
    var agendaId = tarefa && tarefa.agendaId;
    var i = lista.map(function(t) { return t.slot; }).indexOf(slotAtual);
    var ordem = i >= 0 ? lista.slice(i + 1).concat(lista.slice(0, i)) : lista;
    return ordem.filter(function(t) { return t.slot !== slotAtual && !TC_FEITOS[agendaId + '|' + t.slot]; })[0] || null;
  }

  function transpCentralTarefa(agendaId) {
    var tarefas = (TRANSP_CENTRAL_STATE.dados && TRANSP_CENTRAL_STATE.dados.tarefas) || [];
    return tarefas.filter(function(t) { return t.agendaId === agendaId; })[0] || null;
  }

  function transpCentralComecar(agendaId, slot) {
    var tarefa = transpCentralTarefa(agendaId);
    if (!slot) slot = tarefa && tarefa.transportes && tarefa.transportes[0] ? tarefa.transportes[0].slot : '';
    if (!agendaId || !slot) { snackErro('Transporte da tarefa não encontrado.'); return; }
    transpCentralAbrirEnvio(agendaId, slot);
  }

  function transpCentralAbrirEnvio(agendaId, slot) {
    var seq = ++TC_ENVIO.seq;
    TC_ENVIO.aberto = true; TC_ENVIO.agendaId = agendaId; TC_ENVIO.slot = slot; TC_ENVIO.dados = null;
    TC_ENVIO.resultado = null; TC_ENVIO.awbUltima = null; TC_ENVIO.pinex = null; TC_ENVIO.pinexSalvando = false; TC_ENVIO.gerando = false; TC_ENVIO.matEdit = null; TC_ENVIO.ajuste = null; TC_ENVIO.aguardaPinex = false; TC_ENVIO.anvisa = null; TC_ENVIO.aguardaPeticionamento = false; TC_ENVIO.awbAviso = null; TC_ENVIO.awbConsultando = false; TC_ENVIO.checks = {};
    transpCentralMostrarWizard(true);
    transpCentralRenderWizard('<div class="tc-empty">Abrindo o transporte…</div>');
    google.script.run
      .withSuccessHandler(function(resposta) {
        if (!transpCentralEnvioAtual(seq)) return;
        if (!resposta || resposta.ok !== true) {
          snack((resposta && resposta.mensagem) || 'Não foi possível abrir este transporte.');
          TC_ENVIO.aberto = false;
          transpCentralMostrarWizard(false);
          transpCentralCarregar(true);
          return;
        }
        TC_ENVIO.dados = resposta;
        var passos = resposta.passos || [];
        TC_ENVIO.passo = passos.indexOf(resposta.passo) >= 0 ? resposta.passo : (resposta.passo === 'concluido' ? 'enviar' : passos[0]);
        TC_ENVIO.token = transpCentralTokenNovo();
        if (resposta.dadosAtualizados) snack('Os dados deste transporte mudaram na Agenda. Confira de novo antes de gerar os documentos.');
        transpCentralRenderPasso();
      })
      .withFailureHandler(function(erro) {
        if (!transpCentralEnvioAtual(seq)) return;
        TC_ENVIO.aberto = false;
        transpCentralMostrarWizard(false);
        snackErro(erro);
      })
      .getTransporteEnvio(agendaId, slot);
  }

  function transpCentralRenderWizard(html) {
    var alvo = document.getElementById('tcWizard');
    if (alvo) { alvo.innerHTML = html; alvo.setAttribute('aria-busy', 'false'); }
  }

  function transpCentralDataBr(valor) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(valor || ''));
    return m ? m[3] + '/' + m[2] + '/' + m[1] : String(valor || '');
  }

  function transpCentralLinha(rotulo, valor) {
    return '<div class="tc-row"><dt>' + esc(rotulo) + '</dt><dd>' + (String(valor || '').trim() ? esc(valor) : '<span class="tc-dim">—</span>') + '</dd></div>';
  }

  function transpCentralMateriaisAtivos(registro) {
    return ((registro && registro.materiais) || []).filter(function(m) { return m && m.ativo && m.material; });
  }

  function transpCentralPainelLateral(registro, tarefa) {
    var rotulo = tarefa ? (tarefa.transportes.filter(function(t) { return t.slot === TC_ENVIO.slot; })[0] || {}).slotRotulo : '';
    return '<aside class="tc-wiz-side" aria-label="Este envio"><h3>Este envio</h3><dl class="tc-dl">' +
      transpCentralLinha('Participante', registro.paciente) + transpCentralLinha('Estudo', registro.protocolo) +
      transpCentralLinha('Visita', tarefa && tarefa.visita) + transpCentralLinha('Courier', [registro.courier, registro.temperatura].filter(Boolean).join(' / ')) +
      transpCentralLinha('Tipo', rotulo) + transpCentralLinha('Data', transpCentralDataBr(registro.dataEnvio)) + transpCentralLinha('Destino', registro.destino) +
      // A AWB digitada no passo AWB fica à vista até o fim, para ser conferida antes de gerar.
      transpCentralLinha('AWB', registro.awb) +
      '</dl></aside>';
  }

  // Trilha dos passos: feitos, o atual e os que faltam. O texto "Passo N de M" continua para leitores de tela
  // e para telas estreitas, onde a trilha mostra só o nome do passo atual.
  function transpCentralBarra(passos, passo) {
    var indice = Math.max(0, passos.indexOf(passo));
    var trilha = '<ol class="tc-trilha" aria-label="Passos deste envio">' + passos.map(function(p, n) {
      var estado = n < indice ? 'feito' : (n === indice ? 'atual' : 'depois');
      return '<li class="tc-trilha-item tc-trilha-' + estado + '"' + (estado === 'atual' ? ' aria-current="step"' : '') + '>' +
        '<span class="tc-trilha-num" aria-hidden="true">' + (estado === 'feito' ? '✓' : (n + 1)) + '</span>' +
        '<span class="tc-trilha-nome">' + esc(TC_PASSOS_ROTULO[p] || p) + (estado === 'feito' ? '<span class="sr-only"> (feito)</span>' : '') + '</span></li>';
    }).join('') + '</ol>';
    return '<div class="tc-wiz-top"><button type="button" class="tc-link" data-tc-act="sair">Sair e continuar depois</button>' +
      '<span class="tc-wiz-progress" role="status">Passo ' + (indice + 1) + ' de ' + passos.length + ' · ' + esc(TC_PASSOS_ROTULO[passo] || passo) + '</span></div>' + trilha;
  }

  // Uma linha com quem e o quê. completo: também courier, data, destino e AWB (o que o painel lateral mostra);
  // serve às telas estreitas, onde o painel não aparece. No Conferir e no fim, esses dados já estão no conteúdo.
  function transpCentralResumo(registro, tarefa, completo) {
    var rotulo = tarefa ? (tarefa.transportes.filter(function(t) { return t.slot === TC_ENVIO.slot; })[0] || {}).slotRotulo : '';
    var quem = [registro.protocolo, tarefa && tarefa.visita, rotulo].filter(Boolean).join(' · ');
    var envio = completo ? [[registro.courier, registro.temperatura].filter(Boolean).join(' / '), transpCentralDataBr(registro.dataEnvio), registro.destino,
      registro.awb ? 'AWB ' + registro.awb : ''].filter(Boolean).join(' · ') : '';
    return '<div class="tc-wiz-resumo' + (completo ? ' tc-wiz-resumo-estreito' : '') + '"><strong>' + esc(registro.paciente || '') + '</strong>' +
      (quem ? '<span>' + esc(quem) + '</span>' : '') + (envio ? '<span class="tc-dim">' + esc(envio) + '</span>' : '') + '</div>';
  }

  function transpCentralCampo(id, rotulo, valor, extra) {
    return '<div class="field"><label class="field-label" for="' + id + '">' + esc(rotulo) + '</label>' +
      '<input id="' + id + '" class="f-input" type="text" value="' + esc(valor || '') + '" data-tc-campo="' + esc(id.replace('tcCampo_', '')) + '" ' + (extra || '') + '></div>';
  }

  function transpCentralFormulaDoMaterial(m) {
    if (m.formula) return String(m.formula);
    var tubos = Number(m.tubos), total = Number(String(m.total).replace(',', '.'));
    return tubos > 0 && total > 0 ? tubos + 'x' + String(Math.round(total / tubos * 1000) / 1000).replace('.', ',') : '';
  }

  function transpCentralMateriaisIniciais(registro) {
    return transpCentralMateriaisAtivos(registro).map(function(m) {
      return { material: m.material, formula: transpCentralFormulaDoMaterial(m), ensaio: m.ensaio || '' };
    });
  }

  function transpCentralHtmlEditorMateriais() {
    var linhas = TC_ENVIO.matEdit.map(function(m, i) {
      return '<div class="tc-mat-linha"><div class="field"><label class="field-label" for="tcMatTipo' + i + '">Material</label>' +
        '<select id="tcMatTipo' + i + '" class="f-input f-select" data-tc-mat="' + i + '" data-tc-mat-campo="material">' +
        // Material fora da lista aparece como está (o seletor não troca para o primeiro item sem a pessoa ver).
        (TC_MATERIAIS_TIPOS.indexOf(m.material) < 0 && m.material ? [m.material] : []).concat(TC_MATERIAIS_TIPOS).map(function(t) { return '<option' + (t === m.material ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') + '</select></div>' +
        '<div class="field"><label class="field-label" for="tcMatFormula' + i + '">Tubos × volume</label>' +
        '<input id="tcMatFormula' + i + '" class="f-input" type="text" placeholder="2x1,5" value="' + esc(m.formula) + '" data-tc-mat="' + i + '" data-tc-mat-campo="formula" autocomplete="off"></div>' +
        '<div class="field"><label class="field-label" for="tcMatEnsaio' + i + '">Ensaio</label>' +
        '<input id="tcMatEnsaio' + i + '" class="f-input" type="text" value="' + esc(m.ensaio) + '" data-tc-mat="' + i + '" data-tc-mat-campo="ensaio" autocomplete="off"></div>' +
        '<button type="button" class="tc-link" data-tc-act="materiais-remover" data-tc-mat-i="' + i + '">Remover</button></div>';
    }).join('');
    return '<p class="tc-dim">A alteração grava na Agenda, com registro de quem alterou e do valor anterior.</p>' + linhas +
      '<div class="tc-actions"><button type="button" class="tc-link" data-tc-act="materiais-adicionar">Adicionar material</button>' +
      '<button type="button" class="btn-new" data-tc-act="materiais-salvar">Salvar materiais</button>' +
      '<button type="button" class="tc-link" data-tc-act="materiais-cancelar">Cancelar</button></div>';
  }

  function transpCentralHtmlConferir(registro) {
    var materiais = transpCentralMateriaisAtivos(registro);
    var pinexAg = registro.courier === 'PINEX (Agendamento)';
    // Nome e prazo como no Para fazer (TRANSPORTE_CAIXA_PRAZO_DIAS_UTEIS_): só Crēdo Cube e Extreme Ambient têm prazo.
    var tipoCaixa = registro.caixaTransporte && registro.caixaTransporte.tipoCaixa;
    var nomeCaixa = { BIOSYSTEM: 'BioSystem', SEPIO: 'Sepio', CREDO_CUBE: 'Crēdo Cube', EXTREME_AMBIENT: 'Extreme Ambient' }[tipoCaixa] || '';
    var prazoCaixa = { CREDO_CUBE: 2, EXTREME_AMBIENT: 3 }[tipoCaixa];
    var caixa = nomeCaixa ? '<p class="tc-aviso" role="note">Caixa especial: ' + esc(nomeCaixa) + '. Confira se ela está disponível' +
      (prazoCaixa ? ' e peça à courier com ' + prazoCaixa + ' dias úteis de antecedência' : '') + '.</p>' : '';
    var avisos = ((TC_ENVIO.dados && TC_ENVIO.dados.avisos) || []).map(function(a) { return '<p class="tc-aviso" role="note">' + esc(a) + '</p>'; }).join('');
    // Avisos primeiro; depois duas colunas: o que veio da Agenda (um só "Corrigir") e o que a pessoa confere e preenche.
    return caixa + avisos + '<div class="tc-conferir"><section class="tc-bloco"><div class="tc-bloco-cab"><h3>Transporte</h3><button type="button" class="tc-link" data-tc-act="corrigir">Corrigir na Agenda</button></div><dl class="tc-dl">' +
        transpCentralLinha('Courier', registro.courier) + transpCentralLinha('Temperatura', registro.temperatura) +
        transpCentralLinha('Data do envio', transpCentralDataBr(registro.dataEnvio)) +
        transpCentralLinha('Coleta', transpCentralDataBr(registro.dataColeta)) + transpCentralLinha('AWB', registro.awb) + '</dl>' +
        '<h3 class="tc-bloco-sub">Destino</h3><dl class="tc-dl">' + transpCentralLinha('Laboratório', registro.destino) + '</dl></section>' +
      '<div class="tc-conferir-col"><section class="tc-bloco"><div class="tc-bloco-cab"><h3>Materiais</h3>' + (TC_ENVIO.matEdit ? '' : '<button type="button" class="tc-link" data-tc-act="materiais-editar">Editar</button>') + '</div>' +
        (TC_ENVIO.matEdit ? transpCentralHtmlEditorMateriais() : (materiais.length ? '<ul class="tc-materiais">' + materiais.map(function(m) {
          return '<li>' + esc(m.material) + (m.tubos ? ' · ' + esc(m.tubos) + ' tubo(s)' : '') + (m.total !== '' && m.total !== undefined ? ' · ' + esc(m.total) + ' ' + esc(m.unit || 'mL') : '') + '</li>';
        }).join('') + '</ul><p class="tc-dim">Informados pelo laboratório.</p>' : '<p class="tc-dim">Nenhum material marcado.</p>') +
          (TC_ENVIO.ajuste ? '<p class="tc-aviso" role="note">Material ajustado na preparação do transporte. Valor anterior: ' + esc(TC_ENVIO.ajuste.anterior || '') + '.</p>' : '')) + '</section>' +
      '<section class="tc-bloco"><h3>Para o pedido de coleta</h3><div class="tc-campos">' +
        transpCentralCampo('tcCampo_agendadoPor', 'Agendado por', registro.agendadoPor, 'required') +
        transpCentralCampo('tcCampo_horaEnvio', 'Janela de envio', registro.horaEnvio, 'required') +
        (pinexAg ? transpCentralCampo('tcCampo_responsavelEntrega', 'Quem entrega as amostras', registro.responsavelEntrega, 'required') : '') +
      '</div></section></div></div>' +
      '<div class="tc-actions"><button type="button" class="btn-new" data-tc-act="conferido"><span class="material-symbols-outlined" aria-hidden="true">check</span>Sim, está tudo certo</button></div>';
  }

  // AWB de pacote recebido no início do estudo: MARKEN, e DHL só no Ambiente.
  function transpCentralAwbDePacote(registro) {
    var courier = String((registro && registro.courier) || '');
    if (/marken/i.test(courier)) return true;
    return /dhl/i.test(courier) && /^\s*ambiente\s*$/i.test(String((registro && registro.temperatura) || ''));
  }

  function transpCentralHtmlAwb(registro) {
    var courier = String(registro.courier || '');
    var ultima = TC_ENVIO.awbUltima && TC_ENVIO.awbUltima.awb ? '<p class="tc-dica">Última AWB usada neste estudo: <strong>' + esc(TC_ENVIO.awbUltima.awb) + '</strong>. A próxima do pacote recebido costuma ser a seguinte.</p>' : '';
    var texto = courier === 'OCASA' ? 'A AWB da OCASA é gerada no site da OCASA, pela guia modelo. “Gerar Pedido” já solicita a retirada; cancelar só por csbio@ocasa.com. Cole a AWB aqui.'
      : (transpCentralAwbDePacote(registro) ? 'A AWB vem do pacote recebido no início do estudo, específico para este estudo.' : 'Informe a AWB deste transporte.');
    // AWB já usada em outro envio: avisa aqui, antes de gravar; a pessoa corrige ou confirma que é esta mesma.
    var aviso = TC_ENVIO.awbAviso;
    var usada = aviso && aviso.text ? '<p class="tc-aviso" role="alert">' + esc(aviso.text) + ' Confira o número. Se for este mesmo, clique de novo para continuar.</p>' : '';
    // Site da OCASA para gerar a AWB: o endereço fica atrás do texto do link, sem aparecer na tela.
    var siteOcasa = courier === 'OCASA' ? '<p><a class="tc-link-externo" href="' + esc(TC_OCASA_AWB_URL) + '" target="_blank" rel="noopener noreferrer">Clique aqui para gerar a AWB no site da OCASA</a> (abre em outra aba).</p>' : '';
    return '<section class="tc-bloco"><h3>AWB</h3><p>' + esc(texto) + '</p>' + siteOcasa + ultima +
      '<div class="tc-campos">' + transpCentralCampo('tcCampo_awb', 'AWB', aviso && aviso.digitada ? aviso.digitada : registro.awb, 'required autocomplete="off"') + '</div>' + usada + '</section>' +
      '<div class="tc-actions"><button type="button" class="btn-new" data-tc-act="awb-ok">' + (usada ? 'Usar esta AWB e continuar' : 'Salvar AWB e continuar') + '</button></div>';
  }

  // Só o número que falta: o nº da coleta da PINEX, e o Frete (AWB) apenas se o envio ainda não tem AWB.
  // Sem data-tc-campo: estes campos gravam pelo botão, não pelo salvamento automático do Conferir.
  function transpCentralHtmlPinexNumeros(registro) {
    var leitura = TC_ENVIO.pinex || {};
    var pedirAwb = !String(registro.awb || '').trim() || leitura.pedirAwb;
    function campo(id, rotulo, valor) {
      return '<div class="field"><label class="field-label" for="' + id + '">' + esc(rotulo) + '</label>' +
        '<input id="' + id + '" class="f-input" type="text" inputmode="numeric" autocomplete="off" required value="' + esc(valor || '') + '"></div>';
    }
    var erro = leitura.mensagem ? '<p class="tc-aviso" role="alert">' + esc(leitura.mensagem) + '</p>' : '';
    return '<section class="tc-bloco"><h3>Número da coleta da PINEX</h3><p>Informe o número da coleta que a PINEX enviou na confirmação do agendamento' +
      (pedirAwb ? ' e o número do Frete, que é a AWB.' : '.') + '</p>' +
      '<div class="tc-campos">' + campo('tcPinexColeta', 'Nº da coleta (PINEX COL. Nº)', leitura.coleta) +
      (pedirAwb ? campo('tcPinexAwb', 'Frete (AWB)', leitura.awb) : '') + '</div>' + erro + '</section>' +
      '<div class="tc-actions"><button type="button" class="btn-new" data-tc-act="pinex-ok"' + (TC_ENVIO.pinexSalvando ? ' disabled' : '') + '>' +
      (TC_ENVIO.pinexSalvando ? 'Salvando…' : 'Salvar e continuar') + '</button></div>';
  }

  function transpCentralHtmlGerar(registro) {
    var r = TC_ENVIO.resultado;
    if (TC_ENVIO.gerando) return '<section class="tc-bloco" aria-busy="true"><h3>Gerando os documentos</h3><p>Pode levar alguns instantes. Se sair agora, ao voltar você retoma deste ponto sem duplicar nada.</p></section>';
    if (!r) {
      return '<section class="tc-bloco"><h3>Gerar os documentos</h3><p>Vamos gerar o PDF do transporte de ' + esc(registro.courier) + ' e preparar o rascunho do e-mail para a courier.</p></section>' +
        '<div class="tc-actions"><button type="button" class="btn-new" data-tc-act="gerar"><span class="material-symbols-outlined" aria-hidden="true">description</span>Gerar documentos</button></div>';
    }
    if (r.erro) {
      return '<section class="tc-bloco"><h3>Não foi possível gerar</h3><p class="tc-aviso" role="alert">' + esc(r.erro) + '</p></section>' +
        '<div class="tc-actions"><button type="button" class="btn-new" data-tc-act="gerar">Tentar de novo</button></div>';
    }
    var rascunho = r.draftSkipped ? '<li>Rascunho de e-mail: não é criado para esta courier. ' + esc(r.draftMessage || '') + '</li>'
      : (r.draftOk ? '<li>Rascunho de e-mail criado no Gmail.</li>' : '<li class="tc-aviso">Rascunho de e-mail não criado: ' + esc(r.draftError || 'erro desconhecido') + '</li>');
    var ce = r.ce && r.ce.found ? '<li>Comunicado Especial localizado: ' + esc(r.ce.name || '') + '.</li>' : '<li class="tc-aviso">Comunicado Especial não localizado para este estudo.</li>';
    // Envio internacional: a petição de fiscalização fica no Drive, junto do PDF, e vai no rascunho da courier.
    if (r.peticaoFileId) ce += '<li>Petição de fiscalização: ' + transpCentralLinkDrive(r.peticaoFileId, r.peticaoFileName || 'abrir') + (r.draftPeticao === 'sim' ? ' (anexada ao rascunho)' : '') + '.</li>';
    if (r.peticaoWarning) ce += '<li class="tc-aviso">' + esc(r.peticaoWarning) + '</li>';
    return '<section class="tc-bloco"><h3>Documentos gerados</h3><ul class="tc-materiais">' +
      '<li>PDF: <a href="' + esc(r.fileUrl || '#') + '" target="_blank" rel="noopener">' + esc(r.fileName || 'abrir') + '</a></li>' + rascunho + ce + '</ul>' +
      (r.agendaWarning ? '<p class="tc-aviso" role="note">' + esc(r.agendaWarning) + '</p>' : '') + (r.monitorWarning ? '<p class="tc-aviso" role="note">' + esc(r.monitorWarning) + '</p>' : '') + '</section>' +
      '<div class="tc-actions">' + (r.draftOk || r.draftSkipped ? '' : '<button type="button" class="btn-new" data-tc-act="gerar">Tentar de novo</button>') +
      '<button type="button" class="btn-new" data-tc-act="gerado-ok">Continuar</button></div>';
  }

  function transpCentralHtmlAnvisa() {
    var a = TC_ENVIO.anvisa;
    if (!a) return '<section class="tc-bloco" aria-busy="true"><h3>Formulário ANVISA</h3><p>Preparando o formulário…</p></section>';
    if (a.erro) return '<section class="tc-bloco"><h3>Formulário ANVISA</h3><p class="tc-aviso" role="alert">' + esc(a.erro) + '</p></section><div class="tc-actions"><button type="button" class="btn-new" data-tc-act="anvisa-ver">Tentar de novo</button></div>';
    if (!a.ok) {
      return '<section class="tc-bloco"><h3>O formulário não pôde ser gerado</h3><ul class="tc-materiais">' + (a.erros || []).map(function(e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>' +
        '<p class="tc-dim">Corrija os dados e volte a este passo.</p></section><div class="tc-actions"><button type="button" class="tc-link" data-tc-act="corrigir">Corrigir na Agenda</button><button type="button" class="btn-new" data-tc-act="anvisa-ver">Conferir de novo</button></div>';
    }
    return '<section class="tc-bloco"><h3>Formulário ANVISA</h3><p>Confira o formulário. Ao concluir, ele segue por e-mail a quem peticiona (GRU e extrato) e este transporte passa a aguardar o peticionamento.</p>' +
      (a.avisos || []).map(function(av) { return '<p class="tc-aviso" role="note">' + esc(av) + '</p>'; }).join('') +
      '<iframe id="tcAnvisaFrame" class="tc-anvisa-frame" title="Formulário ANVISA" sandbox="allow-same-origin allow-modals"></iframe></section>' +
      '<div class="tc-actions"><button type="button" class="tc-link" data-tc-act="anvisa-imprimir">Imprimir</button>' +
      '<button type="button" class="btn-new" data-tc-act="anvisa-concluir"><span class="material-symbols-outlined" aria-hidden="true">send</span>Concluir e avisar quem peticiona</button></div>';
  }

  // Assunto e destinatários vêm do resultado da geração ou, em outra sessão, do registro do envio. O link abre o
  // Gmail na conta em uso, já procurando o rascunho por esse assunto; sem assunto conhecido, abre os rascunhos.
  function transpCentralHtmlRascunho(registro, resultado) {
    var assunto = String((resultado && resultado.draftSubject) || (registro && registro.rascunhoAssunto) || '').trim();
    var para = String((resultado && resultado.draftRecipients) || (registro && registro.rascunhoDestinatarios) || '').trim();
    if (!assunto) return '<a href="https://mail.google.com/mail/#drafts" target="_blank" rel="noopener">Abrir rascunhos</a>';
    var busca = 'in:drafts subject:"' + assunto.replace(/"/g, ' ') + '"';
    return '<a href="https://mail.google.com/mail/#search/' + esc(encodeURIComponent(busca)) + '" target="_blank" rel="noopener">Abrir este rascunho</a>' +
      '<span class="tc-rascunho"><span><span class="tc-dim">Assunto</span> <strong>' + esc(assunto) + '</strong></span>' +
      (para ? '<span><span class="tc-dim">Para</span> ' + esc(para) + '</span>' : '') + '</span>';
  }

  function transpCentralLinkDrive(id, nome) {
    return '<a href="https://drive.google.com/file/d/' + esc(encodeURIComponent(String(id))) + '/view" target="_blank" rel="noopener">' + esc(nome) + '</a>';
  }

  // PDF para imprimir: do resultado da geração ou, em outra sessão, do registro do envio. Envio gerado antes de o
  // registro guardar o PDF: indica a pasta do Drive de quem gerou.
  function transpCentralHtmlPdf(registro, resultado) {
    var url = String((resultado && resultado.fileUrl) || '').trim();
    var nome = String((resultado && resultado.fileName) || (registro && registro.pdfArquivoNome) || '').trim();
    var id = String((registro && registro.pdfArquivoId) || '').trim();
    if (!url && id) url = 'https://drive.google.com/file/d/' + encodeURIComponent(id) + '/view';
    if (!url) {
      return '<span class="tc-dim">O PDF está no Google Drive de quem gerou: Meu Drive › Documentação para Transporte de Amostras › ' +
        esc((registro && registro.protocolo) || 'protocolo do estudo') + '.</span>';
    }
    return '<a href="' + esc(url) + '" target="_blank" rel="noopener">Abrir o PDF para imprimir</a>' +
      (nome ? ' <span class="tc-dim">' + esc(nome) + '</span>' : '');
  }

  function transpCentralHtmlEnviar(registro) {
    var r = TC_ENVIO.resultado;
    // Os documentos gerados são impressos e todas as vias assinadas à mão. Uma via de cada documento é digitalizada e vai
    // anexada ao e-mail de agendamento (com a CE do estudo na MARKEN e na OCASA); todas as vias, inclusive a digitalizada,
    // são entregues ao laboratório e ficam junto da caixa de envio.
    // DHL: o e-mail não leva anexos (nem a CE nem os documentos), então não há o que digitalizar.
    // PINEX (Agendamento): o Formulário só serve ao pré-agendamento; não é impresso, assinado nem digitalizado.
    var courier = String((registro && registro.courier) || '').toUpperCase();
    var soFormulario = courier === 'PINEX (AGENDAMENTO)';
    var dhl = courier.indexOf('DHL') >= 0;
    // A CE so entra no rascunho se for localizada. rascunhoCe: 'sim' ou 'nao'; sem o campo (rascunho de versao
    // anterior), nao se sabe e a pessoa confere.
    var ceRascunho = String((r && r.draftCe) || (registro && registro.rascunhoCe) || '');
    var ceNaoAnexada = (courier === 'MARKEN' || courier === 'OCASA') && ceRascunho === 'nao';
    // Petição de fiscalização (envio internacional): gerada pelo app no passo Gerar, salva no Drive e anexada ao rascunho.
    var peticaoNoRascunho = String((r && r.draftPeticao) || (registro && registro.rascunhoPeticao) || '') === 'sim';
    var peticaoId = String((r && r.peticaoFileId) || (registro && registro.peticaoArquivoId) || '').trim();
    var peticaoNome = String((r && r.peticaoFileName) || (registro && registro.peticaoArquivoNome) || '').trim() || 'Petição de fiscalização';
    var anexo = dhl ? 'O e-mail não leva anexos.' : (courier === 'MARKEN' || courier === 'OCASA'
      ? (ceNaoAnexada ? '' : (ceRascunho === 'sim' ? 'O rascunho já traz a CE do estudo' + (peticaoNoRascunho ? ' e a petição de fiscalização' : '') + ' em anexo.' : 'Confira se o rascunho traz a CE do estudo em anexo; se não trouxer, anexe-a também.')) : '');
    var explicacao = r ? '' : '<p>Os documentos já foram gerados. Falta ' + (soFormulario ? 'enviar o pré-agendamento à courier.' : (dhl ? 'assinar e enviar o pedido de coleta à courier.' : 'assinar, digitalizar e enviar o pedido de coleta à courier.')) + '</p>';
    var avisos = ((TC_ENVIO.dados && TC_ENVIO.dados.avisos) || []).map(function(a) { return '<p class="tc-aviso" role="note">' + esc(a) + '</p>'; }).join('');
    // Envio internacional com a GRU e o extrato prontos: anexar os dois é um passo próprio, antes de enviar.
    var gru = !!(registro && registro.gruPronta);
    // Cada item é marcado pela pessoa; "Pronto, enviei" só libera com todos marcados. texto: rótulo da caixa;
    // extra: o que fica abaixo dele (link e assunto do rascunho), fora do rótulo.
    var itens = [];
    if (!soFormulario) {
      itens.push({ texto: 'Imprima os documentos e assine à mão todas as vias, onde for pedido.', extra: transpCentralHtmlPdf(registro, r) });
      if (!dhl) itens.push({ texto: 'Digitalize uma via assinada de cada documento.' });
    }
    // PINEX com os números: o servidor não cria rascunho; os documentos seguem na conversa do agendamento.
    if (courier === 'PINEX') itens.push({ texto: 'No Gmail, abra a conversa do agendamento com a PINEX (a que trouxe os números) e responda nela, anexando os documentos assinados e digitalizados.' });
    else if (soFormulario) itens.push({ texto: 'Abra o rascunho do pré-agendamento no Gmail. Ele leva o Formulário em anexo; o Formulário só serve ao pré-agendamento e não é impresso nem assinado.', extra: transpCentralHtmlRascunho(registro, r) });
    else {
      // Sem item de "conferir destinatário e data": o rascunho é montado pelo sistema e a conferência real é do Gmail
      // ao enviar. O aviso sobre a CE e os anexos fica como texto sob o item, sem caixa para marcar.
      itens.push({ texto: dhl ? 'Abra o rascunho do pedido de coleta no Gmail.' : 'Abra o rascunho do pedido de coleta no Gmail e anexe os documentos assinados e digitalizados.',
        extra: transpCentralHtmlRascunho(registro, r) + (anexo ? '<div class="tc-dim">' + esc(anexo) + '</div>' : '') });
    }
    // CE nao localizada na geracao: anexar a CE e um item proprio, em destaque.
    if (ceNaoAnexada) itens.push({ texto: 'A CE do estudo não foi localizada e não está no rascunho. Anexe-a também ao e-mail.', forte: true });
    // Envio internacional com a GRU e o extrato prontos: anexar os dois e a petição de fiscalização é um item próprio,
    // antes de enviar. A OCASA pode bloquear o embarque se faltar qualquer um deles.
    if (gru && peticaoNoRascunho) itens.push({ texto: 'Anexe ao e-mail a GRU e o extrato. Eles estão na pasta deste envio, no servidor. A petição de fiscalização já está no rascunho.', forte: true });
    else if (gru) {
      itens.push({ texto: 'Anexe ao e-mail a GRU, o extrato e a petição de fiscalização. A GRU e o extrato estão na pasta deste envio, no servidor; ' +
        (peticaoId ? 'a petição está no Drive, junto do PDF dos documentos.' : 'a petição seguiu no e-mail do formulário ANVISA.'), forte: true,
        extra: peticaoId ? transpCentralLinkDrive(peticaoId, peticaoNome) : '' });
    }
    itens.push({ texto: 'Clique em Enviar no Gmail e volte aqui.' });
    if (!soFormulario) itens.push({ texto: dhl ? 'Entregue ao laboratório todas as vias assinadas e mantenha-as juntas com a caixa de envio das amostras.'
      : 'Entregue ao laboratório todas as vias assinadas, inclusive a que foi digitalizada, e mantenha-as juntas com a caixa de envio das amostras.' });
    var marcados = TC_ENVIO.checks || (TC_ENVIO.checks = {});
    var faltam = itens.filter(function(_item, i) { return !marcados[i]; }).length;
    return '<section class="tc-bloco"><h3>' + (gru ? (peticaoNoRascunho ? 'Anexar a GRU e o extrato e enviar à courier' : 'Anexar a GRU, o extrato e a petição e enviar à courier') : 'Pedir a coleta à courier') + '</h3>' + explicacao + avisos +
      '<ol class="tc-checklist" data-tc-total="' + itens.length + '">' + itens.map(function(item, i) {
        return '<li class="tc-check' + (marcados[i] ? ' feito' : '') + '"><input type="checkbox" id="tcCheck' + i + '" data-tc-check="' + i + '"' + (marcados[i] ? ' checked' : '') + '>' +
          '<div><label for="tcCheck' + i + '">' + (item.forte ? '<strong>' + esc(item.texto) + '</strong>' : esc(item.texto)) + '</label>' + (item.extra ? '<div class="tc-check-extra">' + item.extra + '</div>' : '') + '</div></li>';
      }).join('') + '</ol></section>' +
      '<div class="tc-actions"><button type="button" class="btn-new" id="tcBtnEnviado" data-tc-act="enviado"' + (faltam ? ' disabled' : '') + '><span class="material-symbols-outlined" aria-hidden="true">send</span>Pronto, enviei</button>' +
      '<span class="tc-dim" id="tcCheckDica"' + (faltam ? '' : ' hidden') + '>Marque os ' + itens.length + ' itens acima para liberar.</span></div>';
  }

  // Marcar um item não é dado a salvar: atualiza a lista e o botão sem redesenhar o passo.
  document.addEventListener('change', function(evento) {
    var caixa = evento.target && evento.target.closest ? evento.target.closest('#tcWizard [data-tc-check]') : null;
    if (!caixa) return;
    var marcados = TC_ENVIO.checks || (TC_ENVIO.checks = {});
    marcados[caixa.getAttribute('data-tc-check')] = !!caixa.checked;
    var item = caixa.closest('.tc-check');
    if (item) item.classList.toggle('feito', !!caixa.checked);
    var lista = caixa.closest('.tc-checklist');
    var total = Number(lista && lista.getAttribute('data-tc-total')) || 0;
    var feitos = Object.keys(marcados).filter(function(k) { return marcados[k]; }).length;
    var botao = document.getElementById('tcBtnEnviado');
    var dica = document.getElementById('tcCheckDica');
    if (botao) botao.disabled = feitos < total;
    if (dica) dica.hidden = feitos >= total;
    appClearUnsavedChanges('tcWizard');
  });

  function transpCentralHtmlFim(tarefa) {
    transpCentralMarcarFeito(TC_ENVIO.agendaId, TC_ENVIO.slot);
    var proximo = transpCentralProximoTransporte(tarefa, TC_ENVIO.slot);
    var outras = ((TRANSP_CENTRAL_STATE.dados && TRANSP_CENTRAL_STATE.dados.tarefas) || []).filter(function(t) { return t.agendaId !== TC_ENVIO.agendaId; });
    var botoes = proximo ? '<button type="button" class="btn-new" data-tc-act="proximo-transporte" data-tc-slot="' + esc(proximo.slot) + '">Ir ao próximo transporte desta visita</button>'
      : (outras.length ? '<button type="button" class="btn-new" data-tc-act="proxima-tarefa">Ir à próxima tarefa</button>' : '');
    var texto = TC_ENVIO.aguardaPeticionamento ? 'O formulário ANVISA foi enviado por e-mail a quem peticiona. Quando a GRU e o extrato estiverem prontos, esta tarefa volta para você: anexar e enviar à courier.' : TC_ENVIO.aguardaPinex ? 'O Formulário foi enviado. A PINEX responde por e-mail com os números no título; quando chegar, abra este transporte em Acompanhar e cole a linha.' : 'O monitor de e-mails reconhece o envio pelo Gmail.';
    // Com próxima tarefa, ela é a ação principal; sem nenhuma, voltar à lista é a principal.
    var voltar = '<button type="button" class="' + (botoes ? 'tc-acao' : 'btn-new') + '" data-tc-act="fechar">Voltar às tarefas</button>';
    return '<section class="tc-bloco tc-fim"><span class="tc-fim-icone" aria-hidden="true">✓</span>' +
      '<div><h3>' + (proximo || outras.length ? 'Envio concluído' : 'Tudo feito por agora') + '</h3><p>' + esc(texto) + '</p></div></section>' +
      '<div class="tc-actions">' + botoes + voltar + '</div>';
  }

  function transpCentralRenderPasso() {
    var dados = TC_ENVIO.dados;
    if (!dados) return;
    var registro = dados.registro || {};
    var tarefa = transpCentralTarefa(TC_ENVIO.agendaId);
    var passo = TC_ENVIO.passo;
    var corpo = { conferir: transpCentralHtmlConferir, awb: transpCentralHtmlAwb, pinex_numeros: transpCentralHtmlPinexNumeros, gerar: transpCentralHtmlGerar, anvisa: transpCentralHtmlAnvisa, enviar: transpCentralHtmlEnviar }[passo];
    var conteudo = passo === 'fim' ? transpCentralHtmlFim(tarefa) : (corpo ? corpo(registro) : '');
    // No Conferir o painel "Este envio" repetiria o que está ao lado, e no fim não há mais o que consultar: nesses
    // dois a linha de resumo basta e o conteúdo usa a largura toda. Nos demais, painel ao lado (telas largas) ou
    // a linha de resumo completa no topo (telas estreitas).
    var semPainel = passo === 'conferir' || passo === 'fim';
    transpCentralRenderWizard((passo === 'fim' ? '' : transpCentralBarra(dados.passos || [], passo)) + transpCentralResumo(registro, tarefa, !semPainel) +
      '<div class="tc-wiz-grid' + (semPainel ? ' tc-wiz-grid-cheio' : '') + '"><main class="tc-wiz-main">' + conteudo + '</main>' +
      (semPainel ? '' : transpCentralPainelLateral(registro, tarefa)) + '</div>');
    if (passo === 'awb' && !TC_ENVIO.awbUltima && transpCentralAwbDePacote(registro)) transpCentralBuscarAwbUltima(registro);
    if (passo === 'anvisa') transpCentralMostrarAnvisa();
  }

  // O HTML do servidor entra no iframe isolado (srcdoc por propriedade, sem montar atributo à mão).
  function transpCentralMostrarAnvisa() {
    var seq = TC_ENVIO.seq;
    var quadro = document.getElementById('tcAnvisaFrame');
    if (TC_ENVIO.anvisa && TC_ENVIO.anvisa.ok && quadro) { quadro.srcdoc = TC_ENVIO.anvisa.html; return; }
    if (TC_ENVIO.anvisa || TC_ENVIO.anvisaBuscando) return;
    TC_ENVIO.anvisaBuscando = true;
    google.script.run
      .withSuccessHandler(function(resposta) {
        TC_ENVIO.anvisaBuscando = false;
        if (!transpCentralEnvioAtual(seq) || TC_ENVIO.passo !== 'anvisa') return;
        TC_ENVIO.anvisa = resposta || { erro: 'Resposta inválida.' };
        transpCentralRenderPasso();
      })
      .withFailureHandler(function(erro) {
        TC_ENVIO.anvisaBuscando = false;
        if (!transpCentralEnvioAtual(seq)) return;
        TC_ENVIO.anvisa = { erro: appErrorMessage(erro) };
        transpCentralRenderPasso();
      })
      .getTransporteFormularioAnvisa(TC_ENVIO.agendaId, TC_ENVIO.slot);
  }

  function transpCentralBuscarAwbUltima(registro) {
    var seq = TC_ENVIO.seq;
    TC_ENVIO.awbUltima = { awb: '' };
    google.script.run.withSuccessHandler(function(resposta) {
      if (!transpCentralEnvioAtual(seq) || TC_ENVIO.passo !== 'awb') return;
      TC_ENVIO.awbUltima = resposta && resposta.ultima ? resposta.ultima : { awb: '' };
      if (TC_ENVIO.awbUltima.awb) transpCentralRenderPasso();
    }).withFailureHandler(function() { /* a dica é opcional */ }).getTransporteAwbUltima(registro.protocolo, registro.courier, registro.temperatura);
  }

  function transpCentralProximoPasso() {
    var passos = TC_ENVIO.dados.passos || [];
    return passos[passos.indexOf(TC_ENVIO.passo) + 1] || 'fim';
  }

  // Salva campos e passo; a versão da tela só avança com a resposta do servidor.
  function transpCentralSalvar(campos, passo, aoSalvar) {
    var seq = TC_ENVIO.seq;
    if (TC_ENVIO.salvando) { setTimeout(function() { if (transpCentralEnvioAtual(seq)) transpCentralSalvar(campos, passo, aoSalvar); }, 200); return; }
    TC_ENVIO.salvando = true;
    google.script.run
      .withSuccessHandler(function(resposta) {
        TC_ENVIO.salvando = false;
        if (!transpCentralEnvioAtual(seq)) return;
        TC_ENVIO.dados.versao = resposta.versao;
        TC_ENVIO.dados.passos = resposta.passos || TC_ENVIO.dados.passos;
        Object.keys(campos || {}).forEach(function(k) { TC_ENVIO.dados.registro[k] = campos[k]; });
        appClearUnsavedChanges('tcWizard');
        // O preparo expirou com a tela parada e ninguém assumiu: retoma para continuar sendo a única pessoa no envio.
        if (resposta.perdeuPreparo) transpCentralRenovarPreparo(true);
        if (aoSalvar) aoSalvar(resposta);
      })
      .withFailureHandler(function(erro) {
        TC_ENVIO.salvando = false;
        if (!transpCentralEnvioAtual(seq)) return;
        snackErro(erro);
      })
      .salvarTransporteEnvio(TC_ENVIO.agendaId, TC_ENVIO.slot, TC_ENVIO.dados.versao, campos || {}, passo);
  }

  // Ao clicar num botão logo depois de editar um campo, o "change" do campo (salvamento automático) dispara antes
  // do clique e vai avançar a versão: quem manda a versão espera essa gravação terminar para não mandar a antiga.
  function transpCentralAposSalvar(seq, acao) {
    if (!transpCentralEnvioAtual(seq)) return;
    if (TC_ENVIO.salvando) { setTimeout(function() { transpCentralAposSalvar(seq, acao); }, 200); return; }
    acao();
  }

  function transpCentralValorCampo(nome) {
    var el = document.getElementById('tcCampo_' + nome);
    return el ? String(el.value || '').trim() : undefined;
  }

  function transpCentralIrParaPasso(passo) {
    TC_ENVIO.passo = passo;
    transpCentralRenderPasso();
  }

  function transpCentralGerar() {
    var seq = TC_ENVIO.seq;
    if (TC_ENVIO.gerando) return;
    TC_ENVIO.gerando = true; TC_ENVIO.resultado = null;
    transpCentralRenderPasso();
    google.script.run
      .withSuccessHandler(function(resposta) {
        TC_ENVIO.gerando = false;
        if (!transpCentralEnvioAtual(seq)) return;
        // Sem resposta legível a geração pode ter terminado no servidor: relê o envio em vez de voltar ao "Gerar".
        if (!resposta || resposta.ok !== true) { transpCentralReabrirAposGerar('Confira o transporte: a resposta da geração não chegou à tela.'); return; }
        TC_ENVIO.resultado = resposta;
        if (resposta.versao) TC_ENVIO.dados.versao = resposta.versao;
        transpCentralRenderPasso();
      })
      .withFailureHandler(function(erro) {
        TC_ENVIO.gerando = false;
        if (!transpCentralEnvioAtual(seq)) return;
        var mensagem = appErrorMessage(erro);
        // A versão da tela ficou para trás (uma geração anterior terminou, por exemplo): mostra o estado atual.
        if (/alterado por outra pessoa/i.test(mensagem)) { transpCentralReabrirAposGerar('Este transporte mudou desde que a tela foi aberta. Ele foi recarregado.'); return; }
        TC_ENVIO.resultado = { erro: mensagem };
        transpCentralRenderPasso();
      })
      .gerarDocumentosTransporteEnvio(TC_ENVIO.agendaId, TC_ENVIO.slot, TC_ENVIO.dados.versao, TC_ENVIO.token);
  }

  function transpCentralReabrirAposGerar(aviso) {
    snack(aviso);
    transpCentralAbrirEnvio(TC_ENVIO.agendaId, TC_ENVIO.slot);
  }

  function transpCentralSair(aposSair) {
    var seq = TC_ENVIO.seq;
    var passo = TC_ENVIO.passo === 'fim' ? 'concluido' : TC_ENVIO.passo;
    function fechar() {
      TC_ENVIO.aberto = false;
      appClearUnsavedChanges('tcWizard');
      transpCentralMostrarWizard(false);
      transpCentralCarregar(true);
      if (typeof aposSair === 'function') aposSair();
    }
    // Durante a geração nada é gravado: o servidor termina sozinho e guarda o passo seguinte.
    if (!TC_ENVIO.dados || TC_ENVIO.passo === 'fim' || TC_ENVIO.gerando) { fechar(); return; }
    transpCentralAposSalvar(seq, function() {
      google.script.run
        .withSuccessHandler(function() { if (transpCentralEnvioAtual(seq)) fechar(); })
        .withFailureHandler(function(erro) { if (transpCentralEnvioAtual(seq)) { snackErro(erro); fechar(); } })
        .sairEnvioTransporte(TC_ENVIO.agendaId, TC_ENVIO.slot, TC_ENVIO.dados.versao, passo);
    });
  }

  function transpCentralAcaoMateriais(acao, alvo) {
    var registro = TC_ENVIO.dados && TC_ENVIO.dados.registro;
    if (!registro) return;
    if (acao === 'materiais-editar') {
      TC_ENVIO.matEdit = transpCentralMateriaisIniciais(registro);
    } else if (acao === 'materiais-adicionar') {
      TC_ENVIO.matEdit.push({ material: TC_MATERIAIS_TIPOS[0], formula: '', ensaio: '' });
    } else if (acao === 'materiais-remover') {
      TC_ENVIO.matEdit.splice(Number(alvo.getAttribute('data-tc-mat-i')), 1);
    } else if (acao === 'materiais-cancelar') {
      TC_ENVIO.matEdit = null;
      appClearUnsavedChanges('tcWizard');
    } else if (acao === 'materiais-salvar') {
      var seq = TC_ENVIO.seq;
      var itens = TC_ENVIO.matEdit.filter(function(m) { return m.material; });
      google.script.run
        .withSuccessHandler(function(resposta) {
          if (!transpCentralEnvioAtual(seq)) return;
          TC_ENVIO.dados.versao = resposta.versao;
          if (resposta.registro) TC_ENVIO.dados.registro = resposta.registro;
          if (resposta.ajuste) TC_ENVIO.ajuste = resposta.ajuste;
          TC_ENVIO.matEdit = null;
          appClearUnsavedChanges('tcWizard');
          snack(resposta.alterado ? 'Materiais atualizados na Agenda.' : 'Nenhuma alteração nos materiais.');
          transpCentralRenderPasso();
        })
        .withFailureHandler(function(erro) { if (transpCentralEnvioAtual(seq)) snackErro(erro); })
        .editarMateriaisTransporteEnvio(TC_ENVIO.agendaId, TC_ENVIO.slot, TC_ENVIO.dados.versao, itens);
      return;
    }
    transpCentralRenderPasso();
  }

  function transpCentralDigitadoSemGravar() {
    if (!TC_ENVIO.dados || TC_ENVIO.gerando) return false;
    if (TC_ENVIO.matEdit) return true;
    var pinex = document.getElementById('tcPinexColeta');
    if (TC_ENVIO.passo === 'pinex_numeros' && pinex && String(pinex.value || '').trim()) return true;
    var awb = document.getElementById('tcCampo_awb');
    return TC_ENVIO.passo === 'awb' && !!awb && String(awb.value || '').trim() !== String((TC_ENVIO.dados.registro || {}).awb || '').trim();
  }

  var TC_ACOES_COM_VERSAO = ['pinex-ok', 'gerar', 'anvisa-concluir', 'enviado'];

  function transpCentralAcao(acao, alvo) {
    if (TC_ENVIO.salvando && TC_ACOES_COM_VERSAO.indexOf(acao) >= 0) {
      transpCentralAposSalvar(TC_ENVIO.seq, function() { transpCentralAcao(acao, alvo); });
      return;
    }
    var registro = TC_ENVIO.dados && TC_ENVIO.dados.registro;
    if (acao === 'sair' || acao === 'fechar') {
      // Os campos do Conferir salvam sozinhos; estes três só gravam pelo próprio botão.
      if (transpCentralDigitadoSemGravar()) appOpenUnsavedConfirm(function() { transpCentralSair(); });
      else transpCentralSair();
      return;
    }
    if (acao.indexOf('materiais-') === 0) { transpCentralAcaoMateriais(acao, alvo); return; }
    if (acao === 'corrigir') { abrirPendenciaAgendaRegistro(TC_ENVIO.agendaId); return; }
    if (!registro) return;
    if (acao === 'conferido') {
      var campos = { agendadoPor: transpCentralValorCampo('agendadoPor'), horaEnvio: transpCentralValorCampo('horaEnvio') };
      var faltando = [];
      if (!campos.agendadoPor) faltando.push('Agendado por');
      if (!campos.horaEnvio) faltando.push('Janela de envio');
      if (registro.courier === 'PINEX (Agendamento)') {
        campos.responsavelEntrega = transpCentralValorCampo('responsavelEntrega');
        if (!campos.responsavelEntrega) faltando.push('Quem entrega as amostras');
      }
      if (faltando.length) { snackErro('Preencha: ' + faltando.join(', ') + '.'); return; }
      var proximo = transpCentralProximoPasso();
      transpCentralSalvar(campos, proximo, function() { transpCentralIrParaPasso(proximo); });
    } else if (acao === 'awb-ok') {
      var awb = transpCentralValorCampo('awb');
      if (!awb) { snackErro('Informe a AWB.'); return; }
      var depois = transpCentralProximoPasso();
      var gravarAwb = function() { TC_ENVIO.awbAviso = null; transpCentralSalvar({ awb: awb }, depois, function() { transpCentralIrParaPasso(depois); }); };
      // Segundo clique com a mesma AWB já avisada: a pessoa confirmou. A geração continua recusando AWB duplicada.
      if (TC_ENVIO.awbAviso && TC_ENVIO.awbAviso.digitada === awb) { gravarAwb(); return; }
      if (TC_ENVIO.awbConsultando) return;
      TC_ENVIO.awbConsultando = true;
      var seqAwb = TC_ENVIO.seq;
      google.script.run
        .withSuccessHandler(function(resposta) {
          TC_ENVIO.awbConsultando = false;
          if (!transpCentralEnvioAtual(seqAwb) || TC_ENVIO.passo !== 'awb') return;
          if (resposta && resposta.text) { TC_ENVIO.awbAviso = { text: String(resposta.text), digitada: awb }; transpCentralRenderPasso(); return; }
          gravarAwb();
        })
        // O aviso é uma ajuda: sem ele, a AWB é gravada e a geração faz a conferência de sempre.
        .withFailureHandler(function() { TC_ENVIO.awbConsultando = false; if (transpCentralEnvioAtual(seqAwb) && TC_ENVIO.passo === 'awb') gravarAwb(); })
        .getTransporteAwbAviso(Object.assign({}, registro, { awb: awb }));
    } else if (acao === 'pinex-ok') {
      if (TC_ENVIO.pinexSalvando) return;
      var coletaEl = document.getElementById('tcPinexColeta');
      var awbEl = document.getElementById('tcPinexAwb');
      var dadosPinex = { coleta: String((coletaEl || {}).value || '').trim(), awb: String((awbEl || {}).value || '').trim() };
      if (!dadosPinex.coleta) { TC_ENVIO.pinex = { mensagem: 'Informe o número da coleta da PINEX.', coleta: '', awb: dadosPinex.awb }; transpCentralRenderPasso(); return; }
      var seq = TC_ENVIO.seq;
      TC_ENVIO.pinexSalvando = true; TC_ENVIO.pinex = { coleta: dadosPinex.coleta, awb: dadosPinex.awb };
      transpCentralRenderPasso();
      google.script.run.withSuccessHandler(function(resposta) {
        if (!transpCentralEnvioAtual(seq)) return;
        TC_ENVIO.pinexSalvando = false;
        if (!resposta || !resposta.ok) {
          TC_ENVIO.pinex = { mensagem: (resposta && resposta.mensagem) || 'Não foi possível salvar.', pedirAwb: !!(resposta && resposta.pedirAwb), coleta: dadosPinex.coleta, awb: dadosPinex.awb };
          transpCentralRenderPasso();
          return;
        }
        // O servidor já gravou os números e o passo seguinte: segue direto, sem outra chamada.
        TC_ENVIO.pinex = null;
        TC_ENVIO.dados.versao = resposta.versao;
        TC_ENVIO.dados.passos = resposta.passos || TC_ENVIO.dados.passos;
        if (resposta.registro) TC_ENVIO.dados.registro = resposta.registro;
        appClearUnsavedChanges('tcWizard');
        (resposta.avisos || []).forEach(function(aviso) { snack(aviso); });
        var passos = TC_ENVIO.dados.passos || [];
        transpCentralIrParaPasso(passos.indexOf(resposta.passo) >= 0 ? resposta.passo : passos[0]);
      }).withFailureHandler(function(erro) {
        if (!transpCentralEnvioAtual(seq)) return;
        TC_ENVIO.pinexSalvando = false;
        transpCentralRenderPasso();
        snackErro(erro);
      }).registrarRespostaPinexEnvio(TC_ENVIO.agendaId, TC_ENVIO.slot, TC_ENVIO.dados.versao, dadosPinex);
    } else if (acao === 'gerar') {
      transpCentralGerar();
    } else if (acao === 'gerado-ok') {
      transpCentralIrParaPasso(transpCentralProximoPasso());
    } else if (acao === 'anvisa-ver') {
      TC_ENVIO.anvisa = null;
      transpCentralRenderPasso();
    } else if (acao === 'anvisa-imprimir') {
      var quadroImpressao = document.getElementById('tcAnvisaFrame');
      if (quadroImpressao && quadroImpressao.contentWindow) quadroImpressao.contentWindow.print();
    } else if (acao === 'anvisa-concluir') {
      var seqAnvisa = TC_ENVIO.seq;
      google.script.run.withSuccessHandler(function(resposta) {
        if (!transpCentralEnvioAtual(seqAnvisa)) return;
        if (resposta && resposta.versao) TC_ENVIO.dados.versao = resposta.versao;
        if (resposta && resposta.ok === false) { snackErro(resposta.erro || 'Não foi possível concluir. Tente de novo.'); return; }
        TC_ENVIO.aguardaPeticionamento = true;
        transpCentralIrParaPasso('fim');
      }).withFailureHandler(function(erro) { if (transpCentralEnvioAtual(seqAnvisa)) snackErro(erro); })
        .concluirAnvisaTransporteEnvio(TC_ENVIO.agendaId, TC_ENVIO.slot, TC_ENVIO.dados.versao);
    } else if (acao === 'enviado') {
      var seqFim = TC_ENVIO.seq;
      google.script.run.withSuccessHandler(function(resposta) {
        if (!transpCentralEnvioAtual(seqFim)) return;
        if (resposta && resposta.versao) TC_ENVIO.dados.versao = resposta.versao;
        TC_ENVIO.aguardaPinex = !!(resposta && resposta.aguardaPinex);
        transpCentralIrParaPasso('fim');
      }).withFailureHandler(function(erro) { if (transpCentralEnvioAtual(seqFim)) snackErro(erro); })
        .concluirEnvioTransporte(TC_ENVIO.agendaId, TC_ENVIO.slot, TC_ENVIO.dados.versao);
    } else if (acao === 'proximo-transporte') {
      var agendaId = TC_ENVIO.agendaId;
      var slot = alvo && alvo.getAttribute('data-tc-slot');
      TC_ENVIO.aberto = false;
      transpCentralAbrirEnvio(agendaId, slot);
    } else if (acao === 'proxima-tarefa') {
      var outras = ((TRANSP_CENTRAL_STATE.dados && TRANSP_CENTRAL_STATE.dados.tarefas) || []).filter(function(t) { return t.agendaId !== TC_ENVIO.agendaId; });
      TC_ENVIO.aberto = false;
      if (outras[0]) transpCentralComecar(outras[0].agendaId); else transpCentralSair();
    }
  }

  // Os campos do editor de materiais só mudam o rascunho em memória; salvar é explícito.
  function transpCentralLerCampoMaterial(evento) {
    var campo = evento.target && evento.target.closest ? evento.target.closest('#tcWizard [data-tc-mat]') : null;
    if (!campo || !TC_ENVIO.matEdit) return false;
    var linha = TC_ENVIO.matEdit[Number(campo.getAttribute('data-tc-mat'))];
    if (linha) linha[campo.getAttribute('data-tc-mat-campo')] = String(campo.value || '');
    return true;
  }
  document.addEventListener('input', transpCentralLerCampoMaterial);

  // Salva sozinho ao sair de um campo, sem mudar de passo.
  document.addEventListener('change', function(evento) {
    if (transpCentralLerCampoMaterial(evento)) return;
    var campo = evento.target && evento.target.closest ? evento.target.closest('#tcWizard [data-tc-campo]') : null;
    if (!campo || !TC_ENVIO.dados || TC_ENVIO.passo === 'awb') return;
    var nome = campo.getAttribute('data-tc-campo');
    var valor = String(campo.value || '').trim();
    var atual = {}; atual[nome] = valor;
    transpCentralSalvar(atual, undefined);
  });

  document.addEventListener('click', function(evento) {
    var alvo = evento.target && evento.target.closest ? evento.target.closest('#tcWizard [data-tc-act]') : null;
    if (alvo && !alvo.disabled) transpCentralAcao(alvo.getAttribute('data-tc-act'), alvo);
  });
</script>
