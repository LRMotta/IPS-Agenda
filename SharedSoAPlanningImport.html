<script>
/* Polo Trial Flowchart CSV reader. Only visit fields leave the browser: values and procedures stay here. */
var SOA_POLO_ROTULOS_ = { label: 'nome da visita', note: 'observacoes', interval: 'intervalo', unit: 'unidade', after: 'apos', reference: 'visita referencia', window_before: 'janela -', window_after: 'janela +' };
function soaPoloNormalizar_(value) {
  return String(value == null ? '' : value).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
}
function soaPoloLerCsv_(texto) {
  var primeira = texto.split('\n')[0];
  var separador = primeira.split(';').length > primeira.split(',').length ? ';' : ',';
  var linhas = [], linha = [], campo = '', aspas = false;
  for (var i = 0; i < texto.length; i++) {
    var c = texto.charAt(i);
    if (aspas) {
      if (c !== '"') campo += c;
      else if (texto.charAt(i + 1) === '"') { campo += '"'; i++; }
      else aspas = false;
    } else if (c === '"') aspas = true;
    else if (c === separador) { linha.push(campo); campo = ''; }
    else if (c === '\n') { linha.push(campo.replace(/\r$/, '')); linhas.push(linha); linha = []; campo = ''; }
    else campo += c;
  }
  if (campo || linha.length) { linha.push(campo.replace(/\r$/, '')); linhas.push(linha); }
  return linhas;
}
function soaPoloExtrair_(texto) {
  var conteudo = String(texto || '').replace(/^﻿/, '');
  if (conteudo.indexOf('�') >= 0 || /^PK/.test(conteudo)) throw new Error('Use o arquivo CSV exportado pelo Polo Trial, sem abrir e salvar em outro programa.');
  var linhas = soaPoloLerCsv_(conteudo), coluna = -1, inicio = -1;
  linhas.some(function(linha, indice) {
    coluna = linha.map(soaPoloNormalizar_).indexOf(SOA_POLO_ROTULOS_.label);
    inicio = indice;
    return coluna >= 0;
  });
  if (coluna < 0) throw new Error('Este arquivo não parece ser a exportação do Flowchart do Polo Trial.');
  var campos = {};
  Object.keys(SOA_POLO_ROTULOS_).forEach(function(chave) {
    campos[chave] = linhas.slice(inicio).filter(function(linha) { return soaPoloNormalizar_(linha[coluna]) === SOA_POLO_ROTULOS_[chave]; })[0];
    if (!campos[chave]) throw new Error('A exportação não traz a linha "' + SOA_POLO_ROTULOS_[chave] + '".');
  });
  var visitas = [];
  campos.label.forEach(function(nome, indice) {
    if (indice <= coluna || !String(nome).trim()) return;
    var visita = {};
    Object.keys(campos).forEach(function(chave) { visita[chave] = String(campos[chave][indice] == null ? '' : campos[chave][indice]).trim(); });
    visitas.push(visita);
  });
  if (!visitas.length) throw new Error('A exportação não contém visitas.');
  return { schema: 'polo-trial-flowchart', schema_version: '1.0.0', visits: visitas };
}
</script>
