  .farmacia-cycle-balances{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;border:1px solid #e0e6f0;border-radius:10px;margin-bottom:20px}.farmacia-cycle-balance{padding:18px 20px;border-right:1px solid #edf1f7}.farmacia-cycle-balance:last-child{border-right:0}.farmacia-cycle-balance span{display:block;font-size:10px;text-transform:uppercase;color:var(--text-muted);letter-spacing:.6px}.farmacia-cycle-balance strong{font-size:28px;font-weight:500;display:block;margin:10px 0 5px}.farmacia-cycle-balance small{font-size:11px;color:var(--text-muted)}

  .farmacia-cycle-result{background:#edf8f4;border:1px solid #cee9de;border-radius:8px;padding:20px;color:#167465;margin-top:18px}.farmacia-cycle-result strong{display:block;font-size:34px;margin:8px 0}.farmacia-cycle-result p{font-size:12px;line-height:1.6}.farmacia-cycle-help{font-size:11px;color:var(--text-muted);line-height:1.7;margin-top:14px}

  @media(max-width:760px){.farmacia-life-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.farmacia-life-card{padding:14px 5px}.farmacia-life-card strong{font-size:10px}.farmacia-life-card b{font-size:14px}.farmacia-life-icon{width:33px;height:33px}.farmacia-cycle-columns{grid-template-columns:1fr}.farmacia-cycle-balances{grid-template-columns:1fr 1fr}.farmacia-cycle-balance:nth-child(2){border-right:0}.farmacia-cycle-balance:nth-child(-n+2){border-bottom:1px solid #edf1f7}.farmacia-cycle-heading h2{font-size:19px}.farmacia-cycle-body{padding:17px}.farmacia-cycle-event-top{align-items:flex-start;flex-direction:column;gap:5px}.farmacia-cycle-timeline{padding:20px 16px}.farmacia-cycle-tabs{gap:16px;padding:0 16px}#farmaciaCycleNav button{padding:9px 10px;font-size:11px}.farmacia-cycle-kv{font-size:11px}.farmacia-cycle-form .form-grid{grid-template-columns:1fr}.farmacia-cycle-form .full{grid-column:1/-1}}

<script>
var FARMACIA_CYCLE = { pane:'overview',filter:'all',positionId:'',tab:'events',form:null,participants:null,participantRead:0,renderData:null };
var FARMACIA_CYCLE_LABELS = {dispense:'Dispensação',return:'Retorno do participante',transport_departure:'Saída para transporte',transport_arrival:'Chegada do transporte',destination:'Destinação final',block:'Bloqueio',release:'Liberação',transfer:'Transferência',INITIAL:'Saldo inicial',RECEIPT:'Recebimento'};

function farmaciaCycleIcon(name) { return '<span class="material-symbols-outlined" aria-hidden="true">' + name + '</span>'; }
function farmaciaLifecycleReset() {
  FARMACIA_CYCLE.participantRead++;
  FARMACIA_CYCLE.pane='overview'; FARMACIA_CYCLE.filter='all'; FARMACIA_CYCLE.positionId=''; FARMACIA_CYCLE.form=null;
  FARMACIA_CYCLE.participants=null; FARMACIA_CYCLE.renderData=null;
  if (typeof appClearUnsavedChanges==='function') appClearUnsavedChanges('farmaciaCyclePane');
  ['farmaciaLifecycleSummary','farmaciaCycleNav','farmaciaCyclePane'].forEach(function(id){ var node=document.getElementById(id); if(node){node.hidden=true;node.textContent='';} });
  document.getElementById('page-farmacia').classList.remove('farmacia-cycle-mode');
}
function farmaciaCycleRecords(action) {
  return ((FARMACIA_STOCK.data||{}).movements||[]).filter(function(r){return r.type==='LIFECYCLE'&&(!action||r.data.action===action);});
}
function farmaciaCyclePosition(id) {return ((FARMACIA_STOCK.data||{}).positions||[]).find(function(p){return p.id===id;});}
function farmaciaCycleProduct(position) {return ((FARMACIA_STOCK.data||{}).products||[]).find(function(p){return position&&p.id===position.productId;});}
function farmaciaCycleLotPositions(position) {return ((FARMACIA_STOCK.data||{}).positions||[]).filter(function(p){return position&&p.productId===position.productId&&p.lot===position.lot&&p.kit===position.kit;});}
function farmaciaCycleCanOperate() {var d=FARMACIA_STOCK.data;return !!d&&d.configured&&d.farmaciaAccess==='manage'&&FARMACIA_STOCK.studyId!=='@IPS_COMMON';}
function farmaciaCycleEligible(position) {var p=farmaciaCycleProduct(position);return !!p&&p.category==='medicine'&&p.supplySource==='sponsor';}
function farmaciaCycleNavigate(pane,positionId,confirmed) {
  if(FARMACIA_STOCK.saving)return;
  if(!confirmed&&typeof appConfirmNavigationIfDirty==='function'&&!appConfirmNavigationIfDirty('farmaciaCyclePane',function(){farmaciaCycleNavigate(pane,positionId,true);}))return;
  if(typeof appClearUnsavedChanges==='function')appClearUnsavedChanges('farmaciaCyclePane');
  FARMACIA_CYCLE.form=null; FARMACIA_CYCLE.pane=pane;
  if(positionId) FARMACIA_CYCLE.positionId=positionId;
  farmaciaLifecycleRender();
}
function farmaciaCycleOpen(id) {farmaciaCycleNavigate('cycle',id);}
function farmaciaCycleSectionGuard(view) {
  if(!FARMACIA_CYCLE.form||view===FARMACIA_VIEW)return true;
  if(typeof appHasUnsavedChanges==='function'&&appHasUnsavedChanges('farmaciaCyclePane')){
    appConfirmNavigationIfDirty('farmaciaCyclePane',function(){
      appClearUnsavedChanges('farmaciaCyclePane');FARMACIA_CYCLE.form=null;abrirFarmaciaView(view,true);
    });return false;
  }
  FARMACIA_CYCLE.form=null;return true;
}
function farmaciaCycleScopeGuard(kind) {
  if(!FARMACIA_CYCLE.form)return true;
  var study=kind==='study',input=document.getElementById(study?'farmaciaStudy':'farmaciaStockRestricted');
  var next=study?input.value:input.checked,previous=study?FARMACIA_STOCK.studyId:FARMACIA_STOCK.restricted;
  function assign(value){if(study)input.value=value;else input.checked=value;}
  if(FARMACIA_STOCK.saving){assign(previous);return false;}
  if(typeof appHasUnsavedChanges==='function'&&appHasUnsavedChanges('farmaciaCyclePane')){
    assign(previous);
    appConfirmNavigationIfDirty('farmaciaCyclePane',function(){
      appClearUnsavedChanges('farmaciaCyclePane');FARMACIA_CYCLE.form=null;assign(next);
      if(study)selecionarFarmaciaStudy(true);else farmaciaStockChangeClass(true);
    });
    return false;
  }
  return true;
}
function farmaciaCycleRefreshGuard() {
  if(FARMACIA_STOCK.saving)return false;
  if(!FARMACIA_CYCLE.form)return true;
  var dirty=typeof appHasUnsavedChanges==='function'&&appHasUnsavedChanges('farmaciaCyclePane');
  if(dirty&&typeof appConfirmNavigationIfDirty==='function'){
    appConfirmNavigationIfDirty('farmaciaCyclePane',function(){farmaciaCycleNavigate(FARMACIA_CYCLE.pane,null,true);farmaciaStockRefresh(true);});
    return false;
  }
  FARMACIA_CYCLE.form=null;return true;
}
function farmaciaLifecycleMatches(row) {
  if(FARMACIA_VIEW!=='stock'||!row.dataset.farmaciaPosition)return true;
  var p=farmaciaCyclePosition(row.dataset.farmaciaPosition),filter=FARMACIA_CYCLE.filter;
  return !p||filter==='all'||(filter==='available'&&p.available>0)||(filter==='blocked'&&p.blocked>0)||(filter==='pending'&&p.pending>0)||(filter==='destination'&&(p.expired||p.returned)&&p.physical>0);
}
function farmaciaLifecycleFilter(filter) {
  if(FARMACIA_STOCK.saving)return;
  if(filter==='dispense'||filter==='return'){farmaciaCycleNavigate(filter);return;}
  FARMACIA_CYCLE.filter=filter;farmaciaCycleNavigate('overview');farmaciaApplySearch();
}
function farmaciaLifecycleRender() {
  var d=FARMACIA_STOCK.data,active=FARMACIA_VIEW==='stock'&&!!d&&!!d.configured;
  var summary=document.getElementById('farmaciaLifecycleSummary'),nav=document.getElementById('farmaciaCycleNav'),pane=document.getElementById('farmaciaCyclePane');
  if(!summary||!nav||!pane)return;
  summary.hidden=!active||FARMACIA_CYCLE.pane!=='overview';nav.hidden=!active;pane.hidden=!active||FARMACIA_CYCLE.pane==='overview';
  document.getElementById('farmaciaSummary').hidden=active;
  document.getElementById('page-farmacia').classList.toggle('farmacia-cycle-mode',active&&FARMACIA_CYCLE.pane!=='overview');
  document.getElementById('page-farmacia').classList.toggle('farmacia-has-cycle',active);
  if(!active)return;
  var positions=d.positions||[];
  function lots(test){var keys={};positions.filter(test).forEach(function(p){keys[JSON.stringify([p.productId,p.lot,p.kit])]=true;});return Object.keys(keys).length;}
  var cards=[['available','inventory_2','Disponível',lots(function(p){return p.available>0;}),'lotes / kits',''],['blocked','pause_circle','Quarentena / bloqueio',lots(function(p){return p.blocked>0;}),'lotes / kits','amber'],['dispense','medication','Dispensações',farmaciaCycleRecords('dispense').length,'registros',''],['return','assignment_return','Retornos',farmaciaCycleRecords('return').length,'registros','teal'],['destination','outbox','Aguardando destinação',lots(function(p){return (p.expired||p.returned)&&p.physical>0;}),'lotes / kits','amber'],['all','format_list_bulleted','Todos os lotes',lots(function(){return true;}),'lotes / kits','']];
  summary.innerHTML='<div class="farmacia-life-grid">'+cards.map(function(c){return '<button type="button" class="farmacia-life-card '+c[5]+'" data-filter="'+c[0]+'" onclick="farmaciaLifecycleFilter(this.dataset.filter)" aria-pressed="'+(FARMACIA_CYCLE.pane==='overview'&&FARMACIA_CYCLE.filter===c[0])+'"><span class="farmacia-life-icon">'+farmaciaCycleIcon(c[1])+'</span><strong>'+c[2]+'</strong><b>'+c[3]+' '+(c[3]===1?(c[4]==='registros'?'registro':'lote / kit'):c[4])+'</b></button>';}).join('')+'</div><div class="farmacia-life-note"><span>Um lote pode ter saldos em mais de uma situação. Quantidades na unidade de cada produto.</span><button type="button" class="btn-txt" onclick="farmaciaLifecycleFilter(\'pending\')">Aguardando avaliação: '+positions.filter(function(p){return p.pending>0;}).length+' registros</button></div>';
  nav.innerHTML=[['overview','space_dashboard','Estoque'],['cycle','route','Ciclo do lote'],['dispense','medication','Dispensações'],['return','assignment_return','Retornos e adesão'],['transport','local_shipping','Transporte']].map(function(c){return '<button type="button" data-pane="'+c[0]+'" onclick="farmaciaCycleNavigate(this.dataset.pane)"'+(FARMACIA_CYCLE.pane===c[0]?' aria-current="page"':'')+'>'+farmaciaCycleIcon(c[1])+c[2]+'</button>';}).join('');
  if(FARMACIA_CYCLE.pane==='overview'){farmaciaApplySearch();return;}
  if(FARMACIA_CYCLE.form&&FARMACIA_CYCLE.renderData===d&&pane.querySelector('form'))return;
  FARMACIA_CYCLE.renderData=d;
  if(FARMACIA_CYCLE.form){pane.innerHTML=farmaciaCycleFormHtml(FARMACIA_CYCLE.form);farmaciaCycleBindForm();return;}
  pane.innerHTML=FARMACIA_CYCLE.pane==='cycle'?farmaciaCycleDetailHtml():farmaciaCycleListHtml(FARMACIA_CYCLE.pane);
}
function farmaciaCycleHeading(title,subtitle,actions) {return '<div class="farmacia-cycle-heading"><div><h2>'+esc(title)+'</h2><p>'+esc(subtitle||'')+'</p></div><div class="farmacia-cycle-actions">'+(actions||'')+'</div></div>';}
function farmaciaCycleButton(action,label,icon) {return '<button type="button" class="btn-new" data-cycle-action="'+action+'" onclick="farmaciaCycleStart(this.dataset.cycleAction)">'+farmaciaCycleIcon(icon||'add')+esc(label)+'</button>';}
function farmaciaCycleLotSelect(selected,eligible) {
  return '<div class="field"><label class="field-label" for="farmaciaCyclePosition">Lote / kit / posição</label><select class="f-input" id="farmaciaCyclePosition" name="positionId" onchange="farmaciaCycleSelectionChanged(this)" required><option value="">Selecione um registro de estoque</option>'+((FARMACIA_STOCK.data||{}).positions||[]).filter(function(p){return !eligible||farmaciaCycleEligible(p);}).map(function(p){var product=farmaciaCycleProduct(p)||{};return '<option value="'+esc(p.id)+'"'+(p.id===selected?' selected':'')+'>'+esc([product.name,p.lot,p.kit?'Kit '+p.kit:'',p.location].filter(Boolean).join(' · '))+'</option>';}).join('')+'</select></div>';
}
function farmaciaCycleDetailHtml() {
  var p=farmaciaCyclePosition(FARMACIA_CYCLE.positionId),product=farmaciaCycleProduct(p);
  var select=farmaciaCycleLotSelect(p&&p.id,false);
  if(!p||!product)return farmaciaCycleHeading('Ciclo do lote','Selecione um lote ou kit para consultar saldos, eventos e documentos.')+'<div class="farmacia-cycle-panel farmacia-cycle-body">'+select+'</div>';
  var unit=product.unit,group=farmaciaCycleLotPositions(p),ids=group.map(function(item){return item.id;}),total={physical:0,available:0,pending:0,blocked:0,inTransit:0};
  group.forEach(function(item){Object.keys(total).forEach(function(key){total[key]=Math.round((total[key]+(item[key]||0))*1000)/1000;});});
  var history=((FARMACIA_STOCK.data||{}).movements||[]).filter(function(r){return ids.indexOf(r.id)!==-1||ids.indexOf(r.data.positionId)!==-1;});
  var controls=farmaciaDocumentButton(p.id,true)+'<button type="button" class="btn-txt" data-position-id="'+esc(p.id)+'" onclick="farmaciaOpenPosition(this.dataset.positionId)">'+farmaciaCycleIcon('history')+'Histórico e movimentação</button>';
  if(farmaciaCycleCanOperate()&&farmaciaCycleEligible(p)){
    if(p.available>0&&!p.returned&&!p.expired)controls+=farmaciaCycleButton('dispense','Dispensar','medication');
    if(p.blocked+p.pending>0)controls+=farmaciaCycleButton('destination','Registrar destinação','outbox');
  }
  var expiry=group.every(function(item){return item.expiry===p.expiry;})?farmaciaStockDate(p.expiry):'Validades por posição';
  var html=farmaciaCycleHeading(product.name,'Lote '+p.lot+(p.kit?' · Kit '+p.kit:'')+' · '+expiry+' · Saldo consolidado nas posições do lote',controls);

  var alreadyReturned=farmaciaCycleRecords('return').reduce(function(total,r){return total+(r.data.dispenseId===snapshot.reference?r.data.quantity:0);},0);
  f.elements.quantity.max=String(record?Math.max(0,record.data.quantity-alreadyReturned):0);
  f.elements.quantity.step=['mL','g'].indexOf(product.unit)!==-1?'0.001':'1';
  f.elements.quantity.min=f.elements.quantity.step;
  farmaciaCycleUpdateSide();farmaciaCycleCalculate();
}
function farmaciaCycleAdherenceChanged(){var f=document.getElementById('farmaciaCycleForm'),enabled=f.elements.calculateAdherence.checked;document.getElementById('farmaciaCycleAdherenceFields').disabled=!enabled;['dailyDose','firstDose','lastDose'].forEach(function(key){f.elements[key].required=enabled;});farmaciaCycleCalculate();}
function farmaciaCycleTransportMode(){
  var f=document.getElementById('farmaciaCycleForm'),storage=f.elements.operation.value==='storage';
  document.getElementById('farmaciaCycleDestination').hidden=!storage;
  ['unitId','position'].forEach(function(key){f.elements[key].required=storage;f.elements[key].disabled=!storage;});
  f.elements.dispenseId.required=!storage;
  if(storage)f.elements.dispenseId.value='';
  else if(f.elements.dispenseId.value){
    var record=farmaciaCycleRecords('dispense').find(function(r){return r.id===f.elements.dispenseId.value;});
    if(record){
      f.elements.positionId.value=record.data.positionId;farmaciaCycleSelectionChanged(f.elements.positionId);
      f.elements.quantity.max=String(farmaciaCycleOutstanding(record.id));
    }
  }
}
function farmaciaCycleOutstanding(id){
  var record=farmaciaCycleRecords('dispense').find(function(r){return r.id===id;});if(!record)return 0;
  var arrived={};farmaciaCycleRecords('transport_arrival').forEach(function(r){arrived[r.data.departureId]=true;});
  return Math.max(0,Math.round(farmaciaCycleRecords().reduce(function(left,r){return left-(r.data.dispenseId===id&&(r.data.action==='return'||r.data.action==='transport_departure'&&!arrived[r.id])?r.data.quantity:0);},record.data.quantity)*1000)/1000);
}
function farmaciaCycleCalculate() {
  var f=document.getElementById('farmaciaCycleForm'),snapshot=FARMACIA_CYCLE.form,box=document.getElementById('farmaciaCycleCalculation');if(!f||!snapshot||!box)return;
  if(snapshot.action==='return'&&f.elements.calculateAdherence.checked){
    var r=farmaciaCycleRecords('dispense').find(function(x){return x.id===f.elements.dispenseId.value;}),daily=f.elements.dailyDose.valueAsNumber,q=f.elements.quantity.valueAsNumber;
    var prior=farmaciaCycleRecords('return').reduce(function(total,item){return total+(r&&item.data.dispenseId===r.id?item.data.quantity:0);},0);
    var days=Math.round((Date.parse(f.elements.lastDose.value)-Date.parse(f.elements.firstDose.value))/86400000)+1;
    var valid=r&&Number.isFinite(q)&&q>=0&&q+prior<=r.data.quantity&&Number.isFinite(daily)&&daily>0&&days>0&&f.elements.firstDose.value>=r.data.occurredOn&&f.elements.lastDose.value<=f.elements.occurredOn.value;
    var pct=valid?(r.data.quantity-prior-q)/(daily*days)*100:null;
    box.innerHTML='<div class="farmacia-cycle-result"><p>Adesão estimada pela contagem · FG 174</p><strong>'+(pct===null?'—':pct.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%')+'</strong><p>'+(valid?days+' dias · Consumo estimado: '+farmaciaStockNumber(r.data.quantity-prior-q):'Informe a dispensação, o retorno, a dose fixa e o período compatível. Retornos anteriores entram na contagem acumulada.')+'</p></div>';
  }else if(snapshot.action==='transport_departure'){
    var departureTemp=f.elements.departureTemperature.valueAsNumber,rangeLow=f.elements.min.valueAsNumber,rangeHigh=f.elements.max.valueAsNumber;
    var departureOutside=Number.isFinite(departureTemp)&&Number.isFinite(rangeLow)&&Number.isFinite(rangeHigh)&&(departureTemp<rangeLow||departureTemp>rangeHigh);
    box.innerHTML=departureOutside?'<div class="farmacia-cycle-notice amber farmacia-cycle-below">'+farmaciaCycleIcon('warning')+'<div>Saída fora da faixa documentada. Estoque ativo exige avaliação antes de transportar. Para produto já dispensado, registre a ocorrência e siga a orientação documentada.</div></div>':'';
  }else if(snapshot.action==='transport_arrival'){var departure=farmaciaCycleRecords('transport_departure').find(function(r){return r.id===snapshot.reference;}),min=f.elements.minTemperature.valueAsNumber,max=f.elements.maxTemperature.valueAsNumber,current=f.elements.currentTemperature.valueAsNumber,temperatureValid=Number.isFinite(min)&&Number.isFinite(max)&&Number.isFinite(current)&&min<=current&&current<=max,outside=temperatureValid&&departure&&(min<departure.data.min||max>departure.data.max||departure.data.departureTemperature<departure.data.min||departure.data.departureTemperature>departure.data.max);box.innerHTML='<div class="farmacia-cycle-notice '+(outside?'amber':'')+' farmacia-cycle-below">'+farmaciaCycleIcon(outside?'warning':'thermostat')+'<div>'+(temperatureValid?outside?'Excursão identificada. Será registrada ocorrência; não há liberação automática.':'Leituras dentro da faixa informada. Conferência final pela equipe.':'Informe leituras coerentes: mínima ≤ atual ≤ máxima.')+'</div></div>';
  }else box.textContent='';
}
function farmaciaCyclePayload(form,snapshot) {
  var data={action:snapshot.action,positionId:snapshot.positionId,revision:snapshot.revision,document:form.elements.document.value,reason:form.elements.reason.value};
  ['occurredOn','participantId','visit','prescription','platformReference','validThrough','departureTime','origin','destination','operation','thermometer','arrivalTime','authorization','from'].forEach(function(key){if(form.elements[key])data[key]=form.elements[key].value;});
  ['quantity','min','max','departureTemperature','currentTemperature','minTemperature','maxTemperature'].forEach(function(key){if(form.elements[key])data[key]=form.elements[key].valueAsNumber;});
  if(form.elements.confirmed)data.confirmed=form.elements.confirmed.checked;
  if(form.elements.dispenseId&&form.elements.dispenseId.value)data.dispenseId=form.elements.dispenseId.value;
  if(snapshot.action==='transport_arrival')data.departureId=snapshot.reference;
  if(snapshot.action==='return'){
    data.locationRef={unitId:form.elements.unitId.value,position:form.elements.position.value};
    if(form.elements.calculateAdherence.checked)data.adherence={dailyDose:form.elements.dailyDose.valueAsNumber,firstDose:form.elements.firstDose.value,lastDose:form.elements.lastDose.value,confirmedFixedDose:true};
  }
  if(snapshot.action==='transport_departure'&&data.operation==='storage')data.locationRef={unitId:form.elements.unitId.value,position:form.elements.position.value};
  return {studyId:snapshot.studyId,restricted:snapshot.restricted,requestId:snapshot.requestId,data:data};
}
function farmaciaCycleSave(event,form) {
  event.preventDefault();var snapshot=FARMACIA_CYCLE.form;
  if(!snapshot||!farmaciaCycleCanOperate()||FARMACIA_STOCK.saving||!farmaciaStockCurrent(snapshot.epoch,snapshot.studyId,snapshot.restricted))return false;
  var payload=farmaciaCyclePayload(form,snapshot),fields=document.getElementById('farmaciaCycleFields'),submit=form.querySelector('[type="submit"]'),status=document.getElementById('farmaciaCycleSaveStatus');
  function current(){return FARMACIA_CYCLE.form===snapshot&&farmaciaStockCurrent(snapshot.epoch,snapshot.studyId,snapshot.restricted);}
  FARMACIA_STOCK.saving=true;fields.disabled=true;submit.disabled=true;status.textContent='Salvando…';
  google.script.run.withSuccessHandler(function(){if(!current())return;FARMACIA_STOCK.saving=false;FARMACIA_CYCLE.form=null;FARMACIA_CYCLE.renderData=null;farmaciaLifecycleRender();if(typeof appClearUnsavedChanges==='function')appClearUnsavedChanges('farmaciaCyclePane');farmaciaStockRefresh();}).withFailureHandler(function(error){if(!current())return;FARMACIA_STOCK.saving=false;fields.disabled=false;submit.disabled=false;status.textContent=appErrorMessage(error)+' Os dados e o identificador da operação foram preservados para conferência ou nova tentativa.';}).registrarCicloFarmacia(payload);
  return false;
}
