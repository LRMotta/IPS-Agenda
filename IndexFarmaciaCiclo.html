<script>
var FARMACIA_CYCLE = { pane:'overview',filter:'all',positionId:'',tab:'events',form:null,participants:null,participantRead:0,renderData:null };
var FARMACIA_DESTINATION_LABELS={sponsor:'Devolução ao patrocinador',disposal:'Destruição'};
var FARMACIA_DESTINATION_REASON_LABELS={expired:'Produto vencido',participant_return:'Retornado pelo participante',study_close:'Encerramento do estudo / sobra',excursion:'Excursão de temperatura',recall:'Recolhimento (recall)',damaged:'Avaria / dano',other:'Outro (descrever na observação)'};
var FARMACIA_DESTINATION_CONDITION_LABELS={intact:'Íntegro / lacrado',partial:'Parcialmente utilizado',empty:'Vazio',mixed:'Misto (descrever)'};
var FARMACIA_CYCLE_LABELS = {dispense:'Dispensação',return:'Retorno do participante',transport_departure:'Saída para transporte',transport_arrival:'Chegada do transporte',destination:'Destinação final',ADJUSTMENT:'Saída / ajuste de quantidade',block:'Bloqueio',release:'Liberação',transfer:'Transferência',INITIAL:'Saldo inicial',RECEIPT:'Recebimento'};

function farmaciaCycleIcon(name) { return '<span class="material-symbols-outlined" aria-hidden="true">' + name + '</span>'; }
function farmaciaLifecycleReset() {
  FARMACIA_CYCLE.participantRead++;
  FARMACIA_CYCLE.pane='overview'; FARMACIA_CYCLE.filter='all'; FARMACIA_CYCLE.positionId=''; FARMACIA_CYCLE.form=null;
  FARMACIA_CYCLE.participants=null; FARMACIA_CYCLE.renderData=null;
  if (typeof appClearUnsavedChanges==='function') appClearUnsavedChanges('farmaciaCyclePane');
  ['farmaciaLifecycleSummary','farmaciaCycleNav','farmaciaCyclePane'].forEach(function(id){ var node=document.getElementById(id); if(node){node.hidden=true;node.textContent='';} });
  document.getElementById('page-farmacia').classList.remove('farmacia-cycle-mode');
}
function farmaciaCycleRecords(action) {
  return ((FARMACIA_STOCK.data||{}).movements||[]).filter(function(r){return r.type==='LIFECYCLE'&&(!action||r.data.action===action);});
}
function farmaciaCyclePosition(id) {return ((FARMACIA_STOCK.data||{}).positions||[]).find(function(p){return p.id===id;});}
function farmaciaCycleProduct(position) {return ((FARMACIA_STOCK.data||{}).products||[]).find(function(p){return position&&p.id===position.productId;});}
function farmaciaCycleLotPositions(position) {return ((FARMACIA_STOCK.data||{}).positions||[]).filter(function(p){return position&&p.productId===position.productId&&p.lot===position.lot&&p.kit===position.kit;});}
function farmaciaCycleCanOperate(action) {var d=FARMACIA_STOCK.data,level=d&&d.farmaciaAccess;return !!d&&d.configured&&FARMACIA_STOCK.studyId!=='@IPS_COMMON'&&(action==='destination'?level==='manage':level==='operate'||level==='manage');}
// Mesma regra do servidor: medicamento do patrocinador ou material do patrocinador entregue / emprestado ao participante.
function farmaciaCycleEligible(position) {var p=farmaciaCycleProduct(position);return !!p&&p.supplySource==='sponsor'&&(p.category==='medicine'||(p.category==='material'&&(p.materialUse==='participant'||p.materialUse==='loan')));}
// Material emprestado: no retorno, conferido volta ao estoque; avariado é segregado.
function farmaciaCycleLoan(position) {var p=farmaciaCycleProduct(position);return !!p&&p.category==='material'&&p.materialUse==='loan';}
function farmaciaCycleNavigate(pane,positionId,confirmed) {
  if(FARMACIA_STOCK.saving)return;
  if(!confirmed&&typeof appConfirmNavigationIfDirty==='function'&&!appConfirmNavigationIfDirty('farmaciaCyclePane',function(){farmaciaCycleNavigate(pane,positionId,true);}))return;
  if(typeof appClearUnsavedChanges==='function')appClearUnsavedChanges('farmaciaCyclePane');
  FARMACIA_CYCLE.form=null; FARMACIA_CYCLE.pane=pane;
  if(positionId) FARMACIA_CYCLE.positionId=positionId;
  farmaciaLifecycleRender();
}
function farmaciaCycleOpen(id) {farmaciaCycleNavigate('cycle',id);}
function farmaciaCycleSectionGuard(view) {
  if(!FARMACIA_CYCLE.form||view===FARMACIA_VIEW)return true;
  if(typeof appHasUnsavedChanges==='function'&&appHasUnsavedChanges('farmaciaCyclePane')){
    appConfirmNavigationIfDirty('farmaciaCyclePane',function(){
      appClearUnsavedChanges('farmaciaCyclePane');FARMACIA_CYCLE.form=null;abrirFarmaciaView(view,true);
    });return false;
  }
  FARMACIA_CYCLE.form=null;return true;
}
function farmaciaCycleScopeGuard(kind) {
  if(!FARMACIA_CYCLE.form)return true;
  var study=kind==='study',input=document.getElementById(study?'farmaciaStudy':'farmaciaStockRestricted');
  var next=study?input.value:input.checked,previous=study?FARMACIA_STOCK.studyId:FARMACIA_STOCK.restricted;
  function assign(value){if(study)input.value=value;else input.checked=value;}
  if(FARMACIA_STOCK.saving){assign(previous);return false;}
  if(typeof appHasUnsavedChanges==='function'&&appHasUnsavedChanges('farmaciaCyclePane')){
    assign(previous);
    appConfirmNavigationIfDirty('farmaciaCyclePane',function(){
      appClearUnsavedChanges('farmaciaCyclePane');FARMACIA_CYCLE.form=null;assign(next);
      if(study)selecionarFarmaciaStudy(true);else farmaciaStockChangeClass(true);
    });
    return false;
  }
  return true;
}
function farmaciaCycleRefreshGuard() {
  if(FARMACIA_STOCK.saving)return false;
  if(!FARMACIA_CYCLE.form)return true;
  var dirty=typeof appHasUnsavedChanges==='function'&&appHasUnsavedChanges('farmaciaCyclePane');
  if(dirty&&typeof appConfirmNavigationIfDirty==='function'){
    appConfirmNavigationIfDirty('farmaciaCyclePane',function(){farmaciaCycleNavigate(FARMACIA_CYCLE.pane,null,true);farmaciaStockRefresh(true);});
    return false;
  }
  FARMACIA_CYCLE.form=null;return true;
}
function farmaciaLifecycleMatches(row) {
  if(FARMACIA_VIEW!=='stock'||!row.dataset.farmaciaPosition)return true;
  var p=farmaciaCyclePosition(row.dataset.farmaciaPosition),filter=FARMACIA_CYCLE.filter;
  return !p||filter==='all'||(filter==='available'&&p.available>0)||(filter==='blocked'&&p.blocked>0)||(filter==='pending'&&p.pending>0)||(filter==='destination'&&(p.expired||p.returned)&&p.physical>0);
}
function farmaciaLifecycleFilter(filter) {
  if(FARMACIA_STOCK.saving)return;
  if(filter==='dispense'||filter==='return'){farmaciaCycleNavigate(filter);return;}
  FARMACIA_CYCLE.filter=filter;farmaciaCycleNavigate('overview');farmaciaApplySearch();
}
function farmaciaLifecycleRender() {
  var d=FARMACIA_STOCK.data,active=FARMACIA_VIEW==='stock'&&!!d&&!!d.configured;
  var summary=document.getElementById('farmaciaLifecycleSummary'),nav=document.getElementById('farmaciaCycleNav'),pane=document.getElementById('farmaciaCyclePane');
  if(!summary||!nav||!pane)return;
  // Resumo fica em todas as abas do ciclo; só some enquanto um formulário ocupa a tela.
  summary.hidden=!active||!!FARMACIA_CYCLE.form;nav.hidden=!active;pane.hidden=!active||FARMACIA_CYCLE.pane==='overview';
  document.getElementById('farmaciaSummary').hidden=active;
  document.getElementById('page-farmacia').classList.toggle('farmacia-cycle-mode',active&&FARMACIA_CYCLE.pane!=='overview');
  document.getElementById('page-farmacia').classList.toggle('farmacia-has-cycle',active);
  if(!active)return;
  var positions=d.positions||[];
  function lots(test){var keys={};positions.filter(test).forEach(function(p){keys[JSON.stringify([p.productId,p.lot,p.kit])]=true;});return Object.keys(keys).length;}
  var cards=[['available','inventory_2','Disponível',lots(function(p){return p.available>0;}),'lotes / kits',''],['pending','hourglass_top','Aguardando avaliação',lots(function(p){return p.pending>0;}),'lotes / kits','amber'],['blocked','pause_circle','Quarentena / bloqueio',lots(function(p){return p.blocked>0;}),'lotes / kits','amber'],['dispense','medication','Dispensações',farmaciaCycleRecords('dispense').length,'registros',''],['return','assignment_return','Retornos do participante',farmaciaCycleRecords('return').length,'registros','teal'],['destination','outbox','Aguardando destinação',lots(function(p){return (p.expired||p.returned)&&p.physical>0;}),'lotes / kits','amber'],['all','format_list_bulleted','Todos os lotes',lots(function(){return true;}),'lotes / kits','']];
  summary.innerHTML='<div class="farmacia-life-grid">'+cards.map(function(c){return '<button type="button" class="farmacia-life-card '+c[5]+'" data-filter="'+c[0]+'" onclick="farmaciaLifecycleFilter(this.dataset.filter)" aria-pressed="'+((FARMACIA_CYCLE.pane==='overview'&&FARMACIA_CYCLE.filter===c[0])||FARMACIA_CYCLE.pane===c[0])+'"><span class="farmacia-life-icon">'+farmaciaCycleIcon(c[1])+'</span><strong>'+c[2]+'</strong><b>'+c[3]+' '+(c[3]===1?(c[4]==='registros'?'registro':'lote / kit'):c[4])+'</b></button>';}).join('')+'</div><div class="farmacia-life-note"><span>Um lote pode ter saldos em mais de uma situação. Quantidades na unidade de cada produto.</span></div>';
  nav.innerHTML=[['overview','space_dashboard','Estoque'],['cycle','route','Ciclo do lote'],['dispense','medication','Dispensações'],['return','assignment_return','Retornos do participante'],['destination','outbox','Devolução e destruição'],['transport','local_shipping','Transporte']].map(function(c){return '<button type="button" data-pane="'+c[0]+'" onclick="farmaciaCycleNavigate(this.dataset.pane)"'+(FARMACIA_CYCLE.pane===c[0]?' aria-current="page"':'')+'>'+farmaciaCycleIcon(c[1])+c[2]+'</button>';}).join('');
  if(FARMACIA_CYCLE.pane==='overview'){farmaciaApplySearch();return;}
  if(FARMACIA_CYCLE.form&&FARMACIA_CYCLE.renderData===d&&pane.querySelector('form'))return;
  FARMACIA_CYCLE.renderData=d;
  if(FARMACIA_CYCLE.form){pane.innerHTML=farmaciaCycleFormHtml(FARMACIA_CYCLE.form);farmaciaCycleBindForm();return;}
  pane.innerHTML=FARMACIA_CYCLE.pane==='cycle'?farmaciaCycleDetailHtml():FARMACIA_CYCLE.pane==='destination'?farmaciaCycleMemoListHtml():farmaciaCycleListHtml(FARMACIA_CYCLE.pane);
}
function farmaciaCycleHeading(title,subtitle,actions) {return '<div class="farmacia-cycle-heading"><div><h2>'+esc(title)+'</h2><p>'+esc(subtitle||'')+'</p></div><div class="farmacia-cycle-actions">'+(actions||'')+'</div></div>';}
function farmaciaCycleButton(action,label,icon) {return '<button type="button" class="btn-new" data-cycle-action="'+action+'" onclick="farmaciaCycleStart(this.dataset.cycleAction)">'+farmaciaCycleIcon(icon||'add')+esc(label)+'</button>';}
function farmaciaCycleDispenseOptions(selected) {
  // Só dispensações com saldo a retornar ou transportar; mostra o código do participante e o lote, não o ID do cadastro.
  return farmaciaCycleRecords('dispense').filter(function(r){return r.id===selected||farmaciaCycleOutstanding(r.id)>0;}).map(function(r){
    var pos=farmaciaCyclePosition(r.data.positionId),pr=farmaciaCycleProduct(pos)||{};
    return '<option value="'+esc(r.id)+'"'+(r.id===selected?' selected':'')+'>'+esc([r.data.participantLabel||r.data.participantId,pr.name,pos?pos.lot:'',farmaciaStockDate(r.data.occurredOn)].filter(Boolean).join(' · '))+'</option>';
  }).join('');
}
function farmaciaCycleLotUsable(p,action) {
  if(action==='dispense')return p.available>0&&!p.returned&&!p.expired;
  if(action==='transport_departure')return !p.expired&&((p.available>0&&!p.returned)||farmaciaCycleRecords('dispense').some(function(r){return r.data.positionId===p.id&&farmaciaCycleOutstanding(r.id)>0;}));
  if(action==='destination')return (p.blocked||0)+(p.pending||0)>0;
  return true;

    document.getElementById('farmaciaCycleFields').appendChild(group);

    farmaciaCycleTransportMode();

function farmaciaCycleDispenseChanged() {
  var f=document.getElementById('farmaciaCycleForm'),record=farmaciaCycleRecords('dispense').find(function(r){return r.id===f.elements.dispenseId.value;}),snapshot=FARMACIA_CYCLE.form;
  snapshot.reference=record?record.id:'';snapshot.positionId=record?record.data.positionId:'';var p=farmaciaCyclePosition(snapshot.positionId);snapshot.revision=p?p.revision:'';
  var product=farmaciaCycleProduct(p)||{},allowed=product.control==='quantity'&&['comprimido','cápsula'].indexOf(product.unit)!==-1;

function farmaciaCycleAdherenceChanged(){var f=document.getElementById('farmaciaCycleForm'),enabled=f.elements.calculateAdherence.checked;document.getElementById('farmaciaCycleAdherenceFields').disabled=!enabled;['dailyDose','firstDose','lastDose'].forEach(function(key){f.elements[key].required=enabled;});farmaciaCycleCalculate();}
function farmaciaCycleTransportMode(){
  var f=document.getElementById('farmaciaCycleForm'),storage=f.elements.operation.value==='storage';
  document.getElementById('farmaciaCycleDestination').hidden=!storage;
  ['unitId','position'].forEach(function(key){f.elements[key].required=storage;f.elements[key].disabled=!storage;});
  f.elements.dispenseId.required=!storage;
  // No armazenamento o servidor deriva origem e destino do cadastro de equipamentos; os campos de texto não se aplicam.
  ['origin','destination'].forEach(function(key){var el=f.elements[key],box=el&&el.closest('.field');if(!el)return;el.required=!storage;el.disabled=storage;if(box)box.hidden=storage;});
  if(storage)f.elements.dispenseId.value='';

    var record=farmaciaCycleRecords('dispense').find(function(r){return r.id===f.elements.dispenseId.value;});
    if(record){
      f.elements.positionId.value=record.data.positionId;farmaciaCycleSelectionChanged(f.elements.positionId);
      f.elements.quantity.max=String(farmaciaCycleOutstanding(record.id));

function farmaciaCycleOutstanding(id){
  var record=farmaciaCycleRecords('dispense').find(function(r){return r.id===id;});if(!record)return 0;
  var arrived={};farmaciaCycleRecords('transport_arrival').forEach(function(r){arrived[r.data.departureId]=true;});
  return Math.max(0,Math.round(farmaciaCycleRecords().reduce(function(left,r){return left-(r.data.dispenseId===id&&(r.data.action==='return'||r.data.action==='transport_departure'&&!arrived[r.id])?r.data.quantity:0);},record.data.quantity)*1000)/1000);
}
// Retorno e chegada aceitam a data real do fato, mesmo anterior à última operação da entrada, com motivo.

  if(!f||!s||!note||!f.elements.occurredOn||(s.action!=='return'&&s.action!=='transport_arrival'))return;

function farmaciaCycleCalculate() {

  }else if(snapshot.action==='transport_arrival'){var departure=farmaciaCycleRecords('transport_departure').find(function(r){return r.id===snapshot.reference;}),min=f.elements.minTemperature.valueAsNumber,max=f.elements.maxTemperature.valueAsNumber,current=f.elements.currentTemperature.valueAsNumber,temperatureValid=Number.isFinite(min)&&Number.isFinite(max)&&Number.isFinite(current)&&min<=current&&current<=max,outside=temperatureValid&&departure&&(min<departure.data.min||max>departure.data.max||departure.data.departureTemperature<departure.data.min||departure.data.departureTemperature>departure.data.max);box.innerHTML='<div class="farmacia-cycle-notice '+(outside?'amber':'')+' farmacia-cycle-below">'+farmaciaCycleIcon(outside?'warning':'thermostat')+'<div>'+(temperatureValid?outside?'Excursão identificada. Será registrada ocorrência; não há liberação automática.':'Leituras dentro da faixa informada. Conferência final pela equipe.':'Informe leituras coerentes: mínima ≤ atual ≤ máxima.')+'</div></div>';
  }else box.textContent='';

function farmaciaCyclePayload(form,snapshot) {
  if(snapshot.action==='destination')return farmaciaCycleMemoPayload(form,snapshot);

    var common={document:form.elements.document.value,reason:form.elements.reason.value,confirmed:form.elements.confirmed.checked};
    ['occurredOn','participantId','visit','prescription','platformReference','validThrough'].forEach(function(key){common[key]=form.elements[key].value;});
    var items=Array.from(form.querySelectorAll('#farmaciaCycleGuideItems .farmacia-guide-item')).map(function(row){
      var item=farmaciaCycleGuideItem(row)||{};
      return {positionId:row.querySelector('[name="guidePosition"]').value,revision:item.revision||'',quantity:row.querySelector('[name="guideQuantity"]').valueAsNumber};
    });
    return {studyId:snapshot.studyId,restricted:snapshot.restricted,requestId:snapshot.requestId,data:common,items:items};
  }
  var data={action:snapshot.action,positionId:snapshot.positionId,revision:snapshot.revision,document:form.elements.document.value,reason:form.elements.reason.value};
  ['occurredOn','participantId','visit','prescription','platformReference','validThrough','departureTime','origin','destination','operation','thermometer','arrivalTime','authorization','from'].forEach(function(key){if(form.elements[key])data[key]=form.elements[key].value;});
  ['quantity','min','max','departureTemperature','currentTemperature','minTemperature','maxTemperature'].forEach(function(key){if(form.elements[key])data[key]=form.elements[key].valueAsNumber;});
  if(form.elements.confirmed)data.confirmed=form.elements.confirmed.checked;
  if(form.elements.dispenseId&&form.elements.dispenseId.value)data.dispenseId=form.elements.dispenseId.value;
  if(snapshot.action==='transport_arrival')data.departureId=snapshot.reference;
  if(snapshot.action==='return'){
    if(!form.elements.returnTo.disabled&&form.elements.returnTo.value==='stock')data.returnTo='stock';
    else data.locationRef={unitId:form.elements.unitId.value,position:form.elements.position.value};
    if(form.elements.calculateAdherence.checked)data.adherence={dailyDose:form.elements.dailyDose.valueAsNumber,firstDose:form.elements.firstDose.value,lastDose:form.elements.lastDose.value,confirmedFixedDose:true};
  }
  if(snapshot.action==='transport_departure'&&data.operation==='storage')data.locationRef={unitId:form.elements.unitId.value,position:form.elements.position.value};
  return {studyId:snapshot.studyId,restricted:snapshot.restricted,requestId:snapshot.requestId,data:data};

  function current(){return FARMACIA_CYCLE.form===snapshot&&farmaciaStockCurrent(snapshot.epoch,snapshot.studyId,snapshot.restricted);}
  FARMACIA_STOCK.saving=true;fields.disabled=true;submit.disabled=true;status.textContent='Salvando…';
  var runner=google.script.run.withSuccessHandler(function(){if(!current())return;FARMACIA_STOCK.saving=false;FARMACIA_CYCLE.form=null;FARMACIA_CYCLE.renderData=null;farmaciaLifecycleRender();if(typeof appClearUnsavedChanges==='function')appClearUnsavedChanges('farmaciaCyclePane');farmaciaStockRefresh();}).withFailureHandler(function(error){if(!current())return;FARMACIA_STOCK.saving=false;fields.disabled=false;submit.disabled=false;status.textContent=appErrorMessage(error)+' Os dados e o identificador da operação foram preservados para conferência ou nova tentativa.';});
  if(snapshot.action==='destination')runner.registrarDestinacaoFarmacia(payload);else if(payload.items)runner.registrarDispensacaoFarmacia(payload);else runner.registrarCicloFarmacia(payload);
  return false;
}
// Memorando de devolução ao patrocinador / destruição: dados comuns uma vez e um ou mais lotes / kits.
var FARMACIA_CYCLE_MEMO_MAX=30;
function farmaciaCycleMemoOptions(map,selected,placeholder) {return (placeholder?'<option value="">'+esc(placeholder)+'</option>':'')+Object.keys(map).map(function(key){return '<option value="'+key+'"'+(key===selected?' selected':'')+'>'+esc(map[key])+'</option>';}).join('');}
function farmaciaCycleMemoItemHtml(item) {
  var key=esc(item.key),p=farmaciaCyclePosition(item.positionId),product=farmaciaCycleProduct(p)||{};
  function sel(name,memoKey,label,options){return '<div class="field"><label class="field-label" for="farmaciaCycleMemo'+name+'-'+key+'">'+esc(label)+'</label><select class="f-input" id="farmaciaCycleMemo'+name+'-'+key+'" name="guide'+name+'" data-memo-key="'+memoKey+'" required onchange="farmaciaCycleMemoItemChanged(this)">'+options+'</select></div>';}
  return '<div class="farmacia-guide-item memo" data-guide-key="'+key+'"><div class="field"><label class="field-label" for="farmaciaCycleGuidePosition-'+key+'" data-guide-label>Item · lote / kit</label><select class="f-input" id="farmaciaCycleGuidePosition-'+key+'" name="guidePosition" required onchange="farmaciaCycleGuideLotChanged(this)"><option value="">Selecione um lote segregado</option>'+farmaciaCycleLotOptions(item.positionId,true,'destination')+'</select></div>'+
    '<div class="field"><label class="field-label" for="farmaciaCycleGuideQuantity-'+key+'" data-guide-unit>Quantidade'+(product.unit?' ('+esc(product.unit)+')':'')+'</label><input class="f-input" id="farmaciaCycleGuideQuantity-'+key+'" name="guideQuantity" type="number" min="0.001" step="0.001" required value="'+esc(item.quantity===undefined?'':String(item.quantity))+'" oninput="farmaciaCycleGuideQuantityChanged(this)"></div>'+
    sel('From','from','Sai de',farmaciaCycleMemoOptions({blocked:'Quarentena',pending:'Em avaliação'},item.from||'blocked'))+
    sel('Condition','condition','Condição',farmaciaCycleMemoOptions(FARMACIA_DESTINATION_CONDITION_LABELS,item.condition,'Selecione'))+
    '<button type="button" class="btn-txt farmacia-guide-remove" onclick="farmaciaCycleGuideRemove(this.closest(\'.farmacia-guide-item\').dataset.guideKey)">'+farmaciaCycleIcon('delete')+'<span>Remover</span></button>'+
    '<div class="field farmacia-guide-note"><label class="field-label" for="farmaciaCycleMemoNote-'+key+'">Observação do item'+(item.condition==='mixed'?'':' (opcional)')+'</label><input class="f-input" id="farmaciaCycleMemoNote-'+key+'" name="guideNote" data-memo-key="itemNote" maxlength="200"'+(item.condition==='mixed'?' required':'')+' value="'+esc(item.itemNote||'')+'" oninput="farmaciaCycleMemoItemChanged(this)" placeholder="Ex.: 2 frascos lacrados e 1 frasco aberto com 12 comprimidos"></div></div>';
}
function farmaciaCycleMemoItemChanged(el) {
  var row=el.closest('.farmacia-guide-item'),item=farmaciaCycleGuideItem(row);if(!item)return;
  item[el.dataset.memoKey]=el.value;
  if(el.dataset.memoKey==='from')farmaciaCycleGuideApplyLot(row.querySelector('[name="guidePosition"]'));
  if(el.dataset.memoKey==='condition'){var note=row.querySelector('[name="guideNote"]');note.required=el.value==='mixed';note.labels[0].textContent='Observação do item'+(el.value==='mixed'?'':' (opcional)');}
}
function farmaciaCycleMemoFieldsHtml(snapshot,today) {
  return '<div class="section-label">Destinação e autorização</div><div class="form-grid">'+
    farmaciaCycleSelect('destination','Destinação',farmaciaCycleMemoOptions(FARMACIA_DESTINATION_LABELS,'sponsor'),false,'farmaciaCycleMemoMode()')+
    farmaciaCycleSelect('reasonCategory','Motivo',farmaciaCycleMemoOptions(FARMACIA_DESTINATION_REASON_LABELS,'','Selecione'),false,'farmaciaCycleMemoMode()')+
    farmaciaCycleField('occurredOn','Data da devolução / destruição',today,'date')+
    farmaciaCycleField('authorization','Autorização do patrocinador (carta, e-mail ou chamado)','','text')+'</div>'+
    '<div id="farmaciaCycleMemoSponsor"><div class="section-label">Envio ao patrocinador</div><div class="form-grid">'+farmaciaCycleField('carrier','Transportadora','','text',true)+farmaciaCycleField('awb','AWB / conhecimento','','text',true)+farmaciaCycleField('packages','Volumes e lacres','','text',true)+farmaciaCycleField('logger','Registrador de temperatura','','text',true)+farmaciaCycleField('shipTo','Destino (depósito / endereço)','','text',true)+'</div></div>'+
    '<div id="farmaciaCycleMemoDisposal" hidden><div class="section-label">Destruição</div><div class="form-grid">'+farmaciaCycleField('company','Empresa responsável (licenciada)','','text')+farmaciaCycleField('method','Método','Incineração','text')+farmaciaCycleField('certificate','Nº do certificado de destruição / MTR (se já emitido)','','text',true)+'</div></div>'+
    '<div class="section-label">Lotes / kits do memorando</div><div id="farmaciaCycleGuideItems" class="farmacia-guide-items">'+(snapshot.items||[]).map(farmaciaCycleGuideItemHtml).join('')+'</div><button type="button" id="farmaciaCycleGuideAddButton" class="btn-txt farmacia-guide-add" onclick="farmaciaCycleGuideAdd()">'+farmaciaCycleIcon('add')+'Adicionar lote / kit</button>'+
    '<label class="farmacia-confirm"><input name="confirmed" type="checkbox" required>Conferi a contagem de cada item e a reconciliação com as dispensações e os retornos; o material permaneceu segregado até a saída.</label>'+
    '<p class="farmacia-cycle-help">Ao registrar, o memorando recebe um número e fica disponível para impressão e assinatura do farmacêutico. Registre a saída efetivamente realizada; a separação para destruição não comprova a destruição.</p>';
}
function farmaciaCycleMemoMode() {
  var f=document.getElementById('farmaciaCycleForm');if(!f||!f.elements.reasonCategory)return;
  var disposal=f.elements.destination.value==='disposal';
  f.elements.reason.required=f.elements.reasonCategory.value==='other';
  [['farmaciaCycleMemoSponsor',!disposal],['farmaciaCycleMemoDisposal',disposal]].forEach(function(entry){
    var box=document.getElementById(entry[0]);box.hidden=!entry[1];
    box.querySelectorAll('input').forEach(function(input){input.disabled=!entry[1];});
  });
}
function farmaciaCycleMemoPayload(form,snapshot) {
  var disposal=form.elements.destination.value==='disposal';
  var common={destination:form.elements.destination.value,reasonCategory:form.elements.reasonCategory.value,occurredOn:form.elements.occurredOn.value,authorization:form.elements.authorization.value,document:form.elements.document.value,reason:form.elements.reason.value};
  (disposal?['company','method','certificate']:['carrier','awb','packages','logger','shipTo']).forEach(function(key){common[key]=form.elements[key].value;});
  var items=Array.from(form.querySelectorAll('#farmaciaCycleGuideItems .farmacia-guide-item')).map(function(row){
    var item=farmaciaCycleGuideItem(row)||{};
    return {positionId:row.querySelector('[name="guidePosition"]').value,revision:item.revision||'',quantity:row.querySelector('[name="guideQuantity"]').valueAsNumber,
      from:row.querySelector('[name="guideFrom"]').value,condition:row.querySelector('[name="guideCondition"]').value,itemNote:row.querySelector('[name="guideNote"]').value};
  });
  return {studyId:snapshot.studyId,restricted:snapshot.restricted,requestId:snapshot.requestId,data:common,items:items};
}
// Lista: um memorando por linha (itens agrupados); destinações antigas, sem memorando, aparecem avulsas.
function farmaciaCycleMemoListHtml() {
  var groups=[],byKey={};
  farmaciaCycleRecords('destination').forEach(function(r){var key=r.data.memoId||r.id;if(!byKey[key]){byKey[key]=[];groups.push(byKey[key]);}byKey[key].push(r);});
  var button=farmaciaCycleCanOperate('destination')?farmaciaCycleButton('destination','Novo memorando','add'):'';
  var rows=groups.slice().reverse().map(function(list){
    var r=list[0],e=r.data;
    var items=list.map(function(item){var p=farmaciaCyclePosition(item.data.positionId),product=farmaciaCycleProduct(p)||{};return esc([product.name||'Produto histórico',p?'Lote '+p.lot:'',p&&p.kit?'Kit '+p.kit:'',farmaciaStockNumber(item.data.quantity)+' '+(product.unit||'')].filter(Boolean).join(' · '));}).join('<br>');
    return '<tr><td>'+esc(e.memoNumber||'Registro avulso')+'<small>'+esc(farmaciaStockDate(e.occurredOn))+'</small></td><td>'+esc(FARMACIA_DESTINATION_LABELS[e.destination]||e.destination)+'<small>'+esc(FARMACIA_DESTINATION_REASON_LABELS[e.reasonCategory]||e.reason||'')+'</small></td><td>'+items+'</td><td>'+esc(e.authorization||'—')+'</td><td>'+esc(r.author)+'</td><td>'+farmaciaDocumentButton(r.id,false,e.memoId?'Imprimir memorando':'')+'</td></tr>';
  }).join('');
  return farmaciaCycleHeading('Devolução e destruição','Medicamento que sai do IPS para o patrocinador ou para destruição, com memorando para assinatura do farmacêutico.',button)+'<div class="farmacia-cycle-panel">'+(rows?farmaciaTable(['Memorando / Data','Destinação / Motivo','Lotes / kits','Autorização','Responsável','Ações'],rows,'Devolução e destruição'):'<p class="farmacia-cycle-empty">Nenhuma devolução ou destruição registrada.</p>')+'</div>';
}
</script>
