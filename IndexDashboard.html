  <script>
  // ═══════════════════════════════════════════════════════════════
  //  DASHBOARD
  // ═══════════════════════════════════════════════════════════════
  var _dashInited = false;
  var _dashLoading = false;
  var _dashLoadedAt = 0;
  var _dashCharts = {};
  var _dashAgendaRaw = [];
  var _dashAgendaResumoAtual = {};
  var _dashAgendaPeriod = { tipo: 'ano', ano: new Date().getFullYear(), mes: new Date().getMonth() + 1 };
  var _dashKpiRecrutZeroKeys = {};
  var DASHBOARD_SESSION_CACHE_KEY = 'codexDashboardData:v3';
  var DASHBOARD_SESSION_CACHE_VERSION = '2026.10.07-transport-status-summary-v7';
  var DASHBOARD_SESSION_CACHE_TTL_MS = 5 * 60 * 1000;
  var DASH_CORES  = ['#1266f1','#0d47a1','#1976d2','#00796b','#2e7d32','#6a1b9a','#e65100','#c62828','#f9a825','#37474f','#546e7a','#4a148c','#00838f','#558b2f','#bf360c'];

  function dashboardLoadingState_(busy, message) {
    var page = document.getElementById('page-dashboard');
    var status = document.getElementById('dashLoadStatus');
    var btn = document.getElementById('btnDashRefresh');
    if (page && page.setAttribute) page.setAttribute('aria-busy', String(busy));
    if (status) status.textContent = message || '';
    if (btn) btn.disabled = busy;
  }

  function carregarDashboard(forcar) {
    if (_dashLoading) return;
    if (_dashInited && !forcar && Date.now() - _dashLoadedAt < DASHBOARD_SESSION_CACHE_TTL_MS) return;
    if (forcar) {
      try {
        if (window.sessionStorage) sessionStorage.removeItem(DASHBOARD_SESSION_CACHE_KEY);
      } catch (ignore) {}
    }
    if (!forcar && dashboardRenderFromSessionCache()) {
      _dashInited = true;
      return;
    }
    _dashLoading = true;
    var kpiEl = document.getElementById('dashKpis');
    if (kpiEl) {
      kpiEl.style.opacity = '.45';
      kpiEl.style.pointerEvents = 'none';
    }
    dashboardLoadingState_(true, 'Atualizando dados do Dashboard.');
    var perf = typeof codexStartClientReadPerformance_ === 'function' ? codexStartClientReadPerformance_('getDashboardData', forcar) : null;
    google.script.run
      .withSuccessHandler(function(d) {
        if (perf) perf.rpc(true);
        _dashLoading = false;
        try {
          if (kpiEl) { kpiEl.style.opacity = '1'; kpiEl.style.pointerEvents = ''; }
          _dashInited = perf ? perf.measure('render', function() { return renderDashboard(d || {}, perf); }) : renderDashboard(d || {});
          _dashLoadedAt = _dashInited ? Date.now() : 0;
          if (_dashInited) {
            if (perf) perf.measure('session_cache_write', function() { dashboardStoreSessionCache(d || {}); });
            else dashboardStoreSessionCache(d || {});
          }
          dashboardLoadingState_(false, _dashInited ? ((d && d.avisos || []).length ? 'Dados atualizados com avisos.' : 'Dados do Dashboard atualizados.') : 'Não foi possível atualizar os dados.');
        } catch(err) {
          _dashInited = false;
          if (kpiEl) { kpiEl.style.opacity = '1'; kpiEl.style.pointerEvents = ''; }
          dashboardLoadingState_(false, 'Não foi possível atualizar os dados.');
          mostrarErroDashboard(err);
        } finally {
          if (perf) perf.finish(_dashInited);
        }
      })
      .withFailureHandler(function(e) {
        if (perf) { perf.rpc(false); perf.finish(false); }
        _dashLoading = false;
        _dashInited = false;
        if (kpiEl) { kpiEl.style.opacity = '1'; kpiEl.style.pointerEvents = ''; }
        dashboardLoadingState_(false, 'Não foi possível atualizar os dados.');
        mostrarErroDashboard(e);
      })
      .getDashboardData(perf ? perf.request : {});
  }

  function dashboardRenderFromSessionCache() {
    try {
      if (!window.sessionStorage) return false;
      var raw = sessionStorage.getItem(DASHBOARD_SESSION_CACHE_KEY);
      if (!raw) return false;
      var cached = JSON.parse(raw);
      if (!cached || !cached.data) return false;
      var now = Date.now();
      var cachedAt = Number(cached.cachedAt || 0);
      var isExpired = !cachedAt || (now - cachedAt) > DASHBOARD_SESSION_CACHE_TTL_MS;
      if (cached.version !== DASHBOARD_SESSION_CACHE_VERSION || isExpired) {
        sessionStorage.removeItem(DASHBOARD_SESSION_CACHE_KEY);
        return false;
      }
      cached.data._dashboardCachedAt = cached.cachedAt || Date.now();
      var rendered = renderDashboard(cached.data);
      if (rendered) _dashLoadedAt = cachedAt;
      return rendered;
    } catch (e) {
      try { sessionStorage.removeItem(DASHBOARD_SESSION_CACHE_KEY); } catch (ignore) {}
      return false;
    }
  }

  function dashboardStoreSessionCache(data) {
    try {
      if (!window.sessionStorage) return;
      data = data || {};
      if (data.erros && data.erros.length) return;
      if (data.secoes && Object.keys(data.secoes).some(function(key) { return data.secoes[key] === false; })) {
        sessionStorage.removeItem(DASHBOARD_SESSION_CACHE_KEY);
        return;
      }
      data._dashboardCachedAt = Date.now();
      sessionStorage.setItem(DASHBOARD_SESSION_CACHE_KEY, JSON.stringify({
        version: DASHBOARD_SESSION_CACHE_VERSION,
        cachedAt: data._dashboardCachedAt,
        expiresAt: data._dashboardCachedAt + DASHBOARD_SESSION_CACHE_TTL_MS,
        data: data
      }));
    } catch (e) {}
  }

  function mostrarErroDashboard(msg) {
    var old = document.getElementById('dashErrorBox');
    if (old) old.remove();
    var page = document.getElementById('page-dashboard');
    if (!page) return;
    page.insertAdjacentHTML('afterbegin',
      '<div id="dashErrorBox" role="alert" style="background:#fce8e6;border:1.5px solid #f4b5b2;border-radius:10px;padding:16px;color:#b3261e;font-size:13px;margin-bottom:12px;white-space:pre-line">' +
      '<strong>Erro ao carregar dashboard:</strong> ' + esc(typeof appErrorMessage === 'function' ? appErrorMessage(msg) : msg) + '</div>');
  }

  function _agg(lista, campo) {
    var m = {};
    lista.forEach(function(item) {
      var v = (item[campo] || 'N/A').trim() || 'N/A';
      m[v] = (m[v] || 0) + 1;
    });
    return m;
  }

  function _sortDesc(obj) {
    return Object.keys(obj).sort(function(a,b){ return obj[b]-obj[a]; });
  }

  function _shortDashLabel(v) {
    v = String(v || 'N/A');
    return v.length > 30 ? v.slice(0, 27) + '...' : v;
  }

  function _topDashPairs(keys, map, limit) {
    var pairs = keys.map(function(k) { return { label: k, value: map[k] || 0 }; });
    if (pairs.length <= limit) return pairs;
    var head = pairs.slice(0, limit - 1);
    var rest = pairs.slice(limit - 1).reduce(function(sum, p) { return sum + p.value; }, 0);
    head.push({ label: 'Outros', value: rest });
    return head;
  }

  function _topDashResults(keys, map, topCount) {
    var pairs = keys.map(function(k) { return { label: k, value: map[k] || 0 }; });
    if (pairs.length <= topCount) return pairs;
    var head = pairs.slice(0, topCount);
    var rest = pairs.slice(topCount).reduce(function(sum, p) { return sum + p.value; }, 0);
    head.push({ label: 'Outros', value: rest });
    return head;
  }

  function _setChartHeight(canvasId, labelCount, perRow, minHeight, maxHeight) {
    var canvas = document.getElementById(canvasId);
    var wrap = canvas ? canvas.closest('.chart-wrap') : null;
    if (!wrap) return;
    var h = Math.max(minHeight || 220, Math.min(maxHeight || 520, (labelCount || 1) * (perRow || 26) + 72));
    wrap.style.height = h + 'px';
  }

  function _normDash(v) {
    return codexNormText(v);
  }

  function _isProjetoContaParticipantesDash(p) {
    var st = _normDash(p.status);
    return projetoEstaAtivo_(p) && st.indexOf('etapa regulatoria') === -1;
  }

  function _sameProjetoDash(partProjeto, proj) {
    var a = _normDash(partProjeto);
    return a && (a === _normDash(proj.nomeAbreviado) || a === _normDash(proj.codigo));
  }

  function _isParticipanteAtivoDash(p) {
    return _normDash(p && p.status) === 'ativo';
  }

  function _isParticipanteAtivoOuSeguimentoDash(p) {
    var st = _normDash(p && p.status);
    return st === 'ativo' || st === 'em seguimento';
  }

  function dashboardParticipantProjectStats(participantes) {
    var stats = {};
    (participantes || []).forEach(function(p) {
      var key = _normDash(p && p.projeto);
      if (!key) return;
      if (!stats[key]) stats[key] = { total: 0, ativos: 0, ativosStrict: 0 };
      stats[key].total++;
      if (_isParticipanteAtivoOuSeguimentoDash(p)) stats[key].ativos++;
      if (_isParticipanteAtivoDash(p)) stats[key].ativosStrict++;
    });
    return stats;
  }

  function dashboardParticipantCityPairs(participantes) {
    var cidadeMap = {};
    (participantes || []).filter(_isParticipanteAtivoDash).forEach(function(p) {
      var cidade = String(p.cidade || '').trim();
      if (!cidade) return;
      var estado = String(p.estado || '').trim().toUpperCase();
      var label = cidade + (estado ? '/' + estado : '');
      cidadeMap[label] = (cidadeMap[label] || 0) + 1;
    });
    return _topDashResults(_sortDesc(cidadeMap), cidadeMap, 15);
  }

  function dashboardProjectStat(stats, proj, field) {
    var keys = {};
    var nome = _normDash(proj && proj.nomeAbreviado);
    var codigo = _normDash(proj && proj.codigo);
    if (nome) keys[nome] = true;
    if (codigo) keys[codigo] = true;
    return Object.keys(keys).reduce(function(sum, key) {
      return sum + ((stats[key] && stats[key][field]) || 0);
    }, 0);
  }

  function _dashStoreProjetoKeys(map, proj) {
    var nome = _normDash(proj && proj.nomeAbreviado);
    var codigo = _normDash(proj && proj.codigo);
    if (nome) map[nome] = true;
    if (codigo) map[codigo] = true;
  }

  function _dashBindKpi(valueId, target, label) {
    var valueEl = document.getElementById(valueId);
    var card = valueEl ? valueEl.closest('.dash-kpi') : null;
    if (!card || card.dataset.dashTarget === target) return;
    card.dataset.dashTarget = target;
    card.classList.add('dash-kpi-clickable');
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.setAttribute('title', 'Abrir registros: ' + label);
    card.onclick = function() { dashOpenKpi(target); };
    card.onkeydown = function(ev) {
      if (ev.key === 'Enter' || ev.key === ' ') {
        ev.preventDefault();
        dashOpenKpi(target);
      }
    };
  }

  function bindDashboardKpiClicks() {
    _dashBindKpi('kpiProjetos', 'projetosAtivos', 'Projetos Ativos');
    _dashBindKpi('kpiPart', 'participantes', 'Participantes');
    _dashBindKpi('kpiAtivos', 'participantesAtivos', 'Participantes Ativos / Seguimento');
    _dashBindKpi('kpiZeroRecrut', 'recrutZero', 'Recrutamento aberto sem participantes ativos');
  }

  function dashWaitAndApply(page, applyFn) {
    if (typeof irPara === 'function') irPara(page);
    var attempts = 0;
    function retry() {
      attempts++;
      if (applyFn()) return;
      if (attempts < 30) setTimeout(retry, 120);
    }
    setTimeout(retry, 120);
  }

  function dashClearProjetoInputs() {
    var search = document.getElementById('searchProjetos');
    var status = document.getElementById('filterStatusProj');
    if (search) search.value = '';
    if (status) status.value = '';
  }

  function dashClearParticipanteInputs() {
    var search = document.getElementById('searchParticipantes');
    var status = document.getElementById('filterStatusPar');
    if (search) search.value = '';
    if (status) status.value = '';
  }

  function dashListIsLoading(bodyId) {
    var body = document.getElementById(bodyId);
    return !!(body && body.querySelector('.loading-row'));
  }

  function dashOpenMainWithFilter(page, filtro, keys) {
    if (typeof isEmbeddedModuleEnabled === 'function' && isEmbeddedModuleEnabled('dashboard') && typeof abrirModuloPrincipal === 'function') {
      var query = 'dashFiltro=' + encodeURIComponent(filtro || '');
      if (keys) query += '&dashKeys=' + encodeURIComponent(keys);
      abrirModuloPrincipal(page, query);
      return true;
    }
    return false;
  }

  function dashRecrutZeroKeysParam() {
    return Object.keys(_dashKpiRecrutZeroKeys || {}).join('|');
  }

  function dashOpenKpi(target) {
    if (target === 'projetosAtivos') {
      if (dashOpenMainWithFilter('projetos', target)) return;
      dashWaitAndApply('projetos', function() {
        if (dashListIsLoading('bodyProjetos')) return false;
        if (typeof renderTabelaProj !== 'function' || typeof _projetos === 'undefined' || !Array.isArray(_projetos)) return false;
        dashClearProjetoInputs();
        renderTabelaProj(_projetos.filter(projetoEstaAtivo_));
        return true;
      });
      return;
    }
    if (target === 'participantes') {
      if (dashOpenMainWithFilter('participantes', target)) return;
      dashWaitAndApply('participantes', function() {
        if (dashListIsLoading('bodyParticipantes')) return false;
        if (typeof filtrarParticipantes !== 'function' || typeof _participantes === 'undefined' || !Array.isArray(_participantes)) return false;
        dashClearParticipanteInputs();
        filtrarParticipantes();
        return true;
      });
      return;
    }
    if (target === 'participantesAtivos') {
      if (dashOpenMainWithFilter('participantes', target)) return;
      dashWaitAndApply('participantes', function() {
        if (dashListIsLoading('bodyParticipantes')) return false;
        if (typeof renderTabelaPart !== 'function' || typeof _participantes === 'undefined' || !Array.isArray(_participantes)) return false;
        dashClearParticipanteInputs();
        renderTabelaPart(_participantes.filter(function(p) {
          var st = _normDash(p.status);
          return st === 'ativo' || st === 'em seguimento';
        }));
        return true;
      });
      return;
    }
    if (target === 'recrutZero') {
      if (dashOpenMainWithFilter('projetos', target, dashRecrutZeroKeysParam())) return;
      dashWaitAndApply('projetos', function() {
        if (dashListIsLoading('bodyProjetos')) return false;
        if (typeof renderTabelaProj !== 'function' || typeof _projetos === 'undefined' || !Array.isArray(_projetos)) return false;
        var keys = _dashKpiRecrutZeroKeys || {};
        dashClearProjetoInputs();
        renderTabelaProj(_projetos.filter(function(p) {
          return !!(keys[_normDash(p.nomeAbreviado)] || keys[_normDash(p.codigo)]);
        }));
        return true;
      });
    }
  }

  function dashOpenCoordinator(coordenador) {
    coordenador = String(coordenador || '').trim();
    if (!coordenador || coordenador === 'N/A' || coordenador === 'Outros') return;
    if (dashOpenMainWithFilter('projetos', 'coordenador', coordenador)) return;
    dashWaitAndApply('projetos', function() {
      if (dashListIsLoading('bodyProjetos')) return false;
      if (typeof renderTabelaProj !== 'function' || typeof _projetos === 'undefined' || !Array.isArray(_projetos)) return false;
      var search = document.getElementById('searchProjetos');
      if (search) search.value = coordenador;
      renderTabelaProj(_projetos.filter(function(p) {
        return _normDash(p && p.coordenador) === _normDash(coordenador);
      }));
      return true;
    });
  }

  function _destroyChart(id) {
    if (_dashCharts[id]) { _dashCharts[id].destroy(); delete _dashCharts[id]; }
  }

  function _doughnut(canvasId, labels, data) {
    _destroyChart(canvasId);
    var ctx = document.getElementById(canvasId).getContext('2d');
    var total = data.reduce(function(sum, v) { return sum + Number(v || 0); }, 0);
    var displayLabels = labels.map(function(label, idx) {
      var pct = total ? (Number(data[idx] || 0) * 100 / total).toFixed(1).replace('.', ',') : '0,0';
      return label + ': ' + data[idx] + ' (' + pct + '%)';
    });
    _dashCharts[canvasId] = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: displayLabels,
        datasets: [{ data: data, backgroundColor: DASH_CORES.slice(0, data.length),
          borderWidth: 2, borderColor: '#fff', hoverOffset: 6 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'right', labels: { font: { size: 11, family: 'Roboto' }, padding: 12, boxWidth: 12 } },
          tooltip: { callbacks: { label: function(c){ return ' ' + c.label; } } }
        },
        cutout: '62%'
      }
    });
    dashboardChartData_(canvasId, labels, [{ label: 'Projetos', data: data }]);
  }

  function dashboardChartData_(canvasId, labels, datasets, onRowClick, emptyMessage) {
    var canvas = document.getElementById(canvasId);
    var wrap = canvas && canvas.closest ? canvas.closest('.chart-wrap') : null;
    if (!wrap || !document.createElement) return;
    var details = document.getElementById(canvasId + 'Data');
    var signature = JSON.stringify([labels, datasets.map(function(ds) { return [ds.label, ds.data]; }),
      dashboardPrintChartTitleText(dashboardChartTitleElement(canvas)), emptyMessage || '', Boolean(onRowClick)]);
    if (details && details._dashboardDataSignature === signature && details._dashboardRowClick === onRowClick) return;
    if (!details) {
      details = document.createElement('details');
      details.id = canvasId + 'Data';
      details.className = 'dash-chart-data';
      wrap.insertAdjacentElement('afterend', details);
    }
    details._dashboardDataSignature = signature;
    details._dashboardRowClick = onRowClick;
    var wasOpen = details.open;
    details.textContent = '';
    var summary = document.createElement('summary');
    summary.textContent = 'Ver dados do gráfico';
    details.appendChild(summary);
    if (!labels.length) {
      var message = document.createElement('p');
      message.textContent = emptyMessage || 'Sem dados disponíveis';
      details.appendChild(message);
      details.open = wasOpen;
      return;
    }
    var table = document.createElement('table');
    var caption = document.createElement('caption');
    caption.textContent = dashboardPrintChartTitleText(dashboardChartTitleElement(canvas));
    table.appendChild(caption);
    var head = document.createElement('thead');
    var header = document.createElement('tr');
    ['Categoria'].concat(datasets.map(function(ds) { return ds.label || 'Quantidade'; })).forEach(function(label) {
      var th = document.createElement('th');
      th.scope = 'col';
      th.textContent = label;
      header.appendChild(th);
    });
    head.appendChild(header);
    table.appendChild(head);
    var body = document.createElement('tbody');
    labels.forEach(function(label, idx) {
      var row = document.createElement('tr');
      var name = document.createElement('th');
      name.scope = 'row';
      if (onRowClick && label !== 'Outros' && label !== 'N/A') {
        var button = document.createElement('button');
        button.type = 'button';
        button.textContent = label;
        button.setAttribute('aria-label', 'Abrir projetos do coordenador ' + label);
        button.addEventListener('click', function() { onRowClick(label); });
        name.appendChild(button);
      } else name.textContent = label;
      row.appendChild(name);
      datasets.forEach(function(ds) {
        var value = document.createElement('td');
        value.textContent = String(ds.data[idx] == null ? 0 : ds.data[idx]);
        row.appendChild(value);
      });
      body.appendChild(row);
    });
    table.appendChild(body);
    details.appendChild(table);
    details.open = wasOpen;
  }

  function _barH(canvasId, labels, datasets, onBarClick, stacked) {
    var canvas = document.getElementById(canvasId);
    if (!canvas) return;
    var chart = _dashCharts[canvasId];
    var fullLabels = labels.slice();
    var displayLabels = labels.map(_shortDashLabel);
    var config = {
      type: 'bar',
      data: { labels: displayLabels, datasets: datasets },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false, animation: false,
        onClick: onBarClick ? function(event, elements) {
          if (!elements || !elements.length) return;
          onBarClick(fullLabels[elements[0].index] || '');
        } : undefined,
        onHover: onBarClick ? function(event, elements) {
          var target = event && event.native && event.native.target;
          if (target) target.style.cursor = elements && elements.length ? 'pointer' : 'default';
        } : undefined,
        plugins: {
          legend: { display: datasets.length > 1,
            labels: { font: { size: 11, family: 'Roboto' }, padding: 10, boxWidth: 12 } },
          tooltip: {
            mode: stacked ? 'index' : 'nearest', intersect: !stacked,
            callbacks: {
              title: function(items) {
                var idx = items && items.length ? items[0].dataIndex : 0;
                return fullLabels[idx] || '';
              },
              footer: stacked ? function(items) {
                var idx = items && items.length ? items[0].dataIndex : 0;
                return 'Total: ' + datasets.reduce(function(total, ds) { return total + Number(ds.data[idx] || 0); }, 0);
              } : undefined
            }
          }
        },
        scales: {
          x: { stacked: !!stacked, beginAtZero: true, ticks: { stepSize: 1, font: { size: 11 } }, grid: { color: '#f0f4f8' } },
          y: { stacked: !!stacked, ticks: { autoSkip: false, font: { size: 11, family: 'Roboto' } }, grid: { display: false } }
        }
      }
    };
    if (chart && chart.config && chart.config.type === 'bar' && typeof chart.update === 'function') {
      chart.data = config.data;
      chart.options = config.options;
      chart.update('none');
    } else {
      _destroyChart(canvasId);
      _dashCharts[canvasId] = new Chart(canvas.getContext('2d'), config);
    }
    var tableDatasets = stacked ? datasets.concat([{ label: 'Total', data: fullLabels.map(function(label, idx) {
      return datasets.reduce(function(total, ds) { return total + Number(ds.data[idx] || 0); }, 0);
    }) }]) : datasets;
    dashboardChartData_(canvasId, fullLabels, tableDatasets, onBarClick);
  }

  function renderDashboard(d, perf) {
    var oldError = document.getElementById('dashErrorBox');
    if (oldError) oldError.remove();
    Object.keys(_dashCharts).forEach(_destroyChart);
    if (d.erros && d.erros.length) {
      Array.prototype.forEach.call(document.querySelectorAll('#page-dashboard canvas[id]'), function(canvas) {
        dashboardDrawEmptyChart_(canvas, 'Dados indisponíveis');
      });
      ['kpiProjetos', 'kpiPart', 'kpiAtivos', 'kpiZeroRecrut'].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.textContent = '—';
      });
      ['dashAgendaBlock', 'dashEstoqueBlock'].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.style.display = 'none';
      });
      mostrarErroDashboard(d.erros.join('\n'));
      return false;
    }
    if (typeof Chart === 'undefined') {
      Array.prototype.forEach.call(document.querySelectorAll('#page-dashboard canvas[id]'), function(canvas) {
        dashboardDrawEmptyChart_(canvas, 'Gráfico indisponível');
      });
      mostrarErroDashboard('Chart.js não carregou. Verifique a conexão com a internet e recarregue a página.');
      return false;
    }
    // Restaura as dimensões antes de criar gráficos após uma falha parcial.
    dashboardSectionAvailability_('dashAgendaBlock', true);
    dashboardSectionAvailability_('dashEstoqueBlock', true);
    var proj = d.projetos || [];
    var part = d.participantes || [];
    var partResumo = d.participantesResumo;
    var est = d.estoqueResumo || {};
    var projetosAtivos = proj.filter(projetoEstaAtivo_);
    var projetosPart = proj.filter(_isProjetoContaParticipantesDash);
    var partProjetoStats = partResumo ? partResumo.porProjeto : dashboardParticipantProjectStats(part);
    var ativosCount = partResumo ? partResumo.ativos : part.reduce(function(total, p) {
      return total + (_isParticipanteAtivoOuSeguimentoDash(p) ? 1 : 0);
    }, 0);
    var recrutAberto = projetosAtivos.filter(function(p) { return _normDash(p.status).indexOf('recrutamento aberto') >= 0; });
    var recrutZero = recrutAberto.filter(function(pr) {
      return dashboardProjectStat(partProjetoStats, pr, 'ativosStrict') === 0;

  function dashAgendaTransportPairs_(map, limit) {
    var pairs = Object.keys(map).map(function(label) {
      var counts = map[label];
      var pair = { label: label, value: counts.realizados + counts.previstos, realizados: counts.realizados, previstos: counts.previstos };
      if (counts.semClassificacao) { pair.semClassificacao = counts.semClassificacao; pair.value += counts.semClassificacao; }
      return pair;
    }).sort(function(a, b) { return b.value - a.value || a.label.localeCompare(b.label); });
    if (pairs.length <= limit) return pairs;
    var other = { label: 'Outros', value: 0, realizados: 0, previstos: 0 };
    pairs.slice(limit - 1).forEach(function(pair) {
      other.value += pair.value; other.realizados += pair.realizados; other.previstos += pair.previstos;
      if (pair.semClassificacao) other.semClassificacao = (other.semClassificacao || 0) + pair.semClassificacao;
    });
    return pairs.slice(0, limit - 1).concat([other]);

  // O contrato atual já traz o recorte calculado. Eventos são fallback de respostas legadas.
  function dashboardAggregateAgendaPeriod_() {
    var periodos = _dashAgendaResumoAtual && _dashAgendaResumoAtual.periodos;
    if (periodos && periodos.version === 1) {
      if (_dashAgendaPeriod.tipo === 'global') return periodos.global;
      var key = String(_dashAgendaPeriod.ano);
      var data = _dashAgendaPeriod.tipo === 'mes' ? periodos.meses[key + '-' + Number(_dashAgendaPeriod.mes)] : periodos.anos[key];
      return data || { total: 0, visits: 0, labs: 0, participants: 0, monitoringDays: 0, visitsBuckets: [], labBuckets: [],
        protocols: [], monitoring: [], doctors: [], cancellations: [], couriers: [], transportLabs: [],
        days: ['Dom','Seg','Ter','Qua','Qui','Sex','Sab'].map(function(label) { return { label: label, value: 0 }; }) };
    }
    var visits = Object.create(null), labs = Object.create(null), participants = Object.create(null);
    var protocols = Object.create(null), doctors = Object.create(null), monitoringDays = Object.create(null);
    var monitoring = Object.create(null), cancellations = Object.create(null), couriers = Object.create(null), transportLabs = Object.create(null);
    var days = ['Dom','Seg','Ter','Qua','Qui','Sex','Sab'].map(function(label) { return { label: label, value: 0 }; });
    var months = dashAgendaMonthNames();
    var today = new Date();
    today.setHours(23, 59, 59, 999);
    var result = { total: 0, visits: 0, labs: 0 };
    function add(map, key) { map[key] = (map[key] || 0) + 1; }
    function addTransport(map, key, kind) {
      if (!map[key]) map[key] = { realizados: 0, previstos: 0 };
      map[key][kind] = (map[key][kind] || 0) + 1;
    }
    (_dashAgendaRaw || []).forEach(function(r) {
      if (_dashAgendaPeriod.tipo !== 'global' && Number(r.ano || 0) !== Number(_dashAgendaPeriod.ano)) return;
      if (_dashAgendaPeriod.tipo === 'mes' && Number(r.mes || 0) !== Number(_dashAgendaPeriod.mes)) return;
      result.total++;
      var date = r.dataIso ? new Date(String(r.dataIso) + 'T12:00:00') : null;
      var validDate = date && !isNaN(date.getTime());
      var future = validDate && date.getTime() > today.getTime();
      var project = r.projeto || 'Sem protocolo';
      var bucket = _dashAgendaPeriod.tipo === 'global' ? String(r.ano || '-') : months[Number(r.mes || 1) - 1];
      if (AgendaRules.countsIn(r, AgendaRules.Indicator.DASHBOARD_COMPLETED_VISITS) && !future) {
        result.visits++;
        add(visits, bucket);
        add(protocols, project);
        add(doctors, r.medico || 'Sem medico');
        var key = String(r.participanteKey || '').trim();
        if (key) participants[key] = 1;
        if (validDate) days[date.getDay()].value++;
      }
      if (AgendaRules.countsIn(r, AgendaRules.Indicator.DASHBOARD_LAB_CENTRAL) && !future) {
        result.labs++;
        add(labs, bucket);
      }
      if (AgendaRules.countsIn(r, AgendaRules.Indicator.DASHBOARD_MONITORING)) {
        var dayKey = project + '|' + (r.dataIso || '');
        if (!monitoringDays[dayKey]) { monitoringDays[dayKey] = 1; add(monitoring, project); }
      }
      if (AgendaRules.countsIn(r, AgendaRules.Indicator.DASHBOARD_CANCELLATIONS_RESCHEDULES)) add(cancellations, project);
      var legacyTransport = AgendaRules.countsIn(r, AgendaRules.Indicator.DASHBOARD_COMPLETED_TRANSPORT) && !future && AgendaRules.isLabCentral(r);
      if (Array.isArray(r.transportes)) {
        if (AgendaRules.hasTransportOperation(r) && AgendaRules.isLabCentral(r) && !AgendaRules.isCancelled(r) && !AgendaRules.isRescheduled(r)) {
          r.transportes.forEach(function(t) {
            var kind = t.realizado ? 'realizados' : 'previstos';
            addTransport(couriers, t.courier, kind); addTransport(transportLabs, t.destino, kind);
          });
        }
      } else if (legacyTransport) {
        (r.couriers || []).forEach(function(name) {
          if (name) addTransport(couriers, /^pinex\s*\(agendamento\)$/i.test(name.trim()) ? 'Pinex' : name, 'semClassificacao');
        });
      }
    });
    function buckets(map) {
      return Object.keys(map).sort(function(a, b) {
        return _dashAgendaPeriod.tipo === 'global' ? Number(a) - Number(b) : months.indexOf(a) - months.indexOf(b);
      }).map(function(label) { return { label: label, value: map[label] }; });
    }
    result.participants = Object.keys(participants).length;
    result.monitoringDays = Object.keys(monitoringDays).length;
    result.visitsBuckets = buckets(visits);
    result.labBuckets = buckets(labs);
    result.days = days;
    result.protocols = dashAgendaPairs(protocols, 15);
    result.monitoring = dashAgendaPairs(monitoring, 15);
    result.doctors = dashAgendaPairs(doctors, 12);
    result.cancellations = dashAgendaPairs(cancellations, 15);
    result.couriers = dashAgendaTransportPairs_(couriers, 12);
    result.transportLabs = dashAgendaTransportPairs_(transportLabs, 12);
    return result;
  }

    if (mesCards) {
      mesCards.innerHTML = visitasPeriodo.map(function(m) {
        return '<div class="dash-kpi">' +
          '<div class="dash-kpi-val">' + (m.value || 0) + '</div>' +
          '<div class="dash-kpi-lbl">' + esc(m.label || '-') + '</div>' +
        '</div>';
      }).join('');
    }
    function labels(arr) { return (arr || []).map(function(p) { return p.label; }); }
    function values(arr) { return (arr || []).map(function(p) { return p.value || 0; }); }
    if (dashAgendaDetailsOpen_()) {
    if (visitasPeriodo.length) {
      _setChartHeight('chartAgendaVisitasMes', visitasPeriodo.length, 20, 220, 320);
      _barH('chartAgendaVisitasMes', labels(visitasPeriodo), [{ label: 'Visitas', data: values(visitasPeriodo), backgroundColor: 'rgba(18,102,241,.72)', borderRadius: 4 }]);
    } else dashboardDrawEmptyChart_(document.getElementById('chartAgendaVisitasMes'), 'Sem dados para o período selecionado');
    if (labPeriodo.length) {
      _setChartHeight('chartAgendaLabMes', labPeriodo.length, 20, 220, 320);
      _barH('chartAgendaLabMes', labels(labPeriodo), [{ label: 'Lab Central', data: values(labPeriodo), backgroundColor: 'rgba(0,121,107,.72)', borderRadius: 4 }]);
    } else dashboardDrawEmptyChart_(document.getElementById('chartAgendaLabMes'), 'Sem dados para o período selecionado');

    var dias = aggregate ? aggregate.days : (ag.visitasPorDiaSemana ||
      ['Dom','Seg','Ter','Qua','Qui','Sex','Sab'].map(function(label) { return { label: label, value: 0 }; }));
    if (dias.length) {
      _setChartHeight('chartAgendaDiaSemana', dias.length, 28, 220, 320);
      _barH('chartAgendaDiaSemana', labels(dias), [{ label: 'Visitas', data: values(dias), backgroundColor: DASH_CORES.slice(0, 7), borderRadius: 4 }]);
    }
    }

    renderDashboardAgendaPeriodCharts(aggregate);
  }

  function renderDashboardAgenda(ag) {
    ag = ag || {};
    _dashAgendaResumoAtual = ag;
    _dashAgendaRaw = ag.eventosPeriodo || [];
    setupDashAgendaPeriodControls();
    renderDashboardAgendaPeriodoResumo();
  }

  function renderDashboardEstoque(est) {
    est = est || {};
    var ids = {
      dashEstLotes: est.lotes || 0,
      dashEstOk: est.ok || 0,
      dashEstBaixo: est.baixo || 0,
      dashEstVencidos: est.vencidos || 0,
      dashEstProximos: est.proximosValidade || 0
    };
    Object.keys(ids).forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.textContent = ids[id];
    });
  }


  (function() {
    function _attachDashEvents() {
      var btn = document.getElementById('btnDashRefresh');
      if (btn) { btn.addEventListener('click', function() { _dashInited = false; carregarDashboard(true); }); }
      var printBtn = document.getElementById('btnDashPrint');
      if (printBtn) { printBtn.addEventListener('click', imprimirDashboard); }
      var pg = document.getElementById('page-dashboard');
      if (pg) {
        new MutationObserver(function(muts) {
          muts.forEach(function(m) {
            if (m.attributeName === 'class' && pg.classList.contains('active')) carregarDashboard(false);
          });
        }).observe(pg, { attributes: true, attributeFilter: ['class'] });
      }
      bindDashboardChartCopyButtons();
      var agendaDetails = document.getElementById('dashAgendaAtendimentos');
      if (agendaDetails) agendaDetails.addEventListener('toggle', function() {
        if (agendaDetails.open) renderDashboardAgendaPeriodoResumo();
      });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', _attachDashEvents);
    else _attachDashEvents();
  })();

  function imprimirDashboard() {
    var page = document.getElementById('page-dashboard');
    if (!page) return;
    var html = dashboardPrintHtml();
    var w = window.open('', '_blank');
    if (!w) {
      snack('O navegador bloqueou a janela de impressão.');
      return;
    }
    w.document.open();
    w.document.write(html);
    w.document.close();
  }

  function dashboardPrintHtml() {
    var details = document.getElementById('dashAgendaAtendimentos');
    var wasOpen = details && details.open;
    try {
      if (details && !wasOpen) { details.open = true; renderDashboardAgendaPeriodoResumo(); }
      return dashboardPrintHtmlContent_();
    } finally {
      if (details && !wasOpen) details.open = false;
    }
  }

  function dashboardPrintHtmlContent_() {
    var emitted = new Date().toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
    return '<!doctype html><html><head><meta charset="utf-8"><title>Dashboard Gerencial</title>' +
      '<style>' +
      '@page{size:A4 landscape;margin:8mm}' +
      '*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#1f2937;margin:0;background:#fff}.no-print{position:fixed;right:12px;top:12px;border:1px solid #c5d5fb;background:#1266f1;color:#fff;border-radius:6px;padding:8px 12px;font-weight:700;cursor:pointer;z-index:2}' +
      '.head{display:flex;align-items:center;gap:14px;border-bottom:2px solid #1266f1;padding:0 0 8px;margin-bottom:10px}.head img{height:34px;width:auto;object-fit:contain}.brand-text{font-weight:800;color:#1266f1;font-size:18px}.head h1{font-size:18px;margin:0;color:#0b3f8a}.head p{font-size:10px;color:#64748b;margin:2px 0 0}' +
      '.section{margin:0 0 10px;break-inside:avoid}.section-title{font-size:9px;text-transform:uppercase;letter-spacing:.7px;color:#475569;font-weight:800;margin:0 0 5px}.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.kpi{border:1px solid #d8e2f0;border-radius:6px;padding:7px 8px;background:#f8fbff;min-height:42px}.kpi-value{font-size:18px;line-height:1;font-weight:800;color:#0b3f8a;margin-bottom:3px}.kpi-label{font-size:7.8px;text-transform:uppercase;letter-spacing:.45px;color:#64748b;font-weight:800}' +
      '.charts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.chart{border:1px solid #d8e2f0;border-radius:6px;padding:7px;break-inside:avoid;background:#fff}.chart h2{font-size:8.5px;text-transform:uppercase;letter-spacing:.55px;color:#475569;margin:0 0 5px}.chart img{display:block;width:100%;height:42mm;object-fit:contain}.empty{border:1px dashed #cbd5e1;border-radius:6px;color:#94a3b8;font-size:11px;padding:18px;text-align:center}' +
      '@media print{body{margin:0}.no-print{display:none}.chart,.section{break-inside:avoid}}' +
      '</style></head><body><button class="no-print" onclick="window.print()">Imprimir</button>' +
      dashboardPrintHeader(emitted) +
      dashboardPrintKpiSection('Resumo geral', '#dashKpis > .dash-kpi') +
      dashboardPrintAgendaKpis() +
      dashboardPrintKpiSection('Indicadores de Estoque', '#dashEstoqueBlock .dash-kpi') +
      dashboardPrintCharts() +
      '<script>window.onload=function(){setTimeout(function(){window.print();},350);};<\/script></body></html>';
  }

  function dashboardPrintHeader(emitted) {
    var logo = (typeof getPatientDisplayLogoSrc === 'function' ? getPatientDisplayLogoSrc() : '') || ((document.querySelector('.nav-brand img') || {}).src || '');
    var logoHtml = logo ? '<img src="' + esc(logo) + '" alt="IPS | UCS">' : '<div class="brand-text">IPS | UCS</div>';
    return '<div class="head">' + logoHtml + '<div><h1>Dashboard Gerencial</h1><p>Emitido em ' + esc(emitted || '') + ' · IPS | UCS</p></div></div>';
  }

  function dashboardPrintKpiSection(title, selector) {
    var cards = Array.prototype.slice.call(document.querySelectorAll(selector || '')).filter(function(el) {
      return dashboardPrintVisible(el) && !el.closest('#dashAgendaMesCards');
    }).map(dashboardPrintKpiCard).join('');
    if (!cards) return '';
    return '<div class="section"><div class="section-title">' + esc(title || '') + '</div><div class="kpi-grid">' + cards + '</div></div>';
  }

  function dashboardPrintAgendaKpis() {
    var block = document.getElementById('dashAgendaBlock');
    if (!dashboardPrintVisible(block)) return '';
    var cards = Array.prototype.slice.call(block.querySelectorAll('.dash-kpi')).filter(function(el) {
      return dashboardPrintVisible(el) && !el.closest('#dashAgendaMesCards');
    }).map(dashboardPrintKpiCard).join('');
    if (!cards) return '';
    var period = block.getAttribute('data-dashboard-available') === '0' ? 'Dados indisponíveis' : dashAgendaPeriodoLabel();
    return '<div class="section"><div class="section-title">Indicadores da Agenda · ' + esc(period) + '</div><div class="kpi-grid">' + cards + '</div></div>';
  }

  function dashboardPrintKpiCard(el) {
    var valueEl = el.querySelector('.dash-kpi-val');
    var labelEl = el.querySelector('.dash-kpi-lbl');
    return '<div class="kpi"><div class="kpi-value">' + esc(dashboardPrintText(valueEl)) + '</div><div class="kpi-label">' + esc(dashboardPrintText(labelEl)) + '</div></div>';
  }

  function dashboardPrintCharts() {
    var charts = Array.prototype.slice.call(document.querySelectorAll('#page-dashboard canvas')).filter(function(canvas) {
      return dashboardPrintVisible(canvas) && canvas.width && canvas.height;
    }).map(function(canvas) {
      var title = dashboardPrintCanvasTitle(canvas);
      var img = '';
      try { img = canvas.toDataURL('image/png'); } catch(e) { img = ''; }
      if (!img) return '';
      return '<div class="chart"><h2>' + esc(title || 'Indicador') + '</h2><img src="' + img + '" alt="' + esc(title || 'Indicador') + '"></div>';
    }).filter(Boolean).join('');
    if (!charts) return '<div class="empty">Nenhum gráfico disponível para impressão.</div>';
    return '<div class="section"><div class="section-title">Gráficos</div><div class="charts">' + charts + '</div></div>';
  }

  function dashboardPrintCanvasTitle(canvas) {
    var directTitle = dashboardChartTitleElement(canvas);
    var directText = dashboardPrintChartTitleText(directTitle);
    if (directText) return directText;
    var node = canvas;
    for (var i = 0; i < 6 && node; i++, node = node.parentElement) {
      var title = node.querySelector ? node.querySelector('.chart-card-title') : null;
      var titleValue = dashboardPrintChartTitleText(title);
      if (title && title !== canvas && titleValue) return titleValue;
      var prev = node.previousElementSibling;
      while (prev) {
        var previousValue = prev.classList && prev.classList.contains('chart-card-title')
          ? dashboardPrintChartTitleText(prev)
          : '';
        if (previousValue) return previousValue;
        prev = prev.previousElementSibling;
      }
    }
    return 'Indicador';
  }

  function dashboardPrintChartTitleText(title) {
    if (!title) return '';
    var explicitText = title.querySelector ? title.querySelector('.dash-chart-title-text') : null;
    if (explicitText && dashboardPrintText(explicitText)) {
      return dashboardPrintText(explicitText).replace(/^[^\wÀ-ÿ]+/, '');
    }
    var cleanTitle = title.cloneNode ? title.cloneNode(true) : null;
    if (!cleanTitle) return '';
    Array.prototype.slice.call(cleanTitle.querySelectorAll('.material-symbols-outlined, .dash-chart-copy')).forEach(function(el) {
      el.remove();
    });
    return dashboardPrintText(cleanTitle).replace(/^[^\wÀ-ÿ]+/, '');
  }

  function dashboardPrintText(el) {
    return String((el && el.textContent) || '').replace(/\s+/g, ' ').trim();
  }

  function dashboardPrintVisible(el) {
    if (!el) return false;
    var style = window.getComputedStyle(el);
    return style.display !== 'none' && style.visibility !== 'hidden' && el.offsetWidth > 0 && el.offsetHeight > 0;
  }

  function copiarGraficoDashboard(canvasId, button) {
    var canvas = document.getElementById(canvasId);
    if (!canvas || !canvas.width || !canvas.height) {
      dashboardCopyChartFeedback(button, false, 'Gráfico indisponível.');
      return Promise.resolve(false);
    }
    if (!navigator.clipboard || !navigator.clipboard.write || typeof ClipboardItem === 'undefined') {
      dashboardCopyChartFeedback(button, false, 'Este navegador não permite copiar imagens.');
      return Promise.resolve(false);
    }

    var copyCanvas = document.createElement('canvas');
    copyCanvas.width = canvas.width;
    copyCanvas.height = canvas.height;
    var ctx = copyCanvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, copyCanvas.width, copyCanvas.height);
    ctx.drawImage(canvas, 0, 0);
    if (button) button.disabled = true;

    return new Promise(function(resolve) {
      copyCanvas.toBlob(function(blob) {
        if (!blob) {
          dashboardCopyChartFeedback(button, false, 'Não foi possível preparar o gráfico.');
          resolve(false);
          return;
        }
        navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(function() {
          dashboardCopyChartFeedback(button, true, 'Gráfico copiado.');
          resolve(true);
        }, function() {
          dashboardCopyChartFeedback(button, false, 'Não foi possível copiar o gráfico.');
          resolve(false);
        });
      }, 'image/png');
    });
  }

  function dashboardChartTitleElement(canvas) {
    var wrap = canvas && canvas.closest ? canvas.closest('.chart-wrap') : null;
    var node = wrap ? wrap.previousElementSibling : null;
    while (node) {
      if (node.classList && node.classList.contains('chart-card-title')) return node;
      node = node.previousElementSibling;
    }
    return null;
  }

  function dashboardChartTitleTextElement(title) {
    var current = title ? title.querySelector('.dash-chart-title-text') : null;
    if (current) return current;
    var label = document.createElement('span');
    label.className = 'dash-chart-title-text';
    Array.prototype.slice.call(title.childNodes).forEach(function(node) {
      var isIcon = node.nodeType === 1 && node.classList && node.classList.contains('material-symbols-outlined');
      var isButton = node.nodeType === 1 && node.classList && node.classList.contains('dash-chart-copy');
      if (!isIcon && !isButton && (node.nodeType !== 3 || String(node.textContent || '').trim())) label.appendChild(node);
    });
    var icon = title.querySelector('.material-symbols-outlined');
    if (icon && icon.nextSibling) title.insertBefore(label, icon.nextSibling);
    else title.appendChild(label);
    return label;
  }

  function bindDashboardChartCopyButtons() {
    var canvases = document.querySelectorAll('#page-dashboard canvas[id]');
    Array.prototype.forEach.call(canvases, function(canvas) {
      var title = dashboardChartTitleElement(canvas);
      if (!title) return;
      var label = dashboardChartTitleTextElement(title);
      var button = title.querySelector('.dash-chart-copy');
      if (!button) {
        button = document.createElement('button');
        button.className = 'dash-chart-copy';
        button.type = 'button';
        button.innerHTML = '<span class="material-symbols-outlined">content_copy</span><span>Copiar gráfico</span>';
        title.appendChild(button);
      }
      button.setAttribute('data-canvas-id', canvas.id);
      button.title = 'Copiar somente o gráfico';
      button.setAttribute('aria-label', 'Copiar gráfico ' + dashboardPrintText(label));
      if (button.getAttribute('data-copy-bound') !== '1') {
        button.setAttribute('data-copy-bound', '1');
        button.addEventListener('click', function() { copiarGraficoDashboard(canvas.id, button); });
      }
    });
  }

  function dashboardCopyChartFeedback(button, ok, message) {
    if (button) {
      button.disabled = false;
      button.classList.toggle('is-success', Boolean(ok));
      dashboardSetChartCopyButtonContent_(button, ok ? 'check' : 'error', ok ? 'Copiado!' : 'Tentar novamente');
      window.setTimeout(function() {
        button.classList.remove('is-success');
        dashboardSetChartCopyButtonContent_(button, 'content_copy', 'Copiar gráfico');
      }, 2200);
    }
    if (ok && typeof snack === 'function') snack(message);
    if (!ok && typeof snackErro === 'function') snackErro(message);
  }

  function dashboardSetChartCopyButtonContent_(button, iconName, label) {
    button.textContent = '';
    var icon = document.createElement('span');
    icon.className = 'material-symbols-outlined';
    icon.textContent = iconName;
    var text = document.createElement('span');
    text.textContent = label;
    button.appendChild(icon);
    button.appendChild(text);
  }
  </script>
